<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀함께 · 관리자 · 선한목자교회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F8F8F5;
  --bg-card: #FFFFFF;
  --bg-soft: #F0F1ED;
  --bg-side: #1A1F1D;
  --bg-side-hov: #2A2F2D;

  --ink: #1A1F1D;
  --ink-2: #4A524E;
  --ink-3: #8B8E89;
  --ink-4: #B8BAB6;

  --sage: #4F7361;
  --sage-mid: #6E9483;
  --sage-soft: #B8CFC2;
  --sage-pale: #E5EFE8;
  --sage-dark: #1F3328;

  --terra: #C97757;
  --terra-soft: #F5E5D8;
  --plum: #7A4D72;
  --plum-soft: #F0E3ED;
  --danger: #C5523F;
  --warning: #D89B3F;

  --line: #ECECE8;
  --line-soft: #F4F3EF;

  --sans: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', -apple-system, sans-serif;
  --serif: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  --en: 'Inter', 'Pretendard', sans-serif;

  --shadow-sm: 0 1px 2px rgba(26,31,29,0.04);
  --shadow-md: 0 4px 18px rgba(26,31,29,0.06);
  --shadow-lg: 0 14px 40px rgba(26,31,29,0.12);
  --radius: 12px;
  --radius-sm: 8px;
}
@font-face{
  font-family:'Pretendard'; font-weight:45 920; font-style:normal; font-display:swap;
  src:local('Pretendard Variable'), local('Pretendard'),
      url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; background:var(--bg); font-family:var(--sans); color:var(--ink); font-size:14px; -webkit-font-smoothing:antialiased;}
body{ overflow:hidden; }

/* ============ 로그인 ============ */
.login-bg{
  position:fixed; inset:0;
  background:linear-gradient(135deg, var(--sage-dark) 0%, #2E4537 100%);
  display:flex; align-items:center; justify-content:center;
  z-index:100;
}
.login-bg::before{
  content:''; position:absolute; right:-100px; top:-100px;
  width:400px; height:400px; border-radius:50%;
  background:radial-gradient(circle, rgba(184,207,194,0.18) 0%, transparent 70%);
}
.login-card{
  background:var(--bg-card); border-radius:18px;
  padding:36px 32px;
  width:380px; max-width:90vw;
  box-shadow:0 24px 60px rgba(0,0,0,0.3);
  position:relative;
}
.login-brand{
  display:flex; align-items:center; gap:10px; margin-bottom:8px;
}
.login-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--sage) 0%, var(--sage-dark) 100%);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--serif); font-weight:700; font-size:15px;
}
.login-title{
  font-family:var(--serif); font-size:22px; font-weight:600;
  letter-spacing:-0.5px;
}
.login-sub{ font-size:12px; color:var(--ink-3); margin-bottom:24px; }
.login-card label{
  display:block; font-size:12px; font-weight:700; color:var(--ink-2);
  margin:14px 0 6px;
}
.login-card input{
  width:100%; padding:11px 14px;
  font-family:var(--sans); font-size:14px;
  background:var(--bg-soft); border:1px solid transparent; border-radius:10px;
}
.login-card input:focus{ outline:none; border-color:var(--sage); background:#fff; }
.login-btn{
  width:100%; margin-top:18px; padding:12px;
  background:var(--sage-dark); color:#fff; border:none; border-radius:10px;
  font-family:var(--sans); font-size:14px; font-weight:600;
  cursor:pointer;
}
.login-btn:hover{ background:var(--sage); }
.login-hint{
  margin-top:14px; padding:10px 12px;
  background:#FFF9E6; border:1px solid #F0E6B8;
  border-radius:8px; font-size:11.5px; color:#7D6534;
  letter-spacing:-0.2px; line-height:1.6;
}

/* ============ 레이아웃 ============ */
.app{
  display:flex; height:100vh;
}
.sidebar{
  width:220px; background:var(--bg-side); color:#fff;
  display:flex; flex-direction:column;
  flex-shrink:0;
}
.side-brand{
  padding:20px 18px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.side-mark{
  width:32px; height:32px; border-radius:9px;
  background:linear-gradient(135deg, var(--sage) 0%, var(--sage-mid) 100%);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--serif); font-weight:700; font-size:14px;
}
.side-brand-text{
  font-family:var(--sans); font-weight:700; font-size:15px;
  letter-spacing:-0.3px;
}
.side-brand-sub{
  font-family:var(--en); font-size:9.5px;
  color:rgba(255,255,255,0.5); letter-spacing:1.5px;
  text-transform:uppercase; margin-top:2px;
}
.side-nav{
  padding:14px 10px; flex:1; overflow-y:auto;
}
.side-group-label{
  font-family:var(--en); font-size:10px; font-weight:600;
  color:rgba(255,255,255,0.4); letter-spacing:1.5px;
  text-transform:uppercase;
  padding:14px 10px 6px;
}
.side-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; margin:2px 0;
  font-size:13px; font-weight:500; color:rgba(255,255,255,0.7);
  border-radius:8px; cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.side-item:hover{ background:var(--bg-side-hov); color:#fff; }
.side-item.active{
  background:var(--sage); color:#fff; font-weight:600;
}
.side-item svg{ width:16px; height:16px; }
.side-bottom{
  padding:14px; border-top:1px solid rgba(255,255,255,0.08);
}
.side-user{
  display:flex; align-items:center; gap:10px;
  padding:8px;
}
.side-user-av{
  width:32px; height:32px; border-radius:50%;
  background:var(--sage); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:700; font-size:13px;
}
.side-user-info{ flex:1; min-width:0; }
.side-user-name{ font-size:12.5px; font-weight:600; color:#fff; }
.side-user-role{ font-size:10.5px; color:rgba(255,255,255,0.5); }
.side-logout{
  background:transparent; color:rgba(255,255,255,0.5);
  border:none; cursor:pointer; padding:6px;
  border-radius:6px;
}
.side-logout:hover{ color:#fff; background:var(--bg-side-hov); }
.side-logout svg{ width:16px; height:16px; }

.main{
  flex:1; display:flex; flex-direction:column;
  overflow:hidden;
}
.topbar{
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 26px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.topbar-title{
  font-family:var(--serif); font-size:20px; font-weight:600;
  letter-spacing:-0.3px;
}
.topbar-title small{
  font-family:var(--en); font-size:11px; color:var(--ink-3);
  font-weight:500; margin-left:8px; letter-spacing:1px;
  text-transform:uppercase;
}
.topbar-right{
  display:flex; align-items:center; gap:10px;
}
.sync-chip{
  display:flex; align-items:center; gap:6px;
  font-family:var(--en); font-size:11px; font-weight:500;
  color:var(--ink-3); padding:6px 10px;
  background:var(--bg-soft); border-radius:99px;
}
.sync-chip .dot{
  width:6px; height:6px; border-radius:50%; background:var(--sage-mid);
}
.sync-chip.syncing .dot{ background:var(--terra); animation:pulse 0.7s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.4} }
.demo-chip{
  font-family:var(--en); font-size:10px; font-weight:700;
  background:var(--terra-soft); color:#A45A3F;
  padding:4px 8px; border-radius:6px; letter-spacing:0.5px;
}

.content{
  flex:1; overflow-y:auto;
  padding:24px 26px 40px;
}

/* ============ 대시보드 ============ */
.stat-grid{
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:14px; margin-bottom:24px;
}
.stat-card{
  background:#fff; border:1px solid var(--line);
  border-radius:var(--radius); padding:18px 20px;
}
.stat-label{
  font-size:11.5px; color:var(--ink-3); font-weight:600;
  letter-spacing:-0.2px;
}
.stat-num{
  font-family:var(--en); font-size:28px; font-weight:700;
  color:var(--ink); margin:6px 0 2px;
  letter-spacing:-0.5px;
}
.stat-num.sage{ color:var(--sage); }
.stat-num.terra{ color:var(--terra); }
.stat-num.plum{ color:var(--plum); }
.stat-trend{
  font-size:11px; color:var(--sage); font-weight:600;
}
.stat-trend.down{ color:var(--danger); }
.stat-trend.neutral{ color:var(--ink-3); }

.dashboard-grid{
  display:grid; grid-template-columns:2fr 1fr;
  gap:14px;
}
.panel{
  background:#fff; border:1px solid var(--line);
  border-radius:var(--radius); padding:20px;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.panel-title{
  font-size:14px; font-weight:700; color:var(--ink);
  letter-spacing:-0.2px;
}
.panel-sub{ font-size:11.5px; color:var(--ink-3); font-weight:500; margin-top:1px; }

/* 진행률 바 차트 */
.bar-chart{
  display:flex; flex-direction:column; gap:10px;
}
.bar-row{
  display:flex; align-items:center; gap:10px;
}
.bar-label{
  font-size:12px; color:var(--ink-2); font-weight:600;
  width:80px; flex-shrink:0;
}
.bar-track{
  flex:1; height:10px; background:var(--bg-soft);
  border-radius:99px; overflow:hidden;
}
.bar-fill{
  height:100%; background:linear-gradient(90deg, var(--sage) 0%, var(--sage-mid) 100%);
  border-radius:99px; transition:width 0.5s;
}
.bar-value{
  font-family:var(--en); font-size:12px; font-weight:600;
  color:var(--ink-2); width:48px; text-align:right;
}

/* 인기 칼럼 / 최근 기도 리스트 */
.mini-list{
  display:flex; flex-direction:column;
}
.mini-item{
  padding:10px 0; border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:10px;
}
.mini-item:last-child{ border-bottom:none; }
.mini-rank{
  width:22px; height:22px; border-radius:6px;
  background:var(--bg-soft); color:var(--ink-3);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--en); font-size:11px; font-weight:700;
  flex-shrink:0;
}
.mini-rank.top{ background:var(--sage); color:#fff; }
.mini-body{ flex:1; min-width:0; }
.mini-ttl{
  font-size:12.5px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  letter-spacing:-0.2px;
}
.mini-meta{ font-size:11px; color:var(--ink-3); font-weight:500; margin-top:2px; }
.mini-num{
  font-family:var(--en); font-size:13px; font-weight:700;
  color:var(--sage);
}

/* ============ 묵상 본문 관리 ============ */
.dev-layout{
  display:grid; grid-template-columns:280px 1fr;
  gap:14px; height:calc(100vh - 130px);
}
.dev-list-panel{
  background:#fff; border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column;
}
.dev-list-head{
  padding:14px 16px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.dev-list-title{ font-size:13px; font-weight:700; color:var(--ink); }
.dev-month-pick{
  font-family:var(--en); font-size:11px; color:var(--ink-3);
  padding:4px 8px; background:var(--bg-soft); border-radius:6px;
  border:none; cursor:pointer;
}
.dev-list{ flex:1; overflow-y:auto; padding:6px; }
.dev-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 12px; cursor:pointer;
  border-radius:6px; margin:1px 0;
  font-size:12.5px;
}
.dev-row:hover{ background:var(--bg-soft); }
.dev-row.active{ background:var(--sage-pale); color:var(--sage-dark); font-weight:600; }
.dev-row-left{ display:flex; align-items:center; gap:10px; }
.dev-row-date{
  font-family:var(--en); font-weight:700; width:46px;
}
.dev-row-info{
  font-size:11.5px; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  max-width:130px;
}
.dev-row.active .dev-row-info{ color:var(--sage); }
.dev-row-status{
  font-size:9.5px; font-weight:700;
  padding:2px 7px; border-radius:99px;
  letter-spacing:-0.2px; white-space:nowrap;
}
.dev-row-status.empty{ background:var(--bg-soft); color:var(--ink-4); }
.dev-row-status.seed{ background:#FFF1DB; color:#A87530; }
.dev-row-status.custom{ background:var(--sage-pale); color:var(--sage-dark); }

.dev-edit-panel{
  background:#fff; border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column;
}
.dev-edit-head{
  padding:14px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.dev-edit-title{
  font-family:var(--serif); font-size:17px; font-weight:600;
  letter-spacing:-0.3px;
}
.dev-edit-sub{ font-size:11.5px; color:var(--ink-3); margin-top:2px; font-family:var(--en); letter-spacing:0.5px; }
.dev-edit-actions{ display:flex; gap:8px; }
.dev-edit-body{
  flex:1; overflow-y:auto; padding:20px 24px;
}
.dev-form-row{
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px; margin-bottom:14px;
}
.dev-form-row.single{ grid-template-columns:1fr; }
.dev-form-row.triple{ grid-template-columns:1fr 1fr 1fr; }
.dev-field{ display:flex; flex-direction:column; }
.dev-field label{
  font-size:11px; font-weight:700; color:var(--ink-2);
  margin-bottom:5px; letter-spacing:-0.2px;
}
.dev-field input, .dev-field textarea{
  font-family:var(--sans); font-size:13px;
  background:var(--bg-soft); border:1px solid transparent;
  border-radius:8px; padding:9px 12px;
  color:var(--ink);
  resize:vertical; min-height:36px;
}
.dev-field textarea{ font-family:var(--sans); line-height:1.7; }
.dev-field textarea.serif{ font-family:var(--serif); font-size:14px; line-height:1.85; }
.dev-field input:focus, .dev-field textarea:focus{
  outline:none; border-color:var(--sage); background:#fff;
}
.dev-section{
  margin-top:24px; padding-top:18px;
  border-top:1px solid var(--line-soft);
}
.dev-section-h{
  font-size:12px; font-weight:700; color:var(--sage-dark);
  margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
  letter-spacing:-0.2px;
}
.dev-section-h::before{
  content:''; width:3px; height:14px; border-radius:99px;
  background:var(--sage);
}
.prayer-block-edit{
  background:var(--bg-soft); border-radius:10px;
  padding:12px; margin-bottom:10px;
  display:grid; grid-template-columns:120px 1fr; gap:10px;
}
.prayer-block-edit .field-stack{
  display:flex; flex-direction:column; gap:8px;
}
.prayer-block-edit input, .prayer-block-edit textarea{
  background:#fff; border:1px solid var(--line);
  border-radius:6px; padding:8px 10px;
  font-family:var(--sans); font-size:12.5px;
}
.prayer-block-edit textarea{ font-family:var(--serif); line-height:1.7; min-height:60px; }
.prayer-block-actions{
  display:flex; justify-content:flex-end; gap:6px; margin-bottom:8px;
}

.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  flex:1; padding:40px;
  text-align:center; color:var(--ink-3);
}
.empty-state svg{ width:48px; height:48px; opacity:0.5; margin-bottom:12px; }
.empty-state p{ font-size:13px; line-height:1.7; }

/* ============ 칼럼 / 기도 공통 ============ */
.table{
  width:100%; background:#fff;
  border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden;
}
.table table{ width:100%; border-collapse:collapse; }
.table th, .table td{
  text-align:left; padding:11px 14px;
  border-bottom:1px solid var(--line-soft);
  font-size:12.5px; vertical-align:middle;
}
.table th{
  font-size:11px; font-weight:700; color:var(--ink-3);
  letter-spacing:-0.2px; background:var(--bg-soft);
  border-bottom:1px solid var(--line);
  text-transform:none;
}
.table tr:last-child td{ border-bottom:none; }
.table tr:hover td{ background:var(--bg-soft); }
.table tr.hidden-row td{ opacity:0.5; }
.table tr.urgent-row td{ background:#FBEFE7; }
.table tr.urgent-row:hover td{ background:#F5E5D8; }
.tag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:700;
  padding:3px 8px; border-radius:99px;
  letter-spacing:-0.2px; white-space:nowrap;
}
.tag.sage{ background:var(--sage-pale); color:var(--sage-dark); }
.tag.terra{ background:var(--terra-soft); color:#A45A3F; }
.tag.plum{ background:var(--plum-soft); color:#5D3856; }
.tag.cream{ background:#FFF1DB; color:#A87530; }
.tag.mute{ background:var(--bg-soft); color:var(--ink-3); }

.cell-truncate{
  max-width:340px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cell-time{ font-family:var(--en); font-size:11.5px; color:var(--ink-3); }
.cell-name{ font-weight:600; }

.action-row{ display:flex; gap:4px; justify-content:flex-end; }
.action-btn{
  background:transparent; border:1px solid var(--line);
  border-radius:6px; padding:5px 9px;
  font-family:var(--sans); font-size:11.5px; font-weight:600;
  color:var(--ink-2); cursor:pointer;
  white-space:nowrap;
}
.action-btn:hover{ background:var(--bg-soft); }
.action-btn.danger{ color:var(--danger); border-color:#F0CFC7; }
.action-btn.danger:hover{ background:#F9E8E3; }
.action-btn.warn{ color:#A87530; border-color:#F0E0BB; }
.action-btn.warn:hover{ background:#FFF1DB; }
.action-btn.sage{ color:var(--sage); border-color:var(--sage-soft); }
.action-btn.sage:hover{ background:var(--sage-pale); }

/* ============ 칼럼 편집 모달 ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(26,31,29,0.45);
  z-index:200; display:none;
  align-items:center; justify-content:center;
}
.modal-overlay.show{ display:flex; }
.modal{
  background:#fff; border-radius:14px;
  width:680px; max-width:95vw;
  max-height:90vh; overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,0.3);
}
.modal-head{
  padding:18px 22px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-title{
  font-family:var(--serif); font-size:17px; font-weight:600;
  letter-spacing:-0.3px;
}
.modal-close{
  background:transparent; border:none; cursor:pointer;
  color:var(--ink-3); padding:6px;
}
.modal-close svg{ width:18px; height:18px; }
.modal-body{ padding:20px 22px; }
.modal-foot{
  padding:14px 22px; border-top:1px solid var(--line);
  display:flex; justify-content:flex-end; gap:8px;
}

/* ============ 공통 버튼 ============ */
.btn{
  font-family:var(--sans); font-size:13px; font-weight:600;
  padding:9px 16px; border-radius:8px; border:none;
  background:var(--sage-dark); color:#fff; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:background 0.15s;
}
.btn:hover{ background:var(--sage); }
.btn-secondary{
  background:var(--bg-soft); color:var(--ink);
}
.btn-secondary:hover{ background:var(--line); }
.btn-danger{ background:var(--danger); }
.btn-danger:hover{ background:#A8412F; }
.btn-ghost{
  background:transparent; color:var(--ink-2); border:1px solid var(--line);
}
.btn-ghost:hover{ background:var(--bg-soft); }
.btn svg{ width:15px; height:15px; }

/* 토스트 */
.toast{
  position:fixed; right:24px; bottom:24px;
  background:var(--ink); color:#fff;
  padding:12px 18px; border-radius:10px;
  font-size:13px; font-weight:500;
  box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(20px);
  transition:all 0.2s;
  z-index:300; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateY(0); }
.toast.danger{ background:var(--danger); }
.toast.success{ background:var(--sage); }

.view{ display:none; }
.view.active{ display:block; }

/* 좁은 화면 — 사이드바 접힘 (간단) */
@media (max-width:900px){
  .sidebar{ width:60px; }
  .side-brand-text, .side-brand-sub, .side-item span, .side-group-label, .side-user-info{ display:none; }
  .side-user{ justify-content:center; }
  .dashboard-grid{ grid-template-columns:1fr; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .dev-layout{ grid-template-columns:200px 1fr; }
}
@media (max-width:640px){
  .content{ padding:14px; }
  .dev-layout{ grid-template-columns:1fr; height:auto; }
  .stat-grid{ grid-template-columns:1fr 1fr; }
}

/* ============================================================================
   가짜 API 레이어 — 사용자 데모와 동일한 키 사용
   ============================================================================ */
var STORAGE_KEYS = {
  user:'mh_v05_user',
  lectio:'mh_v05_lectio',
  prayers:'mh_v05_prayers',
  prayed:'mh_v05_prayed',
  columnState:'mh_v05_column_state',
  prefs:'mh_v05_prefs',
  devotionalsCustom:'mh_v05_devotionals_custom',
  columnsCustom:'mh_v05_columns_custom',
  prayersHidden:'mh_v05_prayers_hidden',
  prayersSeedVersion:'mh_v05_prayers_seed_version',
  adminSession:'mh_v05_admin_session',
};

// 시드 스키마/내용 호환을 위해 버전을 관리한다.
// 변경 시 bump → 다음 로드에 migratePrayersSeed()가 누락 ID/필드를 보강.
var PRAYERS_SEED_VERSION = 2;

function migratePrayersSeed(){
  try{
    var raw = localStorage.getItem(STORAGE_KEYS.prayers);
    if(!raw) return; // 첫 로드 — 자연스럽게 새 시드가 기록됨
    var stored;
    try{ stored = JSON.parse(raw); }catch(e){ return; }
    if(!Array.isArray(stored)) return;
    var ver = parseInt(localStorage.getItem(STORAGE_KEYS.prayersSeedVersion)||'1', 10);
    if(ver >= PRAYERS_SEED_VERSION) return;

    var byId = {};
    stored.forEach(function(p){ if(p && p.id != null) byId[p.id] = p; });
    var seedIds = {};
    var merged = PRAYERS_SEED.map(function(seed){
      seedIds[seed.id] = true;
      var existing = byId[seed.id];
      if(!existing) return Object.assign({}, seed);
      // 시드 본문/필드를 새 스키마로 갱신하되 사용자 토글 상태(urgent, _origScope, count)는 보존.
      var keepUrgent = !!existing.urgent;
      var origScope = existing._origScope || (keepUrgent ? seed.scope : null);
      var scope = keepUrgent ? 'urgent' : seed.scope;
      var merged = Object.assign({}, seed, {
        urgent: keepUrgent,
        scope: scope,
        count: (typeof existing.count === 'number') ? existing.count : seed.count
      });
      if(origScope) merged._origScope = origScope;
      return merged;
    });
    // 시드 외 사용자가 추가한 항목(미래 대비)이 있다면 보존
    stored.forEach(function(p){
      if(p && p.id != null && !seedIds[p.id]) merged.push(p);
    });
    localStorage.setItem(STORAGE_KEYS.prayers, JSON.stringify(merged));
    localStorage.setItem(STORAGE_KEYS.prayersSeedVersion, String(PRAYERS_SEED_VERSION));
  }catch(e){}
}

function _delay(min,max){ return new Promise(function(r){ setTimeout(r, min + Math.random()*(max-min)); }); }
function _read(key, fallback){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function _write(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

var adminApi = {
  // ─── 묵상 본문 ───
  getDevotional: function(dateKey){
    return _delay(50,150).then(function(){
      var custom = _read(STORAGE_KEYS.devotionalsCustom, {});
      if(custom[dateKey]) return Object.assign({}, custom[dateKey], {_source:'custom'});
      var seed = WORD_DATA[dateKey];
      if(seed) return Object.assign({}, seed, {_source:'seed'});
      return {_source:'empty'};
    });
  },
  saveDevotional: function(dateKey, data){
    syncOn();
    return _delay(250,500).then(function(){
      var all = _read(STORAGE_KEYS.devotionalsCustom, {});
      all[dateKey] = Object.assign({}, data, {updatedAt:Date.now()});
      _write(STORAGE_KEYS.devotionalsCustom, all);
      syncOff();
      return {ok:true};
    });
  },
  resetDevotional: function(dateKey){
    syncOn();
    return _delay(150,300).then(function(){
      var all = _read(STORAGE_KEYS.devotionalsCustom, {});
      delete all[dateKey];
      _write(STORAGE_KEYS.devotionalsCustom, all);
      syncOff();
      return {ok:true};
    });
  },
  listDevotionalsMonth: function(year, month){
    return _delay(50,150).then(function(){
      var custom = _read(STORAGE_KEYS.devotionalsCustom, {});
      var lastDay = new Date(year, month, 0).getDate();
      var list = [];
      for(var d=1; d<=lastDay; d++){
        var key = year+'-'+pad(month)+'-'+pad(d);
        var seed = WORD_DATA[key];
        var cust = custom[key];
        list.push({
          dateKey:key, day:d,
          dow:new Date(year, month-1, d).getDay(),
          subtitle: (cust && cust.subtitle) || (seed && seed.subtitle) || '',
          range: (cust && cust.range) || (seed && seed.range) || '',
          status: cust ? 'custom' : (seed ? 'seed' : 'empty')
        });
      }
      return list;
    });
  },

  // ─── 칼럼 ───
  listColumnsAll: function(){
    return _delay(80,180).then(function(){
      var custom = _read(STORAGE_KEYS.columnsCustom, {});
      var merged = [];
      COLUMNS_SEED.forEach(function(c){
        var override = custom[c.id];
        if(override && override._deleted){
          // 삭제 표시된 시드 — 관리자에서는 (삭제됨) 으로 보임
          merged.push(Object.assign({}, c, {_deletedSeed:true, draft:true}));
        }else{
          merged.push(override ? Object.assign({}, c, override) : c);
        }
      });
      Object.keys(custom).forEach(function(id){
        var c = custom[id];
        if(c && !c._deleted && parseInt(id,10) > 1000){
          merged.push(c);
        }
      });
      // 최신순
      return merged.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    });
  },
  saveColumn: function(col){
    syncOn();
    return _delay(250,450).then(function(){
      var custom = _read(STORAGE_KEYS.columnsCustom, {});
      var id = col.id;
      if(!id){
        // 신규 — 1001부터 시작
        var existing = Object.keys(custom).map(Number).filter(function(n){return n>1000;});
        id = existing.length ? Math.max.apply(null, existing)+1 : 1001;
        col.id = id;
      }
      custom[id] = Object.assign({}, col, {updatedAt:Date.now()});
      _write(STORAGE_KEYS.columnsCustom, custom);
      syncOff();
      return {ok:true, id:id};
    });
  },
  deleteColumn: function(id){
    syncOn();
    return _delay(150,300).then(function(){
      var custom = _read(STORAGE_KEYS.columnsCustom, {});
      // 시드는 _deleted 플래그, custom은 완전 삭제
      var isSeed = COLUMNS_SEED.some(function(c){return c.id===id;});
      if(isSeed){
        custom[id] = Object.assign(custom[id]||{}, {_deleted:true, id:id});
      }else{
        delete custom[id];
      }
      _write(STORAGE_KEYS.columnsCustom, custom);
      syncOff();
      return {ok:true};
    });
  },
  restoreColumn: function(id){
    syncOn();
    return _delay(100,200).then(function(){
      var custom = _read(STORAGE_KEYS.columnsCustom, {});
      if(custom[id]){
        delete custom[id]._deleted;
        if(Object.keys(custom[id]).length<=1){ delete custom[id]; }
      }
      _write(STORAGE_KEYS.columnsCustom, custom);
      syncOff();
      return {ok:true};
    });
  },

  // ─── 중보기도 ───
  listPrayersAll: function(){
    return _delay(80,180).then(function(){
      var stored = _read(STORAGE_KEYS.prayers, null);
      var base = stored || PRAYERS_SEED;
      if(!stored){
        _write(STORAGE_KEYS.prayers, PRAYERS_SEED);
        _write(STORAGE_KEYS.prayersSeedVersion, PRAYERS_SEED_VERSION);
      }
      var hidden = _read(STORAGE_KEYS.prayersHidden, []);
      return base.slice().sort(function(a,b){ return b.time-a.time; }).map(function(p){
        return Object.assign({}, p, {hidden:hidden.indexOf(p.id)>=0});
      });
    });
  },
  togglePrayerUrgent: function(id){
    syncOn();
    return _delay(150,300).then(function(){
      var all = _read(STORAGE_KEYS.prayers, PRAYERS_SEED);
      var t = all.filter(function(p){return p.id===id;})[0];
      if(t){
        t.urgent = !t.urgent;
        if(t.urgent && t.scope!=='urgent'){ t._origScope = t._origScope || t.scope; t.scope = 'urgent'; }
        if(!t.urgent && t._origScope){ t.scope = t._origScope; delete t._origScope; }
      }
      _write(STORAGE_KEYS.prayers, all);
      syncOff();
      return {ok:true, urgent:t && t.urgent};
    });
  },
  togglePrayerHide: function(id){
    syncOn();
    return _delay(120,250).then(function(){
      var hidden = _read(STORAGE_KEYS.prayersHidden, []);
      var i = hidden.indexOf(id);
      if(i>=0) hidden.splice(i,1); else hidden.push(id);
      _write(STORAGE_KEYS.prayersHidden, hidden);
      syncOff();
      return {ok:true, hidden:i<0};
    });
  },
  deletePrayer: function(id){
    syncOn();
    return _delay(150,300).then(function(){
      var all = _read(STORAGE_KEYS.prayers, PRAYERS_SEED);
      var i = -1;
      for(var k=0;k<all.length;k++) if(all[k].id===id){ i=k; break; }
      if(i>=0) all.splice(i,1);
      _write(STORAGE_KEYS.prayers, all);
      // 숨김 목록에서도 제거
      var hidden = _read(STORAGE_KEYS.prayersHidden, []);
      var hi = hidden.indexOf(id);
      if(hi>=0){ hidden.splice(hi,1); _write(STORAGE_KEYS.prayersHidden, hidden); }
      syncOff();
      return {ok:true};
    });
  },

  // ─── 통계 ───
  stats: function(){
    return _delay(100,200).then(function(){
      var custom = _read(STORAGE_KEYS.devotionalsCustom, {});
      var stored = _read(STORAGE_KEYS.prayers, null) || PRAYERS_SEED;
      var hidden = _read(STORAGE_KEYS.prayersHidden, []);
      var colState = _read(STORAGE_KEYS.columnState, {});
      var lectio = _read(STORAGE_KEYS.lectio, {});

      // 사용자 묵상 진행 통계 (시드 + 사용자 입력)
      var lectioAll = Object.assign({}, {
        '2026-01-01':{meditatio1:'a',meditatio2:'a',meditatio3:'a',oratio:'a',contemplatio:'a',scribo_walk:'a',scribo_obey:'a',thanks:['a','a','a']},
        '2026-01-02':{meditatio1:'a',meditatio2:'a',meditatio3:'a',oratio:'',contemplatio:'',scribo_walk:'',scribo_obey:'',thanks:['','','']},
        '2026-01-03':{meditatio1:'a',meditatio2:'a',meditatio3:'a',oratio:'a',contemplatio:'a',scribo_walk:'',scribo_obey:'',thanks:['','','']},
      }, lectio);
      var stages = [0,0,0,0]; var doneAny = 0; var fullDone = 0;
      Object.keys(lectioAll).forEach(function(k){
        var d = lectioAll[k];
        var s1 = (d.meditatio1||'').trim() && (d.meditatio2||'').trim() && (d.meditatio3||'').trim() ? 1:0;
        var s2 = (d.oratio||'').trim() ? 1:0;
        var s3 = (d.contemplatio||'').trim() ? 1:0;
        var s4 = (d.scribo_walk||'').trim() && (d.scribo_obey||'').trim() && (d.thanks||[]).some(function(t){return t.trim();}) ? 1:0;
        stages[0]+=s1; stages[1]+=s2; stages[2]+=s3; stages[3]+=s4;
        var t = s1+s2+s3+s4;
        if(t>0) doneAny++;
        if(t===4) fullDone++;
      });
      var totalDays = Object.keys(lectioAll).length;

      // 인기 칼럼 — 시드 + 관리자가 추가/덮어쓴 칼럼, 삭제/대기 제외
      var colsCustom = _read(STORAGE_KEYS.columnsCustom, {});
      var mergedCols = [];
      COLUMNS_SEED.forEach(function(c){
        var override = colsCustom[c.id];
        if(override && override._deleted) return;
        mergedCols.push(override ? Object.assign({}, c, override) : c);
      });
      Object.keys(colsCustom).forEach(function(id){
        var c = colsCustom[id];
        if(c && !c._deleted && parseInt(id,10) > 1000) mergedCols.push(c);
      });
      var publishedCols = mergedCols.filter(function(c){ return !c.draft; });
      var colsWithStats = publishedCols.map(function(c){
        var s = colState[c.id]||{};
        return {
          id:c.id, title:c.title, category:c.category,
          likes: (c.likes||0) + (s.liked?1:0),
          reads: (c.reads||0) + (s.read?1:0)
        };
      });
      colsWithStats.sort(function(a,b){return b.likes-a.likes;});

      // 최근 기도
      var recent = stored.slice().sort(function(a,b){return b.time-a.time;}).slice(0,5);

      return {
        // 사용자 시뮬레이션 (실제 서버 연동 시 진짜 데이터로)
        dau: 247 + Math.floor(Math.random()*20),
        wau: 1432 + Math.floor(Math.random()*40),
        subscribers: 3284,
        devotionalsReady: Object.keys(custom).length,
        prayersActive: stored.length - hidden.length,
        prayersUrgent: stored.filter(function(p){return p.urgent && hidden.indexOf(p.id)<0;}).length,
        columnsLiked: colsWithStats.reduce(function(s,c){return s+c.likes;},0),
        columnsPublished: publishedCols.length,
        lectio:{ totalDays:totalDays, doneAny:doneAny, fullDone:fullDone, stages:stages },
        topColumns: colsWithStats.slice(0,5),
        recentPrayers: recent
      };
    });
  },
};

/* ============================================================================
   유틸
   ============================================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function formatRel(ts){
  var diff = (Date.now()-ts)/1000;
  if(diff<60) return '방금 전';
  if(diff<3600) return Math.floor(diff/60)+'분 전';
  if(diff<86400) return Math.floor(diff/3600)+'시간 전';
  return Math.floor(diff/86400)+'일 전';
}
function toast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className='toast'; }, 2200);
}
var _syncTimer = null;
function syncOn(){
  var c = document.getElementById('syncChip'), t = document.getElementById('syncText');
  if(!c) return;
  c.className = 'sync-chip syncing';
  t.textContent = '저장 중';
  clearTimeout(_syncTimer);
}
function syncOff(){
  var c = document.getElementById('syncChip'), t = document.getElementById('syncText');
  if(!c) return;
  c.className = 'sync-chip';
  t.textContent = '동기화됨';
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ t.textContent = '동기화됨 · 방금 전'; }, 3000);
}

function login(){
  var pw = document.getElementById('loginPw').value;
  if(pw !== 'admin'){
    toast('비밀번호가 올바르지 않습니다', 'danger');
    return;
  }
  _write(STORAGE_KEYS.adminSession, {at:Date.now()});
  showApp();
}
function logout(){
  try{ localStorage.removeItem(STORAGE_KEYS.adminSession); }catch(e){}
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminApp').style.display='none';
}
function checkSession(){
  var s = _read(STORAGE_KEYS.adminSession, null);
  if(s && (Date.now()-s.at < 24*3600*1000)) return true;
  return false;
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminApp').style.display='flex';
  switchView('dashboard');
}

  window.open('말씀함께_데모_v0.5.html', '_blank');
}

var currentView = 'dashboard';
function switchView(v){
  currentView = v;
  var items = document.querySelectorAll('.side-item');
  for(var i=0;i<items.length;i++){
    items[i].className = items[i].className.replace(/\bactive\b/g,'').trim();
    if(items[i].getAttribute('data-view')===v) items[i].className += ' active';
  }
  var views = document.querySelectorAll('.view');
  for(var j=0;j<views.length;j++){ views[j].className = views[j].className.replace(/\bactive\b/g,'').trim(); }
  document.getElementById('view-'+v).className = 'view active';
  document.getElementById('pageTitle').innerHTML = {
    'dashboard':'대시보드 <small>Dashboard</small>',
    'devotional':'묵상 본문 관리 <small>Devotional CMS</small>',
    'column':'칼럼 발행 관리 <small>Columns</small>',
    'prayer':'중보기도 모더레이션 <small>Prayer Moderation</small>',
    'mypage':'내 페이지 <small>My Page</small>',
    'settings':'설정 <small>Settings</small>'
  }[v];
  render();
}

function render(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='devotional') renderDevotional();
  else if(currentView==='column') renderColumn();
  else if(currentView==='prayer') renderPrayer();
  else if(currentView==='mypage') renderMypage();
  else if(currentView==='settings') renderSettingsAdmin();
}

function exportBackup(){
  var data = {};
  Object.keys(STORAGE_KEYS).forEach(function(k){
    var v = localStorage.getItem(STORAGE_KEYS[k]);
    if(v) data[STORAGE_KEYS[k]] = v;
  });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '말씀함께_백업_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('백업 파일이 다운로드되었습니다', 'success');
}

function importBackup(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        if(!confirm('백업 파일에서 ' + Object.keys(data).length + '개 항목을 복원합니다. 현재 데이터가 덮어쓰여집니다. 계속할까요?')) return;
        Object.keys(data).forEach(function(k){ localStorage.setItem(k, data[k]); });
        toast('복원되었습니다 — 새로고침 합니다', 'success');
        setTimeout(function(){ location.reload(); }, 800);
      }catch(err){
        toast('백업 파일을 읽을 수 없습니다', 'danger');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAllDemo(){
  if(!confirm('모든 데모 데이터를 영구 삭제합니다.\n(사용자 묵상 기록·기도제목·칼럼 편집·관리자 설정 포함)\n\n정말 진행할까요?')) return;
  Object.keys(STORAGE_KEYS).forEach(function(k){
    try{ localStorage.removeItem(STORAGE_KEYS[k]); }catch(e){}

}

function pickMonth(){
  var input = prompt('년도-월을 입력하세요 (예: 2026-01)', devState.year+'-'+pad(devState.month));
  if(!input) return;
  var m = input.match(/^(\d{4})-(\d{1,2})$/);
  if(!m){ toast('형식이 올바르지 않습니다','danger'); return; }
  devState.year = parseInt(m[1],10);
  devState.month = parseInt(m[2],10);
  devState.selected = devState.year+'-'+pad(devState.month)+'-01';
  renderDevotional();
}

function selectDev(dateKey){
  devState.selected = dateKey;
  var rows = document.querySelectorAll('.dev-row');
  for(var i=0;i<rows.length;i++) rows[i].className = rows[i].className.replace(/\bactive\b/g,'').trim();
  // 클릭한 row에 active
  for(var j=0;j<rows.length;j++){
    if(rows[j].getAttribute('onclick').indexOf(dateKey)>=0){
      rows[j].className += ' active'; break;
    }
  }
  loadDevEdit(dateKey);
}

function collectDevForm(){
  function v(id){ var el=document.getElementById(id); return el ? el.value : ''; }
  function chk(id){ var el=document.getElementById(id); return !!(el && el.checked); }
  var prayers = [];
  var blocks = document.getElementById('prayerBlocks').getElementsByClassName('prayer-block-edit');
  for(var i=0;i<blocks.length;i++){
    var inputs = blocks[i].getElementsByTagName('input');
    var areas = blocks[i].getElementsByTagName('textarea');
    var p = {};
    for(var j=0;j<inputs.length;j++) p[inputs[j].getAttribute('data-field')] = inputs[j].value;
    for(var k=0;k<areas.length;k++) p[areas[k].getAttribute('data-field')] = areas[k].value;
    if(p.body || p.verse || p.ref) prayers.push(p);
  }
  return {
    sunday:chk('d-sunday'),
    book:v('d-book'), chapter:v('d-chapter'), range:v('d-range'),
    subtitle:v('d-subtitle'), theme:v('d-theme'),
    hymn:{no:v('d-hymn-no'), title:v('d-hymn-title')},
    maek:v('d-maek'),
    amsung:{ref:v('d-amsung-ref'), text:v('d-amsung-text')},
    passage:v('d-passage'),
    exposition:v('d-exposition'),
    question:v('d-question'),
    prayer:prayers
  };
}

function saveCol(id){
  var col = {
    id: id || null,
    category: document.getElementById('c-cat').value,
    cover: document.getElementById('c-cover').value,
    pastor: document.getElementById('c-pastor').value,
    date: document.getElementById('c-date').value,
    title: document.getElementById('c-title').value,
    excerpt: document.getElementById('c-excerpt').value,
    body: document.getElementById('c-body').value,
    draft: document.getElementById('c-draft').checked
  };
  // 기존 칼럼이면 likes/reads/comments 등 사용자 활동 데이터를 보존
  var ready = id
    ? adminApi.listColumnsAll().then(function(cols){
        for(var i=0;i<cols.length;i++) if(cols[i].id===id) return cols[i];
        return null;
      })
    : Promise.resolve(null);
  ready.then(function(existing){
    if(existing){
      if(typeof existing.likes === 'number') col.likes = existing.likes;
      if(typeof existing.reads === 'number') col.reads = existing.reads;
      if(Array.isArray(existing.comments)) col.comments = existing.comments;
    }else{
      col.likes = 0; col.reads = 0; col.comments = [];
    }
    adminApi.saveColumn(col).then(function(){
      toast(col.draft ? '대기 상태로 저장됨' : '발행되었습니다 — 사용자 화면에 즉시 노출', 'success');
      closeModal(); renderColumn();
    });
  });
}
function deleteCol(id){
  if(!confirm('이 칼럼을 삭제할까요?\n시드 칼럼은 숨김 처리되어 나중에 복구할 수 있습니다.')) return;
  adminApi.deleteColumn(id).then(function(){
    toast('삭제되었습니다');
    renderColumn();
  });
}
function restoreCol(id){
  adminApi.restoreColumn(id).then(function(){
    toast('복구되었습니다');
    renderColumn();
  });
}

/* ============================================================================
   중보기도 모더레이션
   ============================================================================ */
var prayerFilter = 'all';
function renderPrayer(){
  var view = document.getElementById('view-prayer');
  view.innerHTML =
    '<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">' +
      ['all','active','urgent','hidden'].map(function(k){
        return '<button class="action-btn '+(prayerFilter===k?'sage':'')+'" onclick="setPrayerFilter(\''+k+'\')">'+
          {all:'전체',active:'활성',urgent:'긴급',hidden:'숨김'}[k]+'</button>';
      }).join('') +
      '<div style="margin-left:auto;font-size:11.5px;color:var(--ink-3)" id="prayerSummary">···</div>' +
    '</div>' +
    '<div class="table"><table>' +
      '<thead><tr>' +
        '<th style="width:14%">작성자</th>' +
        '<th>내용</th>' +
        '<th style="width:9%">범위</th>' +
        '<th style="width:12%;text-align:center">시간</th>' +
        '<th style="width:11%;text-align:center">중보</th>' +
        '<th style="width:22%;text-align:right">작업</th>' +
      '</tr></thead>' +
      '<tbody id="prayerTbody"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--ink-3)">불러오는 중…</td></tr></tbody>' +
    '</table></div>';

  adminApi.listPrayersAll().then(function(prayers){
    var filtered = prayers.filter(function(p){
      if(prayerFilter==='all') return true;
      if(prayerFilter==='active') return !p.hidden;
      if(prayerFilter==='urgent') return p.urgent && !p.hidden;
      if(prayerFilter==='hidden') return p.hidden;
      return true;
    });
    var summary = '전체 '+prayers.length+'건 · 긴급 '+prayers.filter(function(p){return p.urgent;}).length+'건 · 숨김 '+prayers.filter(function(p){return p.hidden;}).length+'건';
    document.getElementById('prayerSummary').textContent = summary;
    document.getElementById('prayerTbody').innerHTML = filtered.length
      ? filtered.map(function(p){
          var scopeTag = {church:'sage', zone:'sage', cell:'cream', urgent:'terra', committee:'plum'}[p.scope] || 'mute';
          var scopeLbl = {church:'교회', zone:'교구', cell:'목장', urgent:'긴급', committee:'위원회'}[p.scope] || p.scope;
          return '<tr class="'+(p.urgent?'urgent-row ':'')+(p.hidden?'hidden-row':'')+'">' +
            '<td>' +
              '<div style="display:flex;align-items:center;gap:8px">' +
                '<div style="width:28px;height:28px;border-radius:50%;background:var(--sage-pale);color:var(--sage-dark);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:11px">'+escapeHtml(p.avatar||'?')+'</div>' +
                '<div class="cell-name">'+escapeHtml(p.who)+'</div>' +
              '</div>' +
            '</td>' +
            '<td><div class="cell-truncate" title="'+escapeHtml(p.body)+'">'+escapeHtml(p.body)+'</div></td>' +
            '<td><span class="tag '+scopeTag+'">'+scopeLbl+'</span></td>' +
            '<td style="text-align:center" class="cell-time">'+formatRel(p.time)+'</td>' +
            '<td style="text-align:center"><span style="font-family:var(--en);font-size:12px;font-weight:600;color:var(--ink-2)">'+(p.count||0)+'</span></td>' +
            '<td>' +
              '<div class="action-row">' +
                '<button class="action-btn '+(p.urgent?'warn':'')+'" onclick="togglePUrg('+p.id+')">'+(p.urgent?'긴급 해제':'긴급 표시')+'</button>' +
                '<button class="action-btn" onclick="togglePHide('+p.id+')">'+(p.hidden?'다시 표시':'숨기기')+'</button>' +
                '<button class="action-btn danger" onclick="delP('+p.id+')">삭제</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('')
      : '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--ink-3)">해당 항목이 없습니다.</td></tr>';
  });
}

function setPrayerFilter(f){
  prayerFilter = f;
  renderPrayer();
}
function togglePUrg(id){
  adminApi.togglePrayerUrgent(id).then(function(r){
    toast(r.urgent ? '긴급으로 표시' : '긴급 해제');
    renderPrayer();
  });
}
function togglePHide(id){
  adminApi.togglePrayerHide(id).then(function(r){
    toast(r.hidden ? '사용자 화면에서 숨김' : '다시 표시');
    renderPrayer();
  });
}
function delP(id){
  if(!confirm('이 기도제목을 완전히 삭제할까요?')) return;
  adminApi.deletePrayer(id).then(function(){
    toast('삭제되었습니다');
    renderPrayer();
  });
}

/* ============================================================================
   모달
   ============================================================================ */
function openModal(){ document.getElementById('modal').className = 'modal-overlay show'; }
function closeModal(){ document.getElementById('modal').className = 'modal-overlay'; }

/* ============================================================================
   초기화
   ============================================================================ */
function init(){
  migratePrayersSeed();
  if(checkSession()){ showApp(); }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{ init(); }
</script>
</body>
</html>
