 걸었던 위대한 흔적들이 뭍어있는 곳이라 말씀함께 묵상하며 선진들의 믿음을 떠올려보게하는데 의미가 있다 생각합니다♡", "ids": ["1j6WlTw-hIhF1tLy8XuswUaosFwGTbRCN"], "files": []}, {"n": 178, "ts": "2026. 8. 23 오후 7:43:50", "name": "조유진", "church": "선한목자교회 요셉1교구", "ours": true, "title": "하나님의 걸작품", "place": "홍천", "when": "2026년 8월 뜨거운 여름 날", "story": "가정예배 후 보여주신 하나님의 모든 걸작품에 감사하며 사랑으로 화답하는 가정 !", "ids": ["1X490DTVIyBvKVfDaVqaeNIl2SBLcO62b", "1ebeIJxcbIbjoRnczAvGWVTrsdGZh9g_W"], "files": []}, {"n": 179, "ts": "2026. 8. 11 오후 3:49:11", "name": "김예담", "church": "선한목자교회 젊은이교회", "ours": true, "title": "물가에 심긴 나무와 아름다운 열매들", "place": "양재천", "when": "2026년 5월", "story": "카페에서 함께 말씀함께를 마치고 밖에서 사진을 찍던 중에 모르는 분이 다가오시더니\n\"두 분 찍었는데 사진이 너무 잘 나와서 보내드릴게요\" 하면서 받은 사진입니다.\n \n그 상황을 통해 서로 다르지만 아름답게 창조된 우리를 주님께서 마치 멀리서 바라보고 흐뭇하게 보고 계시다는 느낌을 받았습니다.\n\n또한, 사진에는 참으로 성경적인 메시지를 담고 있어 '말씀으로 시작된 오늘' 그 순간을 나타냅니다.\n\n먼저 물가에 놓인 나무가 보입니다. 나무는 물이라는 공급이 있어야 열매를 맺습니다. 서로 다른 남자와 여자도 부모의 열매이지만 결국 그 근원을 찾고 올라가면 창조주 하나님을 마주하게 됩니다. \"나는 포도나무요, 너희는 가지니라\"라는 주님의 말씀처럼 우리는 매일 주님께 붙어있으며 말씀을 공급받아야 살 수 있습니다. 말씀은 우리에게 매일 같이 흐르는 생명수와 같습니다.\n\n사진에는 두 개의 시선이 있습니다. 남자가 여자를 찍는 시야와 멀리서 바라보는 시야입니다. 우리의 삶에서의 시야는 때론 어디로 흘러가는지 모르겠으며 매일의 힘겨운 돌들을 넘는 것에 초점을 두지만, 우리 인생의 주인이시며 목자 되신 주님을 따라 말씀에 순종하며 한 걸음 나아갈 때 우리는 저 높은 곳을 향해 나아갈 수 있습니다.\n\n\n말씀으로 시작된 오늘,\n주님 안에 뿌리내린 우리의 삶이\n때를 따라 아름다운 열매를 맺어가기를 소망합니다.", "ids": ["1c_rJ1Teix7pS3Eeukvn8un3b1saCmXV-"], "files": []}, {"n": 180, "ts": "2026. 7. 28 오전 10:48:15", "name": "86633 김나혜", "church": "선한목자교회-다윗공동체", "ours": true, "title": "빛에 물든 선목", "place": "복정동", "when": "2023년 6월 11잉", "story": "빛을 받아 아름답게 보이는 교회처럼, 말씀을 받아 아름답게 물드는 각 교회(사람)이 되어가길 소망합니다.\n\n에베소서 2장 22절\n너희도 성령 안에서 하나님이 거하실 처소가 되기 위하여 그리스도 예수 안에서 함께 지어져 가느니라", "ids": ["1UEHKacB0rniOJW_LWrt1WNJxr-6lT4vS"], "files": []}, {"n": 181, "ts": "2026. 7. 29 오전 12:20:51", "name": "86633 김나혜", "church": "선한목자교회-다윗공동체", "ours": true, "title": "오라 우리가 여호와의 산에 올라", "place": "제주도", "when": "2023년 1월 10일", "story": "미가 4장\n1 끝날에 이르러는 여호와의 전의 산이 산들의 꼭대기에 굳게 서며 작은 산들 위에 뛰어나고 민족들이 그리로 몰려갈 것이라\n2 곧 많은 이방 사람들이 가며 이르기를 오라 우리가 여호와의 산에 올라가서 야곱의 하나님의 전에 이르자 그가 그의 도를 가지고 우리에게 가르치실 것이니라 우리가 그의 길로 행하리라 하리니 이는 율법이 시온에서부터 나올 것이요 여호와의 말씀이 예루살렘에서부터 나올 것임이라\n5 만민이 각각 자기의 신의 이름을 의지하여 행하되 오직 우리는 우리 하나님 여호와의 이름을 의지하여 영원히 행하리로다\n———\n주님의 말씀으로 내딛는 길이 좁고 험하며 앞이 보이지 않지만 또 때론 숨차도록 오르막길이지만 그 끝에 기쁨과 승리가 있음을 알기에 주님 의지하며 한걸음을 내딛습니다.", "ids": ["1TnmTv2jUnICX582IIKrXi13K3fQpLfvv"], "files": []}, {"n": 182, "ts": "2026. 7. 28 오전 10:30:44", "name": "이화정", "church": "선한목자온라인교회", "ours": true, "title": "춘천 소양강에서 말씀함께/베트남 꾸이년 해변에서 일출과 말씀함께", "place": "춘천 소양강/베트남 꾸이년 해변", "when": "2025년 4월 / 2026년 3월", "story": "그 장소들에서 말씀함께를 묵상하며 하나님과 교제했습니다~ ^^", "ids": ["14t9SMPG9LUa-i8LchUZSyUR-Pj6J1OEA", "1BOXZ6Wz9B_AGFwJyTXtJrjV9hnsyQDoe", "1hIq3Py7BXxA2lDvOOscRQGBoACf7_QLS"], "files": []}, {"n": 183, "ts": "2026. 8. 16 오후 7:49:55", "name": "김희숙", "church": "성남교구", "ours": false, "title": "하나님이 만드신 세계", "place": "1정선.민둥산", "when": "1. 2026년7월 16일 /2.25.2/ 3.25.4", "story": "1. 해당 그림은 정상에 가기 전 마지막 계단이었습니다. 마치 천국의 계단과도 같아 오르면서 천국에 대해 딸과 함께 이야기했던 기억이 납니다. 매일의 일상 가운데 말씀을 통해 천국에 대해 소망을 두길 기도합니다. \n2. 울산바위를 바라보며 그 크기와 견고함을 느끼는 것처럼, 우리의 시선이 눈앞의 어려움이 아니라 말씀으로 변하지 않고 영원하신 하나님을 향하기를 소망합니다.\n3.‘꽃들도’의 가사처럼, 수선화가 피어나는 모습을 통해 하나님께서 지으신 모든 것이 때에 따라 아름답게 피어남을 담고 싶었습니다.", "ids": ["1dbYzAvK_gUrq2OXtxcgdCh9WXjthG_lV", "1Rd-H4M9PHgDAhAaQ36DAciwBGQNMBBlm", "1KZoFVg6jv4PGdtKSvmHPeFei-EtNzxQz"], "files": []}, {"n": 184, "ts": "2026. 7. 31 오후 10:03:01", "name": "장예은", "church": "순천 서로사랑하는교회", "ours": false, "title": "부르심의 때", "place": "고흥 연홍도", "when": "2025.5.28", "story": "인생의 모든 순간은 선착순과 같다. 태어나는 것도, 죽는 것도, 살아있는 내내 순서가 있으며 우리는 하나님의 부르심의 때에 따라 맞춰 살아간다. 대다수의 사람들은 앞서나가길 바라고 고통의 시간없이 빨리 도달하기를 기대한다. 하지만 하나님의 계획하심을 진심으로 믿는다면 남들보다 조금 느리다고 해서 혹은 이제 새로운 시작을 한다해서 조급해할 필요없다. 그 모든 것이 우리의 계획이 아닌 하나님의 계획이기 때문이다.", "ids": ["17ug09Ba6w9LCKNGuQJIs4drG-tELN5UB"], "files": []}, {"n": 185, "ts": "2026. 8. 10 오후 10:34:07", "name": "정지현", "church": "연신교회", "ours": false, "title": "가장 좋아하는 동네, 가장 좋아하는 계절", "place": "서울 종로구 (경복궁 돌담길)", "when": "2024년 10월", "story": "하나님은 우리에게 잘 살라고 한 적 없으니 그저 묵묵히 걷다보면 하나님의 인도하심을 경험하게 될 것이라는 설교 말씀이 매주 와 닿았던 시기였습니다. 일년 중, 가장 좋아하는 시기에 가장 좋아하는 동네를 거닐면서 설교 말씀을 곱씹었던 날이 여전히 기억에 남습니다.", "ids": ["1b1bfokwgjnLSdEXZLadWs_SKmFK0vW2m"], "files": []}, {"n": 186, "ts": "2026. 8. 10 오후 10:48:46", "name": "정지현", "church": "연신교회", "ours": false, "title": "봄바다", "place": "부산 광안리", "when": "2025년 4월", "story": "이 사진을 찍기 1년 전, 삶의 어려운 시기를 보내던 중 부산에 여행을 갔었고 그로부터 딱 1년이 지난 시점에 다시 부산을 방문했습니다. 과거를 마주하기 힘들 거라고 생각했지만, 1년의 시간동안 하나님의 동행하심 덕분에 봄의 시작을 아름답게 맞이할 수 있었습니다. 부활절의 시기에 경험한 감사한 날이었습니다.", "ids": ["1ueMfyV3hgfvqlXo54qHKfeSGaAV4gtv2"], "files": []}, {"n": 187, "ts": "2026. 8. 10 오후 10:57:46", "name": "정지현", "church": "연신교회", "ours": false, "title": "하나님의 세계", "place": "스위스 인터라켄 융프라우", "when": "2023년 4월", "story": "엄마와 함께 방문했던 스위스의 융프라우입니다. 하나님이 지으신 넓은 세상과 그 위대한 자연을 마주한 날이었습니다. 거대하고 아름다운 자연 속에서 내가 얼마나 작은 존재인지 깨달았고, 이런 나를 사랑하시는 하나님이 세상을 창조하셨음을 체감하며 감사함을 느꼈습니다. 그리고 이렇게 아름다운 세상을 엄마와 함께 살아갈 수 있음에 행복한 날이었습니다.", "ids": ["1wsMKtAjpfzIe7TWD64v-2w0AhKAgZAtU"], "files": []}, {"n": 188, "ts": "2026. 8. 3 오후 8:39:01", "name": "권경선", "church": "위례교구", "ours": false, "title": ".", "place": "당포성", "when": "2024.06.06", "story": ".", "ids": ["1fvA4rxCEVCyqEaUFTXSU46S8QAAf83N4"], "files": []}, {"n": 189, "ts": "2026. 8. 23 오후 10:09:18", "name": "박선영", "church": "일산신광교회", "ours": false, "title": "내삶의 등대가 되어 주신 주", "place": "거제도", "when": "2025년 6월", "story": "주님께서 홀로 걷는 캄캄한 내 삶에 등대가 되셔서 \n멀리까지 보이지 않아도 \n하루하루 우리의 앞길을 비춰주시고 인도해주시기에 \n이 사진을 보냅니다.", "ids": ["1hyzl33FtjMNkrTPUFX0JF5XJ2smry66d", "1UPgGDZGsrRx2IEYn7WiTWktk96o_bgD_", "1nFM6U9G-0wtdyYsSkXouRh3pXC-DKfo1", "18ZmLCI5f9h71pFr68oNJs-ManVfcCPQW"], "files": []}, {"n": 190, "ts": "2026. 8. 26 오전 1:07:00", "name": "박진호", "church": "임마누엘교회 IMC", "ours": false, "title": "푸른 초장에서 나를 먹이시는 주님", "place": "북아일랜드", "when": "2026년 1월", "story": "여호와는 나의 목자시니 내가 부족함이 없으리로다. 그가 나를 푸른 초장에 누이시며 쉴만한 물 가로 인도하시는도다.", "ids": ["1E66adtah1KmRdzgrfkbrykfoV1HNeujM"], "files": []}, {"n": 191, "ts": "2026. 8. 26 오전 1:12:46", "name": "박진호", "church": "임마누엘교회 IMC", "ours": false, "title": "말씀 아래, 쉬어가다", "place": "런던", "when": "2025년 10월", "story": "말씀과 함께 하루를 살아갈 때면 따뜻한 햇살과 든든한 나무 그늘이 함께하는 듯한 평안함을 느낍니다. 이 사진은 그 평안하고 따뜻한 느낌을 담아낸 사진입니다.", "ids": ["1pgsyqJ_YWN_Oh1QFhBO9-pb0lPTSqkdg"], "files": []}, {"n": 192, "ts": "2026. 8. 26 오전 1:15:54", "name": "박진호", "church": "임마누엘교회 IMC", "ours": false, "title": "함께 자라는 오늘", "place": "런던", "when": "2025년 9월", "story": "말씀과 함께하는 하루에는 혼자만의 성장이 아니라 나눔을 통해 서로를 바라보고, 돕고, 기도하는 순간들이 있습니다. 사진 속 아이들의 모습을 통해 말씀 안에서 서로 사랑하며 함께 자라가는 우리의 모습을 담아내고 싶었습니다.", "ids": ["1F-b7-gDOB85s1YHqrirvY4n1jk69lz4d"], "files": []}, {"n": 193, "ts": "2026. 8. 24 오전 11:11:32", "name": "신성윤", "church": "젊은이교회", "ours": false, "title": "바다처럼 평안하라고 말씀하시는 하나님", "place": "인천 영종도 바다", "when": "2026년 여름", "story": "걱정과 염려가 많아서 반차를 쓰고 인천바다로 갔습니다. 날씨가 더워서 카페에 들어가서 큐티를 하는데, 하나님께서 걱정과 염려를 다 하나님께 내려놓으라고 하셨습니다. \n기도를 하면서 주님 제가 이렇게 계속해서 마음이 진정이 안되고 폭풍이 있는데 어떻게 맡길지 모르겠어요. 라고 기도하는데, 주님께서 바다를 보여주시면서 나에게 맡기면 저기 보이는 바다처럼 평안할거야. 너가 저 바다에 돌을 던진다고 저 바다가 요란해질거 같니!? 나는 저 바다처럼 너의 걱정과 염려를 나에게 던져버려도 요동하지 않고, 너가 오히려 내안에 거하면서 평안함을 경험할거야... 라고 말씀하시는거 같아서 찍었습니다.", "ids": ["1o22Zz1kfwdR95xPgz-P4wTptoIgZFN1X"], "files": []}, {"n": 194, "ts": "2026. 8. 24 오후 10:52:58", "name": "이혜영", "church": "통영시은교회", "ours": false, "title": "해질녘의 하늘", "place": "강원도 삼척 맹방해수욕장", "when": "2025년 7월30일", "story": "40살에 만난 주님. 천지만물을 창조하신 하나님을 알고 난 후부터 자연 사진을 많이 찍고 그 사진으로 말씀 카드를 만들고 있습니다. \n강원도 삼척에서 찍은 해질녘 하늘이 어느위치 어느시간대에 찍느냐에 따라 이렇게 다를 수 있는지 경이로움과 주를 찬양하게되는 시간이였습니다.\n어두워 지는 길을 가로등이 밝혀주듯이 \"주의 말씀은 내 발에 등이요 내 길에 빛이니이다\" 아멘", "ids": ["1EW4iDMsKnIy7OL_vcCWMFT7zs3VpwKrn"], "files": []}, {"n": 195, "ts": "2026. 8. 24 오후 10:59:21", "name": "이혜영", "church": "통영시은교회", "ours": false, "title": "해질녘 하늘과 길", "place": "경남 고성군", "when": "2024.10.05", "story": "40살에 만난 주님. 천지만물을 창조하신 하나님을 알고 난 후부터 자연 사진을 많이 찍고 그 사진으로 말씀 카드를 만들고 있습니다. \n저 길 끝에서 주님께서 나의 길을 인도하고 계심을 믿습니다.   \"주의 말씀은 내 발에 등이요 내 길에 빛이니이다\" 아멘", "ids": ["1ruaskRIV7IfH1yY7Ltt_YRdt9E_JFmqN"], "files": []}, {"n": 196, "ts": "2026. 8. 24 오후 11:08:17", "name": "이혜영", "church": "통영시은교회", "ours": false, "title": "공중의 나는 새", "place": "경남 통영시 욕지도 가는 배위", "when": "2025.03.16", "story": "40살에 만난 주님. \n바다와 하늘 사진 찍기를 즐겨하면서 말씀 카드도 만들고 천지 만물을 창조하신 주님의 경이로움과 사랑을 느낍니다.  공중의 나는 새를 보라 심지도 거두지도 창고에 들이지도 않지만 하늘 아버지께서 먹이고 입히신다. 무엇을 먹을가 마실까 입을까 염려하지 말라. 자영엽하면서 살아가는 저에게 공중의 새를 보면서 주님께서 주신 은혜에 감사하는 시간을 가집니다.", "ids": ["1PtmrOhJI9neI7EIan7NnN3BMT82Uv431"], "files": []}, {"n": 197, "ts": "2026. 8. 27 오후 3:37:08", "name": "박진선", "church": "선한목자감리교회", "ours": true, "title": "하늘바라기", "place": "덕산기", "when": "2023.07.10", "story": "밤하늘의 별 바라기", "ids": ["1YAyCH6ARBX8elH4ep7GohOQ1sQvzQfxu"], "files": []}, {"n": 198, "ts": "2026. 8. 27 오후 9:47:57", "name": "손율이", "church": "선한목자교회", "ours": true, "title": "1.평안의 바닷길 2.그 손의 흔적 3.길이 열리는 때", "place": "부산광역시 우3동, 인천광역시 선재도 목섬", "when": "2026.8.2, 2026.8.17", "story": "1. 말씀과 큐티는 날마다의 오늘을 하나님께로 이어주는 등대와 같습니다.\n\n몹시 지쳤던 여름 어느날, 친정 근처 바다를 바라보다 부표를 지나가는 작은 배 한 척을 보았습니다. 그 순간 이유 모를 안도와 평안이 밀려왔습니다.\n\n흔들리는 바다 위에서도 길을 잃지 않도록 이끄시는 우리 주님은 말씀을 통해 오늘도 우리의 삶이 향할 곳을 비추어 주십니다.\n\n2. 아이가 모래사장에 자신의 손바닥을 찍어 놓고 “엄마, 이거 봐!” 하며 환하게 웃었습니다.\n\n그 작은 손의 흔적을 바라보는 순간, 문득 십자가에 못 박히신 예수님의 손이 떠올랐습니다. 우리를 위해 상처 입으신 주님의 손, 그리고 그 사랑 안에서 오늘을 살아가는 우리.\n\n평범한 일상의 한 장면 속에서 다시 주님의 사랑을 기억하며 감사했습니다.\n\n3. 제 삶에는 도무지 열리지 않는 문이 하나 있습니다.\n\n짧은 가족여행에서 찾은 목섬. 썰물 때 비로소 열리는 바닷길을 바라보며 홍해에 길을 내신 하나님을 생각했습니다.\n\n비록 제 앞의 문이 열리지 않더라도 저는 하나님이 참 좋습니다. 그 길을 걸으며 하나님을 기뻐하고 감사하며 참 많이 울고, 또 웃었습니다.\n\n언젠가 열어주실 하나님의 때를 기다리는 이 마음을 성도님들과 함께 나누고 싶습니다.", "ids": ["1e9s-P75ybrEamb9gM3DaucdLmN1osEka", "1qQ7sSV_ybqfvP5ZV4wAbuRoekpnurDSp", "1TLn_eMsIYI2V-8Eb5fEQE9QWTP3TOGvG"], "files": []}, {"n": 199, "ts": "2026. 8. 28 오전 12:14:44", "name": "이해", "church": "선한목자감리교회", "ours": true, "title": "모세가 출애굽을 위해 건너간 홍해의 석양", "place": "사우디아라비아, 제다(JEDDAH)", "when": "2025.06.25", "story": "이 사진은 중동사업 담당 연구원으로서 모세가 출애굽을 위해 건너간 사우디아라비아의 홍해를 바라보며, 하루의 시작과 끝을 하나님과의 동행, 말씀함께로 영적 승리하고자 했던 사진입니다.\n\n매번의 중동 출장과정에서 말씀과 함께하는 삶은 오늘과 내일을 그곳에서 지켜주시는 주님의 방패입니다.\n\n현재, 우리교회는 초막절 기도를 통해 복음의 씨앗이 메마른 이땅, 사우디아라비아 등 중동지역을 위해 기도하고 있습니다. 주님을 모르는 이 곳의 백성에게 찾아오셔서 복음의 통로가 열리길 기도합니다.", "ids": ["1nrWtgIltF3srzvlBuFwx0EWaDQ5yxnN-"], "files": []}, {"n": 200, "ts": "2026. 8. 28 오전 7:33:15", "name": "방성욱", "church": "선한목자교회", "ours": true, "title": "선교의 첫걸음, 공항에서 '말씀함께' 나누다! (2026 요코하마 브릿지팀)", "place": "인천국제공항 출국장 대기실", "when": "2026년 8월 8일", "story": "2026년 8월, 저희 '요코하마 브릿지팀' 6명이 5박 6일의 일본 단기선교를 떠나기 위해 공항에 모여, 가장 먼저 다 같이 '말씀함께'로 그날의 묵상을 은혜롭게 나눈 직후 환하게 웃으며 찍은 사진입니다.\n사역 기간 내내 저희 팀은 매일 아침 '말씀함께'를 통해 묵상하고 영적으로 무장했으며, 이 귀한 묵상법을 요코하마 영광교회 현지 성도님들과도 함께 나누는 값진 은혜를 누렸습니다.\n비행기 탑승을 앞둔 설렘과 긴장 속에서도 '말씀함께'라면 어디든 담대히 나아갈 수 있다는 저희의 믿음과 다짐이 이 사진 속에 고스란히 담겨있습니다. 말씀이 이끄는 선교, 말씀으로 하나 된 우리 팀의 가장 뜨거웠던 '오늘'이기에 이 사진을 출품합니다.\n(꼭 시상하여 척박한 일본 땅에서 눈물로 사역하시는 요코하마 영광교회에 선교 헌금으로 흘려보내고 싶습니다!)", "ids": ["1dWNhsY3tD05NXUv2h_61wjkO_Kz6GWRE"], "files": []}, {"n": 201, "ts": "2026. 8. 28 오전 11:31:13", "name": "이하영", "church": "예수동행교회", "ours": false, "title": "말씀을 먹는 아이", "place": "예수동행교회 내", "when": "2021년 6월", "story": "말씀을 먹고 기도로 호흡하는 우리가 매일 이런 어린아이와 같은 믿음으로 오늘 하루를 살아가길 바라는 마음입니다", "ids": ["1Qd0-Yqul1RdViZ0aSxI_fAq1ksRs5ZgM"], "files": []}, {"n": 202, "ts": "2026. 8. 28 오후 5:13:53", "name": "한성호", "church": "선한목자교회", "ours": true, "title": "생명을 살리는 강", "place": "충남 아산 곡교천", "when": "2026년 봄", "story": "국내선교지에서 촬영했습니다. 선교를 통해 말씀이 모든 사람들에게 흘러가고 그곳마다 생명이 소생한다는 의미입니다", "ids": ["1PFy8Q7i1FFeNLxSvKKiOx1priQDa8llf"], "files": []}, {"n": 203, "ts": "2026. 8. 28 오후 11:06:08", "name": "양계정", "church": "선한목자교회", "ours": true, "title": "오늘도 말씀과 함께", "place": "선한목자교회", "when": "2025.6.1.오전 6:42", "story": "선한목자교회의 입구에 있는 성경책과 꽃들과 일출의 장관이 말씀함께로 하루를 시작하는 아침과 잘 맞는것 같습니다", "ids": ["1RbLhvCQ0tSsrNDZRloaeiCDy7BaAyy3N", "1w4ArRWbsivJ89hGvc0eC1sUeo5EbMrLt", "1CpsVOFImxI2RD5CIMGwzFEfhHojnV0l0"], "files": []}, {"n": 204, "ts": "2026. 8. 29 오후 12:57:42", "name": "김민정", "church": "선한목자교회", "ours": true, "title": "꿀보다 단 말씀", "place": "양재천", "when": "2025년7월", "story": "나비가 꿀을 빨듯이 우리 영혼에 주의 말씀이 달콤합니다.", "ids": ["1cOyzJJZ4Bar3jILrAfUaB1OkoakXih_8"], "files": []}, {"n": 205, "ts": "2026. 8. 29 오후 3:40:56", "name": "손정순", "church": "선한목자교회", "ours": true, "title": "하나님의 말씀이 나의 DNA가 되게 하소서", "place": "집에서 창밖 하늘 촬영입니다.", "when": "2026.08.28", "story": "김다위목사님의 설교,믿음의 DNA 시리즈를 일상에서 반복해서 듣고 있는데 날마다 말씀함께속에 말씀과 연결이 참 잘 되어집니다. 시리즈를통해 하나님의 사랑과 계획하심이 그들의 연약함과 무너짐속에서도 끝까지 포기하지도 흔들리지도 않으심을 깨달았습니다. 말씀함께를 묵상할때 더 선명해지고 분명해집니다.그래서 말씀이 나의 DNA가되기를 바라고 원합니다.", "ids": ["1our7iT3Vx2QHmtJGX25HNcd0t12v4bcx"], "files": []}, {"n": 206, "ts": "2026. 8. 29 오후 6:01:48", "name": "이하준", "church": "성남선한목자교회", "ours": true, "title": "따라 걷다", "place": "김포시 장기동", "when": "2025.03.27", "story": "오늘도 주님과 동행하며 살아가고 있나요?\n홈스쿨링을 하던 제가 학교의 울타리가 없는 곳에서 혼자 걷는 것처럼 느껴지는 순간에도, 주님은 언제나 제 곁에서 함께 걸어가셨습니다.\n오늘도 그분의 발자취를 따라 걷습니다", "ids": ["1imfGoDgz4FUACAni5klMhqJ37in6cpJR"], "files": []}, {"n": 207, "ts": "2026. 8. 29 오후 6:10:35", "name": "김민희", "church": "선한목자교회", "ours": true, "title": "길", "place": "조치원 천변", "when": "2024년 10월, 2025년 4월", "story": "계절이 변해도 곧은 길을 보며, 길이 되신 예수님께서 늘 함께하심을 기억하려고 찍어두었던 사진입니다", "ids": ["11l87GdDfEPOJlb9nKU4mAS119EaJoK2-", "1z797WCz-uyNUgX_KRp89YBXETPW7ZCQc", "1_b17mIBo-aenz9tARstG--qfdVotn4aH"], "files": []}, {"n": 208, "ts": "2026. 8. 29 오후 8:50:37", "name": "정성희", "church": "선한목자교회", "ours": true, "title": "병상위 십자가", "place": "샘물호스피스", "when": "2026년 4월", "story": "아픈 중에도 엄마는 주님의 십자가만을 바라 보셨습니다. 하나님이 병상에서도 호스피스팀을 통해 어린아이들을 통해 엄마에게 십자가 선물을 주셨고 엄마는 기도로 화답하셨습니다. 병상에서도 주의 말씀이 함께라면 부활소망이 굳게 붙들며 나아갈 수 있습니다. 도리어 믿는 이들에게 믿음을 굳게 합니다. 위로 받을 자를 넘어 위로 하는 자가 되게 하십니다.", "ids": ["1hVC8uy5oJORoToDq9MRrekjhQZAlSyvk", "17ITpNHznq9b8txdz26_SutIOK6mk6IXf", "18BD6AOYpbdKsDFJ-mm_gYYt0qe6XM0f0", "1U2d7q-8VPB_A6OxNOmbTszNJahzJs0Fb"], "files": []}, {"n": 209, "ts": "2026. 8. 30 오전 2:53:58", "name": "염민희", "church": "선한목자교회", "ours": true, "title": "카이로스-하나님의 시간", "place": "단국대캠퍼스", "when": "2026년 8월", "story": "이 사진은 “온 세상은 하나님의 시간 속에서 움직인다”는 마음을 담아 촬영했습니다.\n\n말씀함께를 통해 날마다 시간의 주권을 주님께 내어드리며, 내가 정한 시간과 계획을 앞세우기보다 하나님의 때를 신뢰하고 하나님의 시간에 맞춰 하루를 살아가고자 하는 마음을 담았습니다.", "ids": ["1sneytboz9gg1V_wCl51d3lA03yFXAY9I"], "files": []}, {"n": 210, "ts": "2026. 8. 30 오후 12:07:28", "name": "이지유", "church": "선한목자교회", "ours": true, "title": "선하신 목자", "place": "교회", "when": "2026 여름", "story": "예수마을학교 통해 장애자녀에게 부어지는 주님의 은혜를 누리고 나오는 길 아름다운 구름이 그런 선하신 주님을 예표한다고 느껴졌습니다", "ids": ["1Zqoa704H1iwjVDnJ8BQLsEXZDZTSZtYE", "1VSRJHSovnEmMyEoROkjhUqxNVbeofZnX", "1sPzDtrUmUCHuF9gNOtjxKaRxfXZwmPSB"], "files": []}, {"n": 211, "ts": "2026. 8. 30 오후 12:17:37", "name": "이지유", "church": "선한목자교회", "ours": true, "title": "천국으로 가는 계단 - 공동체", "place": "모란미술관", "when": "2026년 여름", "story": "장애의 아픔이 사랑부 공동체를 통해서 천국의 계단으로 바뀐다는 아빠 작품설명을 들었습니다", "ids": ["1FWYaWw14tOsgCtrwOUAEskbQd7FCLYEG", "14-EelBqPG1o1T3CkPa0_ifjn389be-IJ", "1ZNsA-nFNeuGbxa2t6HhOUZD59wjX0yTS", "17FOnhYqtsn4m8dG329nIeBYbRokjhDsW"], "files": []}, {"n": 212, "ts": "2026. 8. 30 오후 1:14:12", "name": "최희주", "church": "선한목자온라인교회", "ours": true, "title": "빛을 따라 걷는 길", "place": "제주도", "when": "2025년 가을", "story": "걸어가던 중, 나뭇잎 사이로 빛이 길게 내려오는 순간을 만났습니다.\n굽은 길이라 그 너머는 보이지 않았지만, 발 앞은 환했습니다.\n앞길을 다 알지 못해도 말씀을 따라 한 걸음씩 걷다 보면 오늘 걸어갈 만큼의 빛은 늘 주신다는 것을, 묵상하게\n되었습니다.\n“주님의 말씀은 내 발에 등이요, 내 길에 빛입니다.”(시119:105)\n딱 한 걸음만큼 밝은 길.. 그것으로 충분했습니다.\n오늘도 그 빛을 따라 한 걸음 내딛기를 소망하며!!", "ids": ["17KL69poxdEYMNQceAEFWCsAgxqhQjqov"], "files": []}, {"n": 213, "ts": "2026. 8. 30 오후 1:17:34", "name": "최유리", "church": "선한목자감리교회", "ours": true, "title": "은혜의 폭포수", "place": "경기도 포천 둘기낭 폭포", "when": "2026년 7월", "story": "깨끗한 폭포가 흘러넘치는 것을 보고 내삶에 넘치는 은혜를 묵상하였습니다. 깊은 곳 가득 채워져 흘러넘치는 폭포수처럼 말씀이 내 심령 깊은 곳을 채워 흘러넘치길 기대합니다.", "ids": ["1dvqMNPmKhVM7Yr2BJ_wFjk0oC8O9jP5I"], "files": []}, {"n": 214, "ts": "2026. 8. 30 오후 1:20:56", "name": "최희주", "church": "선한목자온라인교회", "ours": true, "title": "다시, 생명", "place": "통영", "when": "2026년 봄", "story": "통영 본가에 가서 강아지가 산책하다가, 말라버린 잎들 사이에서 작은 새싹을 만났습니다.\n끝난 것처럼 보이는 자리에도 다시 생명이 움트고 있었습니다.\n\n“나무는 희망이 있나니 찍힐지라도 다시 움이 나서 연한 가지가 끊이지 아니하며”\n(욥14:7)\n\n욥기 말씀을 떠올리며, 삶에도 다시 시작하게 하시는 하나님의 손길이 있음을 생각했습니다.\n보이지 않는 자리에서도 조용히 새 일을 이루어 가시는 하나님을 기억하는 시간이었습니다.", "ids": ["1KYwoXeGCYcWEMJHr9gsZaOW9plZ06JFp"], "files": []}, {"n": 215, "ts": "2026. 8. 30 오후 1:29:37", "name": "최희주", "church": "선한목자온라인교회", "ours": true, "title": "쉴 만한 물가", "place": "경남 양산시", "when": "2025년 가을", "story": "직장에서 워크샵(숲길 걷기) 참석 중, 초록이 깊은 물가에 잠시 머물렀습니다. 바쁘게 흘러가던 마음도 천천히 잔잔해지고, “쉴 만한 물가로 인도하시는” 하나님이 절로 떠올려졌어요. 말씀 앞에 머무는 시간도 제게는 이와 같은 쉼입니다. 오늘도 주님 곁에서 마음을 쉬어봅니다. \"그가 나를 푸른 풀밭에 누이시며 쉴 만한 물가로 인도하시는도다\" (시23:2)", "ids": ["1yHupIgR8qyypWI_6mJ8POVEIk-1qHAs1"], "files": []}, {"n": 216, "ts": "2026. 8. 30 오후 4:26:55", "name": "김윤경", "church": "선한목자교회", "ours": true, "title": "생명이 움트는 봄", "place": "대공원", "when": "2023년 5월", "story": "나무 기둥에서도 싹이 나고 꽃이 필 수 있다니! 이것은 숨길 수 없는 생명의 기운입니다.하나님께서 만드신 자연, 그리고 그 자연에 생기를 허락하신 주님!\n사람을 만드시고 그 코에 생기를 불어넣으시며 “보시기에 심히 좋았더라” 말씀하신 창세기의 하나님께서, 저를 향해 싱긋 웃으시며 말씀하시는 것 같았습니다.\n“사랑하는 내 딸아, 내가 너를 만들고 네 코에 생기를 불어넣었단다. 그리고 나는 너로 인해 기쁨을 이기지 못한단다.” \n가슴이 뭉클했습니다.벚꽃들과 함께 주님을 찬양했던 순간을 담은 사진이랍니다. ^^♡", "ids": ["161xUJAr6h6eVdYmn2I5Clwq3iLSjfl1B"], "files": []}, {"n": 217, "ts": "2026. 8. 30 오후 4:43:55", "name": "조영미", "church": "선한목자교회", "ours": true, "title": "의료선교국 국내외 선교현장", "place": "참소망교회 의료선교", "when": "2026년 2월", "story": "지극히 작은 자 하나에게 한 것이 곧 내게 한 것이라'[마25:40]의 말씀과 함께 국내에 찾아온 아프리카 이주민들, 필리핀 원주민 마을에 찾아가 의료의 혜택을 받지 못하는 이들에게 주의 사랑의 손길로 아픈 곳을 돌보고 치유를 전하는 의료선교의 현장입니다.", "ids": ["1yFbGY_4MZMP1-84JAYkUSpTokoDQWOXb"], "files": []}, {"n": 218, "ts": "2026. 8. 30 오후 4:46:11", "name": "조영미", "church": "선한목자교회", "ours": true, "title": "의료선교국 국내선교 현장", "place": "평택 참소망교회", "when": "2026년 2월", "story": "지극히 작은 자 하나에게 한 것이 곧 내게 한 것이라'[마25:40]의 말씀과 함께 국내에 찾아온 아프리카 이주민들, 필리핀 원주민 마을에 찾아가 의료의 혜택을 받지 못하는 이들에게 주의 사랑의 손길로 아픈 곳을 돌보고 치유를 전하는 의료선교의 현장입니다.", "ids": ["1ZOWl6QT16fPS4e6-neSQdx28tPE--ov0"], "files": []}, {"n": 219, "ts": "2026. 8. 30 오후 4:48:40", "name": "조영미", "church": "선한목자교회", "ours": true, "title": "의료선교국 해외선교 현장", "place": "필리핀 원주민 마을", "when": "2026년 6월", "story": "지극히 작은 자 하나에게 한 것이 곧 내게 한 것이라'[마25:40]의 말씀과 함께 국내에 찾아온 아프리카 이주민들, 필리핀 원주민 마을에 찾아가 의료의 혜택을 받지 못하는 이들에게 주의 사랑의 손길로 아픈 곳을 돌보고 치유를 전하는 의료선교의 현장입니다.", "ids": ["1R-b5HRRGsKdUwIdyZdF3K40j-fjWo769"], "files": []}, {"n": 220, "ts": "2026. 8. 30 오후 4:49:21", "name": "김윤경", "church": "선한목자교회", "ours": true, "title": "아름다운 가을, 사랑하는 하나님의 집", "place": "복정동 선한목자교회근처", "when": "2023년 10월", "story": "마가다락방 기도실에서 주님과 찐하게 교제하고 나오던 어느 가을날.\n주님의 사랑으로 마음이 가득 차니 세상이 달라 보였어요. 나뭇잎 하나까지도 어찌나 예쁜지!\n“아바 아버지, 어쩜 이렇게 솜씨가 좋으세요? 하나님이 만드신 가을은 빛나도록 아름다워요.”\n집으로 향하던 걸음을 잠시 멈추고, 발갛게, 노랗게 물든 가을나무 앞에서, 주님을 찬양하고, 행복한 마음으로 한 장 한 장 풍경을 담았어요. 그러다 문득, '하나님이 사랑하시고 우리 모두가 사랑하는 선한목자교회도\n함께 담아 오늘을 기록해 두어야겠다.’는 생각이 들어서 다시 교회쪽으로 걸어가서 교회를 향해 한 컷, 찰칵!\n하나님의 솜씨가 빚어낸 아름다운 가을과\n하나님의 사랑이 머무는 집. 그날의 풍경 속에 주님과 함께했던 행복이 이 사진을 보면 생각나서, 지금도 가슴이 콩닥콩닥^^*", "ids": ["1xFxnXQPvhZRtj0iXa7mo1xi8HLNMW0sm"], "files": []}, {"n": 221, "ts": "2026. 8. 30 오후 5:41:33", "name": "김윤경", "church": "선한목자교회", "ours": true, "title": "복붙'을 모르시는 섬세하신 하나님", "place": "문덕초등학교 건너편 길가", "when": "2024년 6월 초", "story": "길을 걷다가, 짙은 초록 위에 연한 연두빛의 수호초가 너무나 싱그러워 다가가 들여다보니, 오, 주님!\n“여호와여 주께서 하신 일이 어찌그리 많은지요 주께서 지혜로 다 지으셨으니 주께서 지으신 것들이 땅에 가득하니이다.” 시편 104편 24절 말씀이 생각나는 순간.\n비슷비슷하게 생긴 것 같은데, 어쩜 이리도 한 잎 한 잎 다르게 만드셨을까? 모양도 빛깔도 비슷한 듯하지만 결코 같지 않은 잎사귀들.\n맞아, 우리도 이렇게 만드셨지? 그 누구도 같지 않게, 하지만 우리 모두는 하나님의 형상을 닮은 하나님의 작품. 함께 모여 있어서 더 예쁘고 싱그러운 수호초처럼 우리도 함께할 때, 같이할 때 더욱 빛나고 아름답다 하시겠구나!\n“보라 형제가 연합하여 동거함이\n어찌 그리 선하고 아름다운고”\n시편 133편 1절 말씀, 🙏", "ids": ["1IB5CCbQIxdgj9yOtEaU6zzvppx7BykIw"], "files": []}, {"n": 222, "ts": "2026. 8. 30 오후 6:33:12", "name": "김교준", "church": "선한목자교회", "ours": true, "title": "시선이 머무는 곳", "place": "생명의빛예배당", "when": "2023년 여름", "story": "수많은 나무와 선들이 저마다 다른 방향으로 이어져 있지만, 바라보다 보면 결국 시선은 가운데 세워진 십자가에 머물게 되었습니다. 복잡한 생각과 여러 갈래의 일상 속에서도 말씀은 다시 내가 바라보아야 할 곳을 알려 주기에, 오늘도 그 말씀을 따라 시선을 십자가에 두고 살아가고 싶다는 마음을 담았습니다...", "ids": ["1F8YnVTdZGVYNcbvfdKi-bTvBdnGPQOXD"], "files": []}, {"n": 223, "ts": "2026. 8. 30 오후 6:35:27", "name": "김교준", "church": "선한목자교회", "ours": true, "title": "어둠 사이로 비치는 빛", "place": "‘스피릿 큐브(Spirit Cube) 기도실’", "when": "2023년 여름", "story": "어두운 공간 한가운데 열린 창으로 빛이 들어오고, 그 앞에 작은 십자가가 서 있습니다.. 마음이 답답하고 앞이 잘 보이지 않는 날에도 말씀은 작은 창처럼 빛을 내어 길을 보여 주는 것 같습니다. 평범한 하루 속에서도 그 빛을 놓치지 않고 살아가고 싶은 마음을 담아보았습니다...", "ids": ["1xkNvx0fZMG59HX8TNgEJalHqV8lfM6Z-"], "files": []}, {"n": 224, "ts": "2026. 8. 30 오후 6:37:02", "name": "김교준", "church": "선한목자교회", "ours": true, "title": "오늘도 피어나는 은혜", "place": "철원군 동송읍 고석정 꽃밭", "when": "2023년 가을", "story": "하루가 저물어 가는 시간, 하늘은 따뜻한 빛으로 물들고 꽃들은 마지막 햇살을 받아 피어 있었습니다. 말씀과 함께 돌아보니 특별할 것 없던 하루도 하나님께서 주신 아름다운 한 날이었음을 깨닫게 됩니다. 매일 새롭게 주어지는 평범한 오늘이 곧 은혜라는 마음을 담았습니다.", "ids": ["1b4nhOyhnjhAPuZa6ZyAh1VJEKCLGmJes"], "files": []}, {"n": 225, "ts": "2026. 8. 30 오후 6:46:16", "name": "김주원", "church": "조양감리교회", "ours": false, "title": "좁은 길 끝에서", "place": "제주시 구좌읍 하도리 별방진 성곽", "when": "2024년 여름", "story": "높은 돌담 사이로 난 좁은 계단을 한 걸음씩 오르다 보니, 목사님 말씀에서 만난 ‘좁은 길’이 떠올랐습니다. 앞이 훤히 보이지 않아도 한 걸음씩 걸어가면 마침내 열린 하늘을 만나듯, 우리의 오늘도 말씀을 붙들고 걸어갈 때 새로운 길이 열린다는 마음을 담았습니다.", "ids": ["1tpRtTWye1y8BRA38nf8EVs6i0K0oQOVb"], "files": []}, {"n": 226, "ts": "2026. 8. 30 오후 6:47:52", "name": "김주원", "church": "조양감리교회", "ours": false, "title": "빛은 나무 사이로", "place": "서귀포시 남원읍 휴애리 자연생활공원 일대", "when": "2024년 여름", "story": "하루가 저물어 가는 시간, 야자수 사이로 마지막 햇빛이 조용히 스며들었습니다. 빛을 가리는 나무가 있어도 그 틈을 찾아 비추는 햇살처럼, 말씀도 바쁘고 복잡한 일상 사이로 들어와 마음을 밝혀 줍니다. 평범한 하루의 끝에서도 하나님이 주시는 빛을 발견할 수 있다는 마음으로 담은 장면입니다.", "ids": ["1a2lvsh4elJEIse58SVhoPhXPAMVFowdL"], "files": []}, {"n": 227, "ts": "2026. 8. 30 오후 6:49:07", "name": "김주원", "church": "조양감리교회", "ours": false, "title": "잠시 머물러도 괜찮아", "place": "속초시 속초해수욕장, 조도 앞", "when": "2025년 여름", "story": "바다를 향한 빈 그네를 바라보며 잠시 멈추어 앉고 싶은 마음이 들었습니다. 우리는 늘 무언가를 해야 한다고 생각하지만, 말씀은 때로 멈추어 하나님을 바라보게 합니다. 쉼도 믿음의 한 부분임을 기억하며, 분주한 오늘 가운데 잠시 말씀 앞에 머무는 시간을 담았습니다.", "ids": ["1G4XSrkErIxRZf1QAeZrFIymJKs8TBXpC"], "files": []}, {"n": 228, "ts": "2026. 8. 30 오후 9:02:46", "name": "김도형", "church": "선한목자감리교회", "ours": true, "title": "성전으로 향하는 구름 형상", "place": "집 창밖", "when": "2026년 8월", "story": "독특한 구름 형상이 하나님께서 만들어 주신 자연 형상 같아요.", "ids": ["1X50HePPZ5L5UYPGGqogAQXtEH9kSiJ8Z"], "files": []}, {"n": 229, "ts": "2026. 8. 30 오후 9:11:35", "name": "김도형", "church": "선한목자감리교회", "ours": true, "title": "기적을 기다리다", "place": "남해", "when": "23년 2월", "story": "저 멀리 섬으로 건너가기 위해 기적을 바라며 기다리는 듯한 느낌이 들어요.", "ids": ["1li4TW91xCnx7kukyFs3MxEzR7ZPPm3Gi"], "files": []}, {"n": 230, "ts": "2026. 8. 30 오후 9:31:33", "name": "김도형", "church": "선한목자감리교회", "ours": true, "title": "물 위 하늘과 땅", "place": "충주호", "when": "22년 8월", "story": "물 위로 아름다운 하늘과 땅이 보여 천지를 지으신 여호와를 바라보고 합니다.", "ids": ["1Yqcsmpdcs18Kx_hke0iPZHE6Sjk_USJ9"], "files": []}, {"n": 231, "ts": "2026. 8. 30 오후 10:03:33", "name": "정희영", "church": "선한목자교회", "ours": true, "title": "늦가을", "place": "대전 수목원", "when": "2025년 11월26일", "story": "하나님 빚으신 예쁜 색", "ids": ["1C5ZutqRFgwVPXjW-eGlQbaBzkF0Y3mRj", "1p7O8OKQXGWSnIFAkjzXuF0jy4U51_Xc5"], "files": []}, {"n": 232, "ts": "2026. 8. 30 오후 10:06:05", "name": "이서은", "church": "선한목자교회", "ours": true, "title": "일몰", "place": "제주도", "when": "2025.12.19", "story": "아름다운 풍경을 주신 하나님께 오늘도 감사드려서요", "ids": ["12mL7A3hxRxnIRhLTDQbFn5L4SOBNHVew"], "files": []}, {"n": 233, "ts": "2026. 8. 30 오후 10:12:28", "name": "정영애", "church": "선한목자교회 갈렙", "ours": true, "title": "빛", "place": "선한목자교회 본당", "when": "2016년 6월", "story": "기도하기 위해 캄캄한 본당에 들어 갔을때\n환기구를 통해 빛이 여러갈래로 성가대를 비추일때 하나님의 임재하심과 위로를 받았던 기억으로 이 사진을 늘 좋아했습니다", "ids": ["1vwojldKE9WK66fuN-mEjxeEBvSq_V8q-", "1QeLfRR9zJuYDdJmqOeO1PtVwuxG89TyZ", "1ixlqnAORzwNLm54MfHZDEnpMroRSuI4g", "1_qbReqkjbN99BO-tgj0pMEp0Zf-6nox-"], "files": []}, {"n": 234, "ts": "2026. 8. 30 오후 10:22:16", "name": "조석현", "church": "선한목자교회", "ours": true, "title": "형제교회 전경", "place": "예수동행교회(방문 예배 후 촬영)", "when": "2026.8.30. 주일", "story": "말씀함께 표지에 형제교회 또는 선교지 교회들의 사진들이 '시리즈 형식'으로 계속 올려질 수 있다면, 말씀묵상 후 선한목자교회와 연관된 교회들을 위해 보다 현실적이고 구체적으로 기도해 나갈 수 있을 것 같습니다.", "ids": ["1nL6ksaYyH6yK6oL_uOwj_J5sEE0z8ixq"], "files": []}, {"n": 235, "ts": "2026. 8. 30 오후 11:19:16", "name": "임지아", "church": "선한목자교회", "ours": true, "title": "흔들리는 바다 위에 뜬 약속", "place": "강원도 고성", "when": "2024.11.23", "story": "[사29:13] 주께서 이르시되 이 백성이 입으로는 나를 가까이 하며 입술로는 나를 공경하나 그들의 마음은 내게서 멀리 떠났나니 그들이 나를 경외함은 사람의 계명으로 가르침을 받았을 뿐이라\n[사29:16] 너희의 패역함이 심하도다 토기장이를 어찌 진흙 같이 여기겠느냐 지음을 받은 물건이 어찌 자기를 지은 이에게 대하여 이르기를 그가 나를 짓지 아니하였다 하겠으며 빚음을 받은 물건이 자기를 빚은 이에게 대하여 이르기를 그가 총명이 없다 하겠느냐\n\n아침에. 말씀을 묵상하며 '겉과 속인 다른 나' 라는 생각이 들어 스스로 안타까운 마음이 일어났다. \n주 안에서 다시 일어서야 할 것들을 붙잡고 기도한다.\n\n비 온 후 구름 낀 날의 적당한 흐림과 높이 치는 파도, 멋지고도 슬픈 바다를 보며 속으로 하나님 제 삶 같아요. 하는데 한참 아이들과 시간을 보내다 남편이 무지개를 가리킨다. 오! 바다에 뜬 무지개... \n나를 가장 잘 아시는 하나님 아버지의 위로를 느끼며 감사했다.\n\n* 사진 찍은 날 적었던 동행일기 입니다. 임용시험을 마치고 가족들과 떠난 여행에서 다시 또 불합격을 마주하며 실패자가 될 것 같은 두려움, 더 이상 나아갈 수 없을 것만 같은 괴로움이 있었습니다. \n아침 말씀함께를 통해 주셨던 마음을 새기며 걷던 해변가에서 만난 무지개를 통해 변함없는 약속의 말씀을 확증해주셨습니다. 그 귀한 시간을 담고 있는 사진을 '말씀과 함께한 오늘' 사진으로 제출합니다.", "ids": ["178yMwX-ZD3AWVIjINwjDNROOAh7OwMbe"], "files": []}, {"n": 236, "ts": "2026. 8. 30 오후 11:38:57", "name": "임지아", "church": "선한목자교회", "ours": true, "title": "눈을 들어", "place": "강북삼성병원", "when": "2026.08.30", "story": "엄마가 암 수술 받은 날 보호자로 함께 밤을 지새우며 밤새 병실 안 여러 어려움과 처치들로 밤을 꼴딱 새고, 피곤하여 불평이 올라올 때 창문 밖 풍경이 너무 아름다워 감탄과 감사가 올라와 사진을 찍었습니다. \n 너무나 아름다운 하늘을 보며 살아계신 하나님을 찬양할 수 있어 감사했습니다. \n 모든 것이 주님의 섭리하심 속에 있다는 마음이 들었습니다. \n [렘1:8, 새번역] 너는 그런 사람들을 두려워하지 말아라. 내가 늘 너와 함께 있으면서 보호해 주겠다. 나 주의 말이다.\n 입원하여 주셨던 말씀을 새기며 피곤하고 지쳤던 마음을 지키고 병실 내 모든 환자들을 위해 중보하게 하셨던 그 날의 사진을 올립니다.", "ids": ["1YqhD551maLrhQePb_sKq07cdBIqkagDR"], "files": []}, {"n": 237, "ts": "2026. 8. 31 오전 12:11:03", "name": "김영식", "church": "선한목자교회", "ours": true, "title": "1. 돌같은 마음 속, 2. 주님께 오직 사랑뿐, 3. 자물쇠 벽", "place": "서울 남산타워", "when": "2026년 8월", "story": "1. 돌 같은 마음 속\n돌 같은 마음 속\n한 가운데\n세상이 자리잡고 있다\n언제쯤\n주께서 내 마음속\n주인이 되시려나.\n\n2. 주님께 오직 사랑뿐\n주님\n오직\n사랑할 뿐입니다.\n\n3. 자물쇠 벽\n셀 수 없는 자물쇠\n셀 수 없는 사연들\n열림을 기다리는 것인가\n잠김을 고집하는 것인가\n           혹시\n나의 마음이 잠김을 고집하며\n주님의 말씀을 거부하는 것은 아닐까\n열리기를 소망하며\n기도할 뿐이다.", "ids": ["1tOds2ojIVdnY8EsLxm97QXNUj66O_2ej", "1gKDD5cxE4dANzVzRQw3X9g1gTPOP3IP6", "1ysVWlrDE6e1krIx3_bujY9ivI3HfvwrK"], "files": []}, {"n": 238, "ts": "2026. 8. 31 오전 12:18:24", "name": "임지아", "church": "선한목자교회", "ours": true, "title": "가서 너도 이와 같이 하라", "place": "양화진", "when": "2024.02.24", "story": "입구에 바다로 시작하는 작은 연출로 믿음으로, 말씀으로 한 걸음 내딛는 것에 대해 짧지만 깊이 생각해 볼 수 있는 시간이 있었다. 선교사님들의 헌신과 사랑. 하나님을 향한 신뢰와 믿음. 뒤돌아 서지 않는 담대한 발걸음이 담겨있는 글과 사진, 유품 들에 눈물이 고였다.\n감히 알 수 없는 그 걸음들.... 북한을 향해 나도 그렇게 걸어갈 수 있을까....\n당장 지금 내게 명하신 걸음에서 한 걸음 떼지 못하고 도저히 넘어갈 수 없는 산 인 것 같다고 \n고개를 숙인 내 자신이 너무나 작고 작은 존재로 느껴졌다.\n그렇게 한 바퀴를 돌고 나가기 전 손을 뻗었는데 주신 말씀..... \"가서 너도 이와 같이 하라\" \n우리 가정, 각 자에게 주신 말씀을 두 손으로 받았다.", "ids": ["1gmq66EdQkkKt2v3soylr4v4iAzNnoxFu", "1FI4O2Am3AXCcEw921zUDAF1iYFAn_vNN", "13lZAduLXcsFNJkJ4PZR3nY6ii2erQbog"], "files": []}, {"n": 239, "ts": "2026. 8. 31 오전 12:29:27", "name": "전인숙", "church": "선한목자교회", "ours": true, "title": "소망의 꽃", "place": "경기 광주 현충탑에서 시립 도서관 가는 길", "when": "2026년 7월 22일", "story": "그 즈음 맘이 너무 무거운 힘든 일들이 있었다.\n도서관에 가서 마음을 모아 말씀을 보려고 가는길 우산이 꺾이는 폭풍우 속에서도 가녀린 꽃이 아름답게 자기 자리를 지키고 피어있는 것을 보고 '하나님의 돌보심이다' 하고 깨닫고 나에 대한 하나님의 굳건한 사랑을 알았다.\n[로마서 5:3-5:5 말씀]\n다만 이뿐 아니라 우리가 환난 중에도 즐거워하나니 이는 환난은 인내를,\n인내는 연단을, 연단은 소망을 이루는 줄 앎이로다\n소망이 우리를 부끄럽게 하지 아니함은 우리에게 주신 성령으로 말미암아 하나님의 사랑이 우리 마음에 부은 바 됨이니", "ids": ["1SEB-4DxTRHPPsR3kBvxJJWtHpXJgmjHp"], "files": []}, {"n": 240, "ts": "2026. 8. 31 오전 12:38:23", "name": "전인숙", "church": "선한목자교회", "ours": true, "title": "하나님의 섭리", "place": "경기 광주 현충탑에서 시립 도서관 가는 길", "when": "2026년 7월 22일", "story": "힘든 일로 주님께 위로를 얻기 위해 도서관에 가는 길\n폭풍우 속에서도 푸른 나무들이 굳건하게 서 있는 모습을 보고 전능하신 하나님의 사랑과 능력의 말씀이 떠 올라서 힘을 얻었다.\n[로마서 5:3-5:5 말씀]\n다만 이뿐 아니라 우리가 환난 중에도 즐거워하나니 이는 환난은 인내를,\n인내는 연단을, 연단은 소망을 이루는 줄 앎이로다\n소망이 우리를 부끄럽게 하지 아니함은 우리에게 주신 성령으로 말미암아 하나님의 사랑이 우리 마음에 부은 바 됨이니", "ids": ["1vycHEJOr93B0w8wVAC_bW6cYoAG7QC-Y"], "files": []}, {"n": 241, "ts": "2026. 8. 31 오전 1:10:16", "name": "이성주", "church": "선한목자젊은이교회", "ours": true, "title": "주님과 함께", "place": "올림픽공원", "when": "2026년 7월", "story": "각각 둘이서 함께 잔디밭에 있고 시간을 보내는 것이 마치 주님이 말씀을 통해 각각에게 함께하시는 것과 같이 보였습니다", "ids": ["1OvxcqWvsW4yDxSIVm6-jJ4ulfikETWlP"], "files": []}, {"n": 242, "ts": "2026. 8. 31 오전 1:15:50", "name": "이성주", "church": "선한목자젊은이교회", "ours": true, "title": "좁은길", "place": "강릉 심곡항 부근", "when": "2025년 8월", "story": "주님이 매일 주시는 말씀에 순종하는 것이 좁고 구불구불 할지라도, 주님이 멀리서 바라보셨을 때 이 해안도로처럼 아름다운 길이고, 이 시선으로 주님이 우리를 지켜보고 계십니다.", "ids": ["12PKXDMoClTmNB7xoL2sUarXkDLTmf6ht"], "files": []}, {"n": 243, "ts": "2026. 8. 31 오전 1:33:43", "name": "박주희", "church": "젊은이교회", "ours": false, "title": "돛단배", "place": "필리핀 모알보알", "when": "2025년10월 추석", "story": "형용할 수 없는 하나님의 경이로움을 마주하는 지금이 넓은 바다에 혼자있는 돛단배에 함께하시는 주님의 빛과 같기 때문입니다.  \n그 빛은 밝아서 눈뜨고 볼 수 조차 없지만 비춰지는 따스함으로 주님이 언제나 함께 하심을 느낄 수 있습니다.", "ids": ["1iho9WmI77kSTQgrpbl-nIJ-paLfNVFav"], "files": []}, {"n": 244, "ts": "2026. 8. 31 오전 1:44:57", "name": "박주희", "church": "젊은이교회", "ours": false, "title": "산릉선", "place": "가평 필그림하우스 옥상", "when": "2026.05.14", "story": "하나님을 향한 갈급함으로 인해 기도원에 들어가서 주님을 찾기 갈급함으로 옥상 기도방으로 올라가 산봉우리에 넘어가는 빛을 따라 사진을 찍게 되었다\n이사야 52:7 말씀중에 산을 넘는 발이 어찌 그리 아름다운가 라는 말씀이 묵상이 되어지는 사진이다.\n\n시온을 향하여 산을 넘는 마음으로 주님의 아름다움을 알게된다", "ids": ["14XBt7OKJ4_1vak1J_1O1AmK3B0yDLsXF"], "files": []}, {"n": 245, "ts": "2026. 8. 31 오전 1:53:31", "name": "박주희", "church": "젊은이교회", "ours": false, "title": "All days", "place": "필리핀 모알보알", "when": "2025년 10월 추석", "story": "맑은하늘, 뭉게구름, 푸르고맑은바다, 고기잡이하는배\n사진에 찍힌 모든것이\n날마다 주님이 비춰주시는 역동적인 인도하심을 느낄 수 있다.", "ids": ["1TUWI1VsjY_rUvbV_SvA2eLCDKdpw3so-"], "files": []}, {"n": 246, "ts": "2026. 8. 31 오전 8:53:36", "name": "진성완", "church": "선한목자교회", "ours": true, "title": "말씀으로 자라는 아이", "place": "집", "when": "2026.8월", "story": "저희 가정예배는 말씀함께로 하고 있어요. 아직 아이가 알아듣지는 못하겠지만 같이 앉혀둬요. 곧 함께하는 날이 오겠죠", "ids": ["1NSHu0y_PGP3GsQ4RbXr2KGPT8jsvbJvv", "1NwSfCP60MXxXFOpOkLph9wrtdmiDLhV_", "1g_DRAGkZsMzPV_ShS4ubr6NQGDqwlEc6"], "files": []}, {"n": 247, "ts": "2026. 8. 31 오전 10:14:25", "name": "이서윤", "church": "선한목자교회", "ours": true, "title": "천천히, 한 걸음", "place": "선한목자교회 앞", "when": "2025.10.3", "story": "말씀함께로 말씀을 묵상하며 아들과 자립준비청년들을 위해 기도하던 중 에스겔 47장 9절 말씀을 주셨습니다. 주님의 생명강물이 아들에게 흘러가고, 그 생명이 또 다른 이들에게 흘러가기를 기도하고 있습니다.\n아직 교회에 다니지 않는 아들이지만, 교회 행사에 함께 참석하게 되었고 그날 길을 걸어가는 뒷모습을 담았습니다. 크고 특별한 변화보다, 오늘의 이 작은 한 걸음이 감사했습니다. 말씀을 붙들고 기도하며 오늘도 한 걸음씩 걸어갑니다.", "ids": ["1w1l9UqlhEoD0E9a3IrMCCZqeG4_35YKy"], "files": []}, {"n": 248, "ts": "2026. 8. 31 오전 10:36:13", "name": "이혜경", "church": "선한목자교회", "ours": true, "title": "기도", "place": "집", "when": "2027년8월10", "story": "묵상하는 모습", "ids": [], "files": []}, {"n": 249, "ts": "2026. 8. 31 오전 10:42:39", "name": "김민혁", "church": "원남교회 - (말씀함께 구독중)", "ours": false, "title": "「산성이 되시는 주」", "place": "수락산", "when": "2026년 가을", "story": "수락산 주봉 637m, 숨이 턱까지 차오른 뒤에야 만난 하늘이었습니다. 구름 한 점 없이 맑은 하늘, 그 아래 미동도 없이 앉은 바위, 그리고 바람에 펄럭이는 태극기. 이 맑은 하늘을 주신 분이 이 땅을 지켜 오신 분이라는 사실이 그날따라 또렷하게 다가왔습니다. \"여호와는 나의 반석이시요 나의 요새시라\"(시 18:2)는 말씀처럼, 흔들림 없는 저 바위가 우리 삶과 이 나라의 산성 되시는 주님을 닮았다고 생각했습니다. 정상에서 드린 짧은 감사, 그것이 저의 '말씀과 함께한 오늘'이었습니다.", "ids": ["192-Su5tBssLD2oqG6kTt1xyXMbShMpXh"], "files": []}, {"n": 250, "ts": "2026. 8. 31 오전 11:07:17", "name": "서진희", "church": "선한목자교회", "ours": true, "title": "엘레베이터에서의 십자가", "place": "집 엘레베이터", "when": "2026년7월", "story": "하루 일과를 마치고 돌아오는 엘리베이터 안, 초등학교 3학년 딸 은서가 모서리에 반사된 빛에서 십자가를 발견하고 기뻐했습니다.\n\n예상치 못한 곳에서 만난 작은 십자가는 늘 우리 곁에 계시지만 무심코 지나쳤던 주님의 존재를 다시금 올려다보게 합니다. 아이의 순수한 눈을 통해 오늘도 우리와 늘 동행하시는 주님의 임재와 평안을 경험합니다.\n\n(※ 본 사진은 초등2부 이은서 어린이가 직접 촬영한 작품입니다.)", "ids": ["16BE2fdAwUAtAxj5137ioNInxZAwn89r0"], "files": []}, {"n": 251, "ts": "2026. 8. 31 오전 11:25:22", "name": "진성완", "church": "선한목자교회", "ours": true, "title": "말씀으로 자라는 아이", "place": "집", "when": "2026년 08월", "story": "저희 가정예배는 말씀함께로 하고 있어요. 아직 아이가 알아듣지는 못하겠지만 같이 앉혀둬요. 곧 함께하는 날이 오겠죠", "ids": ["1VwtPKZcr1qZWk7bL87K5oMXGnx10QgL9", "1oaFLQ2THsz3hHEF2gTyA3XnciAnUh67W", "1xNARPWuvyQrThW3j0-9-HbNcJlw8PJUi"], "files": []}, {"n": 252, "ts": "2026. 8. 31 오전 11:56:17", "name": "유재훈", "church": "선한목자 온라인교회", "ours": true, "title": "시선을 주님께", "place": "충남 예산 석곡교회", "when": "2026년 6월 여름 단기선교", "story": "하늘을 향해 솟아있는 십자가를 바라보며, 오늘도 말씀을 통해 제 시선을 주님께로 향합니다.", "ids": ["1xRcdhySo8WRAjuf2nybdwOH6MoXJY-T4"], "files": []}, {"n": 253, "ts": "2026. 8. 31 오전 11:59:31", "name": "유재훈", "church": "선한목자 온라인교회", "ours": true, "title": "무안하신 하나님", "place": "정선 새비재", "when": "2026년 7월", "story": "끝없이 펼쳐진 별하늘을 바라보며, 나의 생각과 한계를 넘어 일하시는 무한하신 하나님을 묵상합니다.", "ids": ["1lFEoHJHOiuW9oCkmiRncJxe5RyCLJuwj"], "files": []}, {"n": 254, "ts": "2026. 8. 31 오후 12:07:18", "name": "유재훈", "church": "선한목자 온라인교회", "ours": true, "title": "은혜로 피어나는 하루", "place": "경주시 황남동", "when": "2025년 10월", "story": "햇살 아래 피어난 꽃들처럼, 오늘도 말씀 안에서 주신 은혜를 발견하며 감사로 하루를 살아갑니다.", "ids": ["14p3jUm08T-ybAmq4eckzJoAzVw77QTR9"], "files": []}, {"n": 255, "ts": "2026. 8. 31 오후 1:03:47", "name": "김현희", "church": "산돌감리교회", "ours": false, "title": "길", "place": "이스라엘", "when": "2019년/11월", "story": "모세가 약속의 땅을 바라보았다고 전해지는 느보산에서, 요르단 계곡을 넘어 여리고와 예루살렘 방향으로 이어지는 길을 직접 바라본 순간입니다. 성경 속에서 모세가 하나님의 약속을 바라보았던 장소를 실제로 마주하면서, 말씀 속에서만 보았던 이야기가 현실의 풍경으로 다가왔습니다. 오늘도 하나님의 말씀을 따라 살아가며, 그 말씀이 약속하신 것을 바라보는 믿음을 다시 생각하게 된 순간이기에 ‘말씀과 함께한 오늘’과 연결됩니다.", "ids": ["1cWVgTe6pJDgSqlA5PzG8io0aDd08HEBK", "1X9JrYQjCMaB1oraJjBNGrnFhl-IRNkZI", "1OREk7CZ-x0h8Wnsx_gGp_aLwwmUBbrhN"], "files": []}, {"n": 256, "ts": "2026. 8. 31 오후 1:25:32", "name": "신은자", "church": "선한목자교회", "ours": true, "title": "생명", "place": "송정해수욕장", "when": "2026년 8월", "story": "모래사장에서 피어난 새싹을 보고 생명의 말씀과 어울릴것 같아서", "ids": ["1wbvGfCVaUneNJFDdxM-ow9_NP8vV2R61"], "files": []}, {"n": 257, "ts": "2026. 8. 31 오후 1:51:06", "name": "이주희", "church": "선한목자교회", "ours": true, "title": "하늘 끝에 닿은 땅", "place": "인도 다즐링", "when": "2026.07", "story": "다즐링은 인도의 높은 고산지대로, 해발 약 2,000m에 위치해 있습니다.\n하늘과 가장 가까운 그곳에서 선교하며 하나님의 임재하심을 깊이 경험할 수 있었습니다.\n\n특별히 선교팀과 이른 아침, 말씀함께로 말씀을 묵상한 후 다즐링을 바라보니\n끝없이 펼쳐진 하늘과 맞닿은 풍경이 더욱 특별하게 다가왔습니다.\n마치 하늘과 땅이 만나는 그 자리에서 하나님을 마주한 것 같았습니다.\n\n하나님께 가까이 나아가는 길은 멀리 있는 것이 아니라, 오늘 내게 주신 말씀 앞에 머무는 것입니다.\n\n말씀을 통해 하나님을 만나고,\n말씀을 통해 하나님의 마음을 알고,\n말씀을 통해 다시 세상으로 나아갑니다.\n\n말씀함께로, 매일 Touch Heaven!", "ids": ["1VcYf9BkMV0fVhx4SJ1lIl7YJb6nS78Yz"], "files": []}, {"n": 258, "ts": "2026. 8. 31 오후 1:54:06", "name": "홍석정", "church": "선한목자교회 본교회", "ours": true, "title": "내 길에 빛이니이다", "place": "제주도 어느 오름", "when": "2022년 늦여름", "story": "오름을 오르고 있는데 길 끝에 빛이 보였습니다. \"주의 말씀은 내 발의 등이요 내 길의 빛이니이다\"라는 시편 구절이 생각이 났습니다.", "ids": ["1qQr1SqN8kp6jUBWCF0HRrtc7JQO0DsJT"], "files": []}, {"n": 259, "ts": "2026. 8. 31 오후 1:57:24", "name": "홍석정", "church": "선한목자교회 본교회", "ours": true, "title": "눈을 들어", "place": "제주도 어느 오름", "when": "2022년 늦여름", "story": "오름 정상에서 아들이 앉아서 하늘을 바라보고 있는데 \"내가 산을 향하여 눈을 들리라 나의 도움 어디서 올까 나의 도움은 천지를 지으신 여호와에게서로다\"라는 말씀이 묵상이 되었습니다.", "ids": ["1_2vd_b2acna0Re2-1re9ydmrXQ6abxze"], "files": []}, {"n": 260, "ts": "2026. 8. 31 오후 2:04:40", "name": "홍석정", "church": "선한목자교회 본교회", "ours": true, "title": "천국을 닮은 오늘", "place": "제주도 해변", "when": "2022년 여름", "story": "해변에서 놀고 있는 아이들을 보면서 \"어린아이들을 용납하고 내게 오는 것을 금하지 말라 천국은 이런 사람의 것이니라\" 하신 예수님 말씀이 떠올랐습니다. 지금 이곳이 천국이라는 생각이 들었습니다.", "ids": ["1cZD0bWgBvhVrK0GCZvx60Ne7OdPZQJPo"], "files": []}, {"n": 261, "ts": "2026. 8. 31 오후 2:37:25", "name": "소예영", "church": "선한목자교회", "ours": true, "title": "십자가의 온기", "place": "천호대교", "when": "2024.06.25", "story": "엄마와의 퇴근길, 대교에서 바라본 붉은 노을 속에 문득 십자가가 눈에 들어왔습니다. 지친 몸을 달래던 그 순간, 주님은 늘 변함없이 같은 자리에서 나를 기다리고 계셨음을 느낍니다. 세상의 분주함에서 벗어나 시선을 십자가로 옮길 때, 하루를 감싸주는 참된 평안과 은혜를 누렸던 순간이었습니다.", "ids": ["1GD8ipOsRl-jPcGXvg_BtBm4PkjXoxYzU"], "files": []}, {"n": 262, "ts": "2026. 8. 31 오후 2:45:36", "name": "소예영", "church": "선한목자교회", "ours": true, "title": "하늘보다 높으신", "place": "선한목자교회 입구", "when": "2021.09.26", "story": "2021년 9월, 코로나로 마음도 일상도 한창 답답하고 불안했던 시기였습니다. 예배를 마치고 나오는 길, 교회 처마 너머로 펼쳐진 청명한 하늘을 올려다보았습니다. 세상의 어려움과 제약 속에서도 하나님의 은혜와 크심은 변함없이 저 높고 푸른 하늘처럼 퍼져 있음을 깨달았습니다. 우리의 어떤 상황보다 높고 크신 주님의 사랑을 느끼며 마음 가득 평안을 얻었던 날입니다.", "ids": ["1wrIuGbyHIphoA-8pesfjUntZL22vVGb5"], "files": []}, {"n": 263, "ts": "2026. 8. 31 오후 2:51:53", "name": "소예영", "church": "선한목자교회", "ours": true, "title": "한 마리 어린양", "place": "필리핀 일로일로", "when": "2023.01.03", "story": "서툰 영어로 잃어버린 한 마리 양을 찾으시는 선한 목자의 사랑을 전했습니다. 설교가 끝난 후 두 손을 꼬옥 모으고 기도하는 이 아이를 보며, 주님이 찾아내어 품에 안으신 그 한 마리 어린양을 보았습니다.언어와 문화를 넘어 한 영혼을 향해 찾아오시는 주님의 깊은 사랑을 경험한 제 첫 선교의 기록입니다.", "ids": ["1ke_G3fQTTHzCxmBS2UBHeGvcXhqG9n-v"], "files": []}, {"n": 264, "ts": "2026. 8. 31 오후 2:54:35", "name": "이등록", "church": "선한목자교회", "ours": true, "title": "빈 자리", "place": "우간다", "when": "2018년 10월", "story": "바쁜 하루를 잠시 멈추고, 나무 아래 빈 의자로 나아갑니다. 오랜 시간 한자리를 지켜 온 나무처럼 말씀은 삶에 깊이 뿌리내리고, 무성한 잎으로 그늘을 내어 줍니다. 잔잔한 물결을 바라보며 말씀을 묵상하며, 복잡했던 마음에 주님이 주시는 고요한 평안이 찾아옵니다. 비어 있는 자리는 하나님을 묵상하는 자리로 나아가는 연결 통로입니다.", "ids": ["1W9_lDiszDpXcpZWP_MBwmAv7xZhozFko"], "files": []}, {"n": 265, "ts": "2026. 8. 31 오후 3:21:12", "name": "현리나", "church": "선학목자교회 다윗부", "ours": false, "title": "좁아도 빛나는 길", "place": "발리 남부의 타나 바락 절벽", "when": "2026.8", "story": "\"좁은 문으로 들어가라 멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고 생명으로 인도하는 문은 좁고 길이 협착하여 찾는 이가 적음이니라\" (마태복음 7:13-14)\n\n\n말씀대로 사는 길은 때로 좁고 험난해 보입니다. 세상이 권하는 넓은 길은 쉽고 편해 보이지만, 그 끝은 멸망입니다. \n\n반면 좁은 길은 걷기 힘들고 외로워 보여도, 그 끝에는 영광스러운 면류관과 주님의 환영이 기다리고 있습니다.\n\n지금 걷는 이 길이 힘들고 좁게만 느껴질 때, 이 사진 속 풍경처럼 결국엔 아름답고 멋진 모습이 우리를 기다리고 있음을 믿으며 다시 한번 마음을 다잡아 봅니다.", "ids": ["1cOZuYGnpBYowlDtzU55FrJh_mJ_PBxbs"], "files": []}, {"n": 266, "ts": "2026. 8. 31 오후 3:22:43", "name": "이등록", "church": "선한목자교회", "ours": true, "title": "함께 걷는 길, 어디든지 동행", "place": "제주도", "when": "2017년 12월", "story": "눈이 쌓여 익숙한 길도 낯설게 보이는 눈 덮인 겨울, 길이 보이지 않아도 늘 다니던 길은 알 수 있습니다. 익숙한 습관이 눈 길을 내딛을 힘을 주듯 습관처럼 함께 한 말씀이 내 길을 인도합니다. 말씀을 의지해 오늘의 한 걸음을 내딛습니다. 앞길이 모두 보이지 않아도 말씀은 지금 걸어야 할 길을 알려줍니다. 곧게 선 나무 사이로 보이지 않는 길을, 말씀과 함께 묵묵히 걸어갑니다.", "ids": ["15ZXHgBYeWGyAti70Cyu3TVA4FLOjO2At"], "files": []}, {"n": 267, "ts": "2026. 8. 31 오후 3:30:41", "name": "이주희", "church": "선한목자온라인교회", "ours": true, "title": "Up where We belong ✨️🎶", "place": "싱가포르", "when": "2019년 7월", "story": "싱가포르 단기선교 때 매 순간 말씀이신 예수님과 동행하며 찍었는데, 그 때의 그 주님께서 오늘 이 시간도 나와 함께 하고 계심", "ids": ["1fBhqoKT9fRbFIQ-i6INFGAjq81LarDXD", "1TCUud_Am5EnqLcHLasu0gVz0fegLl4k8", "1vJUawzm78J1sg5GHS4TT9e-2kdkY4Z31"], "files": []}, {"n": 268, "ts": "2026. 8. 31 오후 3:36:22", "name": "김상오", "church": "선한목자교회", "ours": true, "title": "작은 나", "place": "케나 말린디 로사다비치", "when": "2025년 7월", "story": "넓은 바다 위 홀로 작은 배 위에 서있는 작은 아이는 세상 속 에서 살아가는 힘없는 '나'를 떠올리게 합니다.바다는 두려운 존재이지만,동시에 우리에게 많은 것을 가져다 주는 존재입니다.이런점에서 끝없이 펼쳐진 바다는 주님과 같습니다.주님은 벌하시는 분이시기도 하지만,우리에게 사랑을 주시고 영생을 주시는 분이십니다.우리는 주님 없이는 살아갈 수 없습니다.", "ids": ["1fletDfWqN0GOw3IQhbQh8OEY5PGMDMhw"], "files": []}, {"n": 269, "ts": "2026. 8. 31 오후 3:53:05", "name": "이등록", "church": "선한목자교회", "ours": true, "title": "다시 오실 주님을 기다리며", "place": "제주도", "when": "2017년 12월", "story": "해가 저물어 어둠이 다가오지만, 억새는 다시 떠오를 태양을 향해 두 손을 든 듯 빛을 바라봅니다. 이 모습은 어둠 속에서도 소망을 잃지 않고, 다시 오실 주님을 기다리는 성도들을 닮았습니다.  오늘도 말씀으로 마음의 등불을 밝히고 삶의 자리를 지키고, 영광의 하나님을 찬양하며, 다시 오실 예수님을 기다립니다.", "ids": ["12ohT_nAr28oYwHkcI0eB330uK4JjyiGE"], "files": []}, {"n": 270, "ts": "2026. 8. 31 오후 4:06:18", "name": "정윤주", "church": "선한목자교회", "ours": true, "title": "덤불 속의 빛", "place": "순천만", "when": "2026.7.24", "story": "모든 인생은 헤쳐나가야할 덤불이 많지만 예수님을 믿는 성도들은 오직 빛이신 말씀을 따라 살아가는 삶이기에(시119:105)", "ids": ["1aILsj7PGgni84K7EDei44x3ugOYWsZzG", "1vC-baHHBZllxdLx2P7BQw61uYtrBuCHP", "11OMb1sgw-7N_XzqrKNTKcTKoohDXhtzp"], "files": []}, {"n": 271, "ts": "2026. 8. 31 오후 4:14:38", "name": "박미리", "church": "선한목자젊은이교회", "ours": true, "title": "말씀과 함께 걸어온 오늘", "place": "오스트리아 인스부르크", "when": "2017년 6월", "story": "말씀을 마음에 품고 걸으면 평범한 하루의 길도 조금 다르게 보입니다. 나무 사이로 이어진 길과 멀리 보이는 산을 바라보며 오늘도 하나님께서 인도하시는 길을 한 걸음씩 걸어왔음을 떠올렸습니다. 말씀과 함께 걷는 오늘은 어디로 향하는지 알 수 없어도 하나님을 믿으며 걸어가는 하루입니다.", "ids": ["1XESEbBROhh0wpCTn4AvdbFoBs32FZrA-"], "files": []}, {"n": 272, "ts": "2026. 8. 31 오후 4:17:31", "name": "강성은", "church": "선한목자교회", "ours": true, "title": "주님 자리", "place": "충북 제천시 수산면 옥순봉로", "when": "2021년 7월", "story": "가족들과 여행가서 이 장면을 본 순간..'내마음의 한자리' 찬양이 떠올랐네요.", "ids": ["1rnr4tSPnLha4Cu_iDaw0j5-Mb6FiQy-Y"], "files": []}, {"n": 273, "ts": "2026. 8. 31 오후 4:25:15", "name": "강성은", "church": "선한목자교회", "ours": true, "title": "곧은 길", "place": "경기도 하남시 당정뜰", "when": "2024년 4월 8일", "story": "이 곧은 벗꽃길을 보며 시편 119:105 말씀이 생각났어요. \"주의 말씀은 내발의 등불이며, 내 길의 빛입니다.\"", "ids": ["1Q8eZcv2UkxnvmDNQ4UUpA6NPvsIDIF1p"], "files": []}, {"n": 274, "ts": "2026. 8. 31 오후 4:25:36", "name": "김상오", "church": "선한목자교회", "ours": true, "title": "여명", "place": "케냐 Voi Wildlife Lodge", "when": "2025년 7월", "story": "짙은 밤이 가고 빛이 찾아오는 여명의 시간,태양은 붉은 빛을 내뿜으며 칠흑같던 어둠을 내쫓는다.\n우리의 삶은 마치 여명이 오기 전과같이 너무나도 어둡고 힘듭니다.이를 해결할 수 있는것은 오직 하나님 뿐이요 그분의 말씀뿐입니다.여명의 시간 태양이 떠오름과 동시에 말씀으로 하루를 시작을 한다면 우리는 조금이라도 세상 속 어둠을 밀어내며 더 나은 오늘을 살아갈 수 있을것입니다.", "ids": ["1cuxC0Zd14rC_NV-45OOVRlt2NjooOyIu"], "files": []}, {"n": 275, "ts": "2026. 8. 31 오후 4:30:12", "name": "박미리", "church": "선한목자젊은이교회", "ours": true, "title": "말씀 안에서 누리는 오늘", "place": "프랑스 엑상프로방스", "when": "2017년 6월", "story": "분수가 흐르고 누군가는 자전거를 타고 누군가는 천천히 산책하는 평화로운 오후. 특별할 것 없는 하루의 한 장면이지만 잠시 멈춰 바라보니 평범한 일상 속에도 하나님이 주신 평안과 감사가 머물러 있음을 느꼈습니다. 말씀과 함께한 오늘은 작은 순간에도 감사하며 살아가는 하루였습니다.", "ids": ["1Mj9zxf1Ait-uRhMNsmXeWgHV4HhlmqrT"], "files": []}, {"n": 276, "ts": "2026. 8. 31 오후 4:31:48", "name": "강성은", "church": "선한목자교회", "ours": true, "title": "주님과 함께", "place": "서울시 중구 퇴계로", "when": "2026년 7월 28일", "story": "도심 옥상에 나란히 있는 두 의자를 보고 저와 주님이 생각났어요. 디모데후서 2:11 \"우리가 주님과 함께 죽으면, 주님과 함께 다시 살아나게 될 것입니다.\"", "ids": ["1Zvvlv0-C2F6fR3-XRm1TNE41fjmh6Wii"], "files": []}, {"n": 277, "ts": "2026. 8. 31 오후 4:33:43", "name": "박미리", "church": "선한목자젊은이교회", "ours": true, "title": "기다림도 말씀과 함께", "place": "스위스 기차 플랫폼", "when": "2017년 6월", "story": "고요한 플랫폼에 기차 한 대가 천천히 들어옵니다. 언제 도착할지 알 수 없는 순간에도 묵묵히 자리를 지키며 기다리는 것처럼, 우리의 삶에도 기다림의 시간이 찾아옵니다. 그 시간에도 말씀을 붙들면 조급함 대신 믿음을 배웁니다. 오늘도 하나님께서 가장 좋은 때에 나를 인도하신다는 믿음으로 기다립니다.", "ids": ["1LzT8hp7jkq9PTm6dZjxG1LTOxwdcgRgQ"], "files": []}, {"n": 278, "ts": "2026. 8. 31 오후 5:30:14", "name": "정하은", "church": "인천 비전교회(기독교대한성결교회)", "ours": false, "title": "오늘도, 말씀을 따라", "place": "인천 송도 솔찬공원 앞 바다", "when": "2025년 10월 8일", "story": "10월, 가족들과 함께 구경하러 간 바다에서 한참을 바라보다 햇빛이 물 위에 길처럼 이어져 있는 모습을 보았습니다.\n풍경을 보며 우리가 지금 걷고 있는 하루도 이와 같다는 생각이 들었습니다.\n\n앞이 선명하게 보이지 않을 때도 있지만, 해처럼 빛나는 말씀을 붙들고 한 걸음씩 걸어가다 보면 하나님께서 마땅히 우리가 살아갈 길을 비춰주신다는 것을 느꼈습니다.\n\n사진 속 담긴 풍경을 보며 제가 느꼈던 것처럼, 일상 속 바쁘게 살아가는 모든 분들이 평범한 오늘 속에서도 하나님의 인도하심을 발견하실 수 있었으면 좋겠습니다.", "ids": ["194mDnDBINfvhBXM81aJptRCCYD-Xaygi"], "files": []}, {"n": 279, "ts": "2026. 8. 31 오후 5:37:40", "name": "김해은", "church": "선한목자 젊은이교회", "ours": true, "title": "빛", "place": "양평 벗고개터널", "when": "2025.05.31", "story": "당시 여러 과제가 한꺼번에 몰려 바쁘고 지쳐 있었고, 해야 할 일들에 마음을 빼앗겨 주님을 잊으며 살아가고 있었습니다.\n\n그날도 과제를 위해 서울을 벗어나 사진을 찍으러 갔습니다. 어두운 곳에서 하늘을 올려다보니 서울에서는 불빛에 가려 보지 못했던 수많은 별과 은하수가 밤하늘을 가득 채우고 있었습니다. 살면서 그렇게 많은 별을 본 것은 처음이었습니다.\n\n그 순간 에베소서 6장 18절의 “깨어 구하기를 항상 힘쓰며”라는 말씀이 떠올랐고, 삶 속의 수많은 것들에 마음을 빼앗겨 정작 바라보아야 할 주님을 잊고 있었던 제 모습을 말씀하시는 것 같았습니다. 어둠 속에서야 비로소 별빛을 제대로 볼 수 있었던 것처럼, 내가 진짜로 바라봐야 하는 것이 무엇인지 다시 깨닫게 하신 날이었습니다.", "ids": ["1RISg_CW-tDwjS2WVHRhqA3XNFJSixyMT"], "files": []}, {"n": 280, "ts": "2026. 8. 31 오후 5:39:05", "name": "김지현", "church": "선한목자교회", "ours": true, "title": "계곡에서도 함께하시는 주님", "place": "철원 계곡", "when": "2026.8.6", "story": "친구들과 계곡 캠핑가서 제일 먼저 말씀 함께를 묵상하고 나눴습니닷", "ids": ["16VU2an9DlJzIxDJXBzE3D9vLaXWW-RBA", "1ECiBznj406_W7gyNZrnwRI3u5rv6BcUA"], "files": []}, {"n": 281, "ts": "2026. 8. 31 오후 5:44:25", "name": "정하은", "church": "인천 비전교회(기독교대한성결교회)", "ours": false, "title": "말씀 앞에서", "place": "미국 워싱턴주 시애틀 훼드럴웨이제일장로교회", "when": "2025.06.22", "story": "미국 시애틀에서 찬양 선교를 위해 방문했던 교회에서 무대 지원을 위해 바쁘게 오가던 중, 꽃과 함께 놓인 말씀 한 구절을 보게 되었습니다.\n\n“존귀한 자는 존귀한 일을 계획하나니 그는 항상 존귀한 일에 서리라.” (이사야 32:8)\n\n비록 말씀 앞에 머문 시간은 찰나였지만, 이 말씀은 제 마음 속에 오래 남았습니다.\n\n돌이켜보면 그날 제가 하고 있던 찬양과 섬김 역시 누군가를 위한, 그리고 하나님을 위한 작은 존귀한 일이 아니었을까 생각했습니다.\n\n저에게 ‘말씀과 함께한 오늘’은 거창한 순간이 아니라, 바쁜 하루 가운데 잠시 멈춰 말씀을 바라보고, 그 말씀을 마음에 담아 내가 서있는 곳에서 하나님을 더욱 생각하며 말씀대로 살아가기에 노력하는 삶이지 않을까하는 생각이 듭니다.", "ids": ["1GIR0SgsG97g64KV5l2l8fUGR9ul5pcP5"], "files": []}, {"n": 282, "ts": "2026. 8. 31 오후 5:49:29", "name": "김지현", "church": "선한목자교회", "ours": true, "title": "인도하심", "place": "인도 다즐링", "when": "2025년 7월", "story": "인도 단기 선교 동안 매일 말씀함께로 이끌어가시는 중에 만나게 하신 경관으로, 세심하게 챙겨주시는 분 광활하신 분을 묵상하였습니다.", "ids": ["1PMrh2v4N4r6tt-skctImOGjH6Sn2MlNW", "1domw7J6oGoQJVzUoqQk4rzLYkLtlugFw"], "files": []}, {"n": 283, "ts": "2026. 8. 31 오후 6:00:00", "name": "김해은", "church": "선한목자 젊은이교회", "ours": true, "title": "기다림", "place": "자양 한강공원", "when": "2024.04.22", "story": "당시 여러 과제로 바쁜 시간을 보내면서도 기도와 말씀을 놓치지 않고 예배의 자리를 지키려고 애쓰던 시기였습니다. 노을을 촬영해야 했지만 며칠 동안 흐린 날씨가 이어졌고, 촬영하는 날마다 노을이 보이지 않아 속으로 “조금이라도 보여달라”고 계속 기도했습니다.\n\n마지막 촬영 날에도 큰 기대 없이 한강공원에 나갔는데, 노을은 보이지 않았고 실망하여 촬영을 마칠 무렵 갑자기 하늘이 붉게 물들기 시작했습니다. 며칠 동안 기다리고 기도했던 노을을 마지막 순간에 만나니 감사한 마음이 컸습니다.\n\n그날 사진을 촬영하면서 내가 생각하고 정한 때와 하나님께서 이루시는 때가 다르다는 것을 느꼈습니다. 내가 원하는 순간에 이루어지지 않는다고 해서 응답이 없는 것이 아니라는 것을, 기다리는 과정 속에서 다시 배울 수 있었습니다.", "ids": ["1Y9eCHSRBuYr9p83Tzg7ytIUQssHeMGy8"], "files": []}, {"n": 284, "ts": "2026. 8. 31 오후 6:54:39", "name": "최수락", "church": "선한목자교회", "ours": true, "title": "쉴만한 곳", "place": "미국 콜로라도", "when": "2009년 10월", "story": "이곳은 주님이 만드신 자연으로 평안이 느껴지는 고을 촬영한 사진입니다", "ids": ["1Kg-WcO4we5gll8BahGHu1QxHt687yYol"], "files": []}, {"n": 285, "ts": "2026. 8. 31 오후 6:56:29", "name": "최수락", "church": "선한목자교회", "ours": true, "title": "푸른초장", "place": "미국 콜로라도", "when": "2022년 7월", "story": "이곳은 주님이 만드신 자연으로 평안이 느껴지는 고을 촬영한 사진입니다", "ids": ["1fE49C8NnYKvsscWT2-pS-LfVnZJrx9uo"], "files": []}, {"n": 286, "ts": "2026. 8. 31 오후 7:01:57", "name": "최수락", "church": "선한목자교회", "ours": true, "title": "하늘을 바라보라", "place": "서산", "when": "2014년 12월", "story": "하늘에도 주님이 만드신것들이 많이 있습니다", "ids": ["1N6_5jFid2h42Zus_yqnmmf9ndkcS33pP"], "files": []}, {"n": 287, "ts": "2026. 8. 31 오후 7:15:23", "name": "이하은", "church": "선한목자교회", "ours": true, "title": "사랑의 색깔", "place": "뚝섬 한강공원", "when": "2026년 8월", "story": "말씀을 읽으면 읽을수록 하나님의 사랑에\n대해 고민하고 또 깨닫게됩니다.\n원래 제 안의 기준으로 바라볼 때 하나님의 사랑은 한 두가지 색으로 마무리됩니다.\n그런데 말씀을 읽을수록 하나님의 사랑의 색깔은 내가 알 수 없을만큼 다양하고 내 기준으로 단정할 수 없다는 것을 깨닫습니다.\n때로는 먹구름이 가득껴 사랑이 느껴지지 않는것 같다가도 눈을 들면 하나님의 사랑은 그 어떤 때보다 뜨겁게 활활 타오르는 노을 같습니다.\n때로는 파란하늘과 같이 높고, 때로는 분홍처럼 따듯한 사랑이기도 합니다.\n하나님의 사랑은 전부 이해할 수 없지만 저를 압도하기에 충분합니다.", "ids": ["1FKCLLjJi0lJqAZYhPBIWo1NEKEmzfA0i"], "files": []}, {"n": 288, "ts": "2026. 8. 31 오후 7:47:42", "name": "우승란", "church": "선한목자감리교회", "ours": true, "title": "그 안의 질서(Patterns of Creation)", "place": "어느 공원인지 생각이 안나네요.", "when": "2022년 10월", "story": "시간에 순응하여 떨어진 낙엽이 빚어낸 색과 조화처럼, 하나님의 말씀 안에서 평범한 오늘에 깃든 아름다움을 발견합니다.", "ids": ["1aJYzwUYpnpECiP-8EDbSI-9XJ8165F9C"], "files": []}, {"n": 289, "ts": "2026. 8. 31 오후 7:57:46", "name": "김태영", "church": "선한목자감리교회", "ours": true, "title": "기르시는 하나님", "place": "남이섬", "when": "2026년6월", "story": "무엇을 먹을까 무엇을 마실까 몸을 위하여 무엇을 입을까 염려하지 말라, 너희 하늘 아버지께서 기르시나니 너희는 이것들보다 귀하지 아니하냐,  그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라", "ids": ["1DMKV4qPF18TBstVfM134kM_7qkxR235D"], "files": []}, {"n": 290, "ts": "2026. 8. 31 오후 7:59:28", "name": "우승란", "church": "선한목자감리교회", "ours": true, "title": "마태복음 6:29–30", "place": "양평 우리텃밭", "when": "2024년 5월", "story": "누구의 손길이 닿지 않아도 피어난 예쁜 들꽃(주걱개망초)을 보며 마태복음 6장의 말씀을 떠올립니다. 오늘 있다가 내일 사라질 들풀도 입히시는 하나님의 세심한 돌보심을 생각하며, 오늘도 걱정보다는 주님을 의지하기로 마음먹습니다.", "ids": ["14HxYLaHXdduUEOKhi7j5Ibep0uVHD-jm"], "files": []}, {"n": 291, "ts": "2026. 8. 31 오후 8:01:46", "name": "김태영", "church": "선한목자감리교회", "ours": true, "title": "하나님의 눈", "place": "호텔", "when": "2018년 6월", "story": "나를 눈동자 같이 지키시고(시편17편)", "ids": ["1LB4z6KWjhgKFftjFgLT9OUDP5PbdXbKs"], "files": []}, {"n": 292, "ts": "2026. 8. 31 오후 8:19:03", "name": "김찬우", "church": "선한목자교회", "ours": true, "title": "소소한 은혜", "place": "동네", "when": "2026년 5월", "story": "우리 주변의 소소한 모습 속에서 다가오는 아름다움과 은혜의 순간을 함께 느끼고 싶었습니다.", "ids": ["1EFWBNZDchXIB_B01XesRz99k4ZY5oKgu", "1jxpPtvc0U463YlJ28_IMc7eVDHgm3RwE", "1SmQxkYmuBovoIFqBUzqqBx2VOnkMFG1T"], "files": []}, {"n": 293, "ts": "2026. 8. 31 오후 8:22:51", "name": "이서윤", "church": "선한목자교회", "ours": true, "title": "말씀 따라 피어나는 계절", "place": "서울동부지방법원등기국 근처", "when": "2026년5월", "story": "시냇가에 심은 나무처럼, 오늘도 말씀에 뿌리내리고 주님의 생명으로 살아가기를 소망합니다.", "ids": ["1M3WT74RRqkuWfR_hqFM4dyxnqXkfkUo5"], "files": []}, {"n": 294, "ts": "2026. 8. 31 오후 8:24:53", "name": "우승란", "church": "선한목자감리교회", "ours": true, "title": "감자꽃", "place": "양평 텃밭", "when": "2025년 6월", "story": "땅속의 열매를 기다리는 동안 감자가 아름다운 꽃을 피웠습니다. 감자를 얻기까지의 과정을 누리듯, 말씀을 의지하며 오늘 주어진 과정에도 감사하고 충실합니다.", "ids": ["1Er7KOAq6A52CIEFRi30X0Wr4sZNsujV2"], "files": []}, {"n": 295, "ts": "2026. 8. 31 오후 9:01:32", "name": "김형래", "church": "선한목자온라인교회", "ours": true, "title": "섬, 논", "place": "전남 장흥군 바닷가 소등섬,  장흥군 논 풍경", "when": "2026년 8월 여름", "story": "나의 도움이 어디서 올꼬 천지를 지으신 여호와 에게서로다", "ids": ["1Z4ZLdSrwRLvshuyETy7ShkQaG7myIumt", "1XA88gu3xqbAPl9ZwEZN1-y8SwTgyuKic", "1V9QC93xNJXpotOj4-L94HbKKj7MNT0mY"], "files": []}, {"n": 296, "ts": "2026. 8. 31 오후 9:03:06", "name": "박진주", "church": "선한목자교회", "ours": true, "title": "언약", "place": "집 앞", "when": "2026년 7월", "story": "내가 내 무지개를 구름 속에 두었나니 이것이 나와 세상 사이의 언약의 증거니라    - 창 9:13 -\n\n너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라     - 엡 2:8 -\n\n비가 그친 후 하늘에 떠오른 쌍무지개를 보며, 예수님의 십자가로 예언을 통한 언약의 말씀을 성취하시고, 예수님을 믿음으로 더 이상 죄의 종이 아닌 하나님의 자녀가 되는 구원을 주신 전적인 \"은혜\"를 묵상하며 감사하게 되었습니다.", "ids": ["1A0YDkC9Djbz9PC5PBakDVA4Vuz9BvgrA"], "files": []}, {"n": 297, "ts": "2026. 8. 31 오후 9:06:23", "name": "우은주", "church": "선한목자교회", "ours": true, "title": "저녁노을", "place": "태안", "when": "2026년 봄", "story": "하루를 지내온 시간도 주님께서 저 노을빛처럼 포근하게 함께 하셨습니다.", "ids": ["1W26uj--_f2EmAKH3xW1OUBiT7W7rB_Ct"], "files": []}, {"n": 298, "ts": "2026. 8. 31 오후 9:11:07", "name": "박진주", "church": "선한목자교회", "ours": true, "title": "형제", "place": "필리핀 마발독 원주민 마을 가는 길", "when": "2026년 6월", "story": "누구든지 하나님의 뜻대로 행하는 자가 내 형제요 자매요 어머니이니라     - 막 3:35 - \n\n2026년 6월 필리핀 의료선교 중, 네그리토 종족이 사는 마발독이라는 원주민 마을에서 진료를 위해 방문하신 한 분이 진료를 받고 중보기도팀에서 함께 기도하는 모습입니다.\n한번도 본적도 없고 언어도 피부색도 문화도 하는 일도 모두 다른 이 분과 우리가 무슨 상관이 있을까 싶지만, 주님께서는 누구든지 하나님의 뜻대로 행하는 자가 내 형제라고 하신 말씀이 생각났습니다.\n이 분은 주님 안에서 우리의 형제요, 가족임이 느껴져 뜨거운 마음으로 형제의 구원과 영육의 건강을 위해 함께 기도하였습니다.", "ids": ["1kOtw1iHAdf3WyYJzaX7hnEMq70QvPjCS"], "files": []}, {"n": 299, "ts": "2026. 8. 31 오후 9:11:42", "name": "박초은", "church": "선한목자감리교회", "ours": true, "title": "변함없이곁에게신임재/ 어둠을밝히는은혜의빛/ 말씀의시냇가에심은삶", "place": "송파책박물관 근처, 잠실한강공원, 성내천", "when": "2023년 6월 / 2026년 6월 / 2026년 4월", "story": "부드러운 분홍빛 구름 사이로작지만 또렷  하게 더 있는 초승달은, 바쁜 일상 속에서 우리가 잊고 지낼 때조차 묵묵히 우리의 곁을 지키시는 주님의 사랑을 닮았습니다.하늘이 물드는 순간에 주님의 음성에 귀를 귀울이며 평범한 하루도 주님의 은혜로 채워져 있음을 깨닫습니다.\n\n어둠이 내려앉는 해 질 녘, 지평선 너머로 강렬하게 비추는 일몰의 빛은 하루의 끝자락에서도 우리를 따뜻하게 감싸 안는 주님의 은혜를 떠올리게 합니다. 어두워지는 도심 속에서 말씀은 우리가 걸어가야 할 길을 환하게 밝혀주는 등불이 됩니다. 지친 하루를 마무리하면서 밝게 빛나는 노을을 바라보며 나를 향한 주님의 신실한 인도하심을 묵상했습니다.\n\n맑은 시냇가 곁에 흐드러지게 피어난 벚꽃나무는 생명력으로 가득 차 있습니다. 말씀이라는 생먕수에 뿌리를 내릴 떄 우리의 오늘이 얼마나 풍성하고 아름다워질 수 있는지를 보여줍니다. 계절의 변화 속에서 만물을 새롭게 하시는 주님의 은혜를 바라보며, 말씀 안에 거할 떄 맺어지는 감사와 사랑의 열매를 묵상한 하루입니다.", "ids": ["1lS8ol65Un_AI0Yo9FttdE1-g4JYQ-my4"], "files": []}, {"n": 300, "ts": "2026. 8. 31 오후 9:12:26", "name": "우은주", "church": "선한목자교회", "ours": true, "title": "자유로움", "place": "하와이 마우이섬의 농장", "when": "2026년 7월말", "story": "푸른 대자연에서의 자유로운 엘크의 모습이 주님의 말씀 안에서 함께하며 자유로운 나의 모습같습니다.", "ids": ["1Y0U2qDnTniy2rieZiiCVA7_X3hR7qkYR"], "files": []}, {"n": 301, "ts": "2026. 8. 31 오후 9:15:57", "name": "강승택", "church": "선한목자교회", "ours": true, "title": "한 민족, 한 소망", "place": "고성 통일전망대", "when": "2025년 여름", "story": "북녘 땅을 바라보며 분단의 현실을 넘어 하나님께서 이루실 회복과 평화를 묵상했습니다. 말씀 안에서 하나 됨의 소망을 품고 그날을 위해 기도하는 마음을 담았습니다.", "ids": ["1RN96ZAH7ba-if67AL8v8xHnAq7Ph51Dh"], "files": []}, {"n": 302, "ts": "2026. 8. 31 오후 9:21:38", "name": "박진주", "church": "선한목자교회", "ours": true, "title": "산 넘고 물 건너", "place": "필리핀 마발독 원주민 마을로 가는 길", "when": "2026년 6월", "story": "오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라     - 행 1:8 -\n\n2026년 6월 필리핀 단기 의료선교 일정 중에 네그리토종족이 사는 마발독이라는 원주민 마을에 가서 3시간 정도 짧게 진료와 중보기도를 하고 돌아왔습니다.\n이 곳은 산속에 있고, 포장된 도로가 없습니다.\n이 곳까지 가는 길은 숙소에서 2시간 버스를 타고, 군용 트럭으로 갈아타서, 1시간 반 정도를 산을 넘고 물을 건너야  도착을 합니다.\n왕복 7시간여의 긴 시간이 걸렸지만, 그곳까지 하나님이 기다리시는 한 영혼, 한 영혼을 만나기를 기대하는 마음으로 갔다가, 그 분들이 예수님을 꼭 만나기를 기도하는 마음으로 돌아오는 그 길이 결코 지루하거나 힘들지 않았습니다.\n성령이 우리와 함께 계시니, 우리는 땅 긑까지 복음을 들고 나아가야 함을 알고 있을 뿐 아니라, 그 길이 얼마나 하나님께서 기뻐하실지 알기 때문입니다.\n\n좋은 소식을 전하며 평화를 공포하며 복된 좋은 소식을 가져오며 구원을 공포하며 시온을 향하여 이르기를 네 하나님이 통치하신다 하는 자의 산을 넘는 발이 어찌 그리 아름다운가\n- 사 52:7 -\n\n복음의 씨앗이 뿌려진 곳곳에 하나님의 정확하신 때에 자라고 열매맺는 구원의 역사가 임할 것을 믿습니다!", "ids": ["1xKSHCK--uk9cpuliJrA_7l4njyeh-gcK", "1cgmlGmoWdS7y55v8dMPHAGVllEUBEgjE", "1E3R6Il6VRAELox3zA9a9WdwGE9ZDAin8"], "files": []}, {"n": 303, "ts": "2026. 8. 31 오후 9:26:21", "name": "강승택", "church": "선한목자교회", "ours": true, "title": "약속을 기억합니다", "place": "강원 봉포항", "when": "2025년 가을", "story": "비가 그친 하늘에 무지개가 떠오른 모습을 바라보며 하나님의 약속을 묵상했습니다. 눈앞의 상황이 흐리고 어려울 때에도 하나님께서 주신 약속은 변하지 않음을 기억하며, 오늘도 말씀을 붙들고 살아가기를 소망했습니다.", "ids": ["1mPs6EOcS90nUrfyYKOGb9Cmq0HhN9QnY"], "files": []}, {"n": 304, "ts": "2026. 8. 31 오후 9:34:34", "name": "강승택", "church": "선한목자교회", "ours": true, "title": "어둠 속에 비추는 빛", "place": "남한산성 서문", "when": "2025년 9월 4일", "story": "20대, 주님을 부정하며 살아가던 어느 날 교회 형들의 손에 이끌려 올라갔던 남한산성 서문에서 바라본 야경입니다. 화려한 도시의 불빛 가운데 유난히 눈에 들어온 빨간 십자가를 바라보며, 다시 주님께 돌아서게 되었습니다. 그 자리에서 주저앉아 눈물로 회개했던 그 시간을 아직도 기억합니다. \n그저 교회 위에 켜진 하나의 빨간 불빛이었지만, 그날 저는 다시는 주님을 떠나지 않겠다고 마음속으로 약속했습니다. 그리고 시간이 흐른 지금도 하나님께서는 약속의 말씀처럼 제 삶을 계속해서 빛으로 비추고 계심을 고백합니다. 보이지 않는 순간에도 주님을 신뢰하며 살아가기를 소망합니다.\n그날의 회개와 다짐을 기억하며, 오늘도 주님께 붙어 살아가기를 소망하는 마음으로 이 사진을 올립니다. (이후 가끔 혼자서, 때론 가족들과 함께 올라가서 기도하고 내려옵니다)", "ids": ["1VxKBQ20knGdZvIMh8oEW8_1hoE9D0KEY"], "files": []}, {"n": 305, "ts": "2026. 8. 31 오후 9:59:50", "name": "문혜원", "church": "젊은이교회", "ours": false, "title": "빛은 여전히", "place": "잠원동", "when": "2026년 8월 4일", "story": "길을 가다가 문득 뒤돌아보았는데, 햇빛이 구름 사이로 가려져 있다가 그 틈으로 빛을 뿜어내는 모습을 보게 되었습니다. 그 모습이 오늘 말씀과 함께 하나님께서 어둠과 구름 가운데서도 여전히 빛을 비추고 계신다는 의미로 다가왔습니다. 그래서 이 사진이 말씀과 함께한 오늘을 떠올리게 합니다.", "ids": ["1mXNtr9ucbBeH5xg8RpzjH0Wzd8YvoGzq"], "files": []}, {"n": 306, "ts": "2026. 8. 31 오후 10:02:26", "name": "문혜원", "church": "젊은이교회", "ours": false, "title": "오늘이라는 은혜", "place": "상도동", "when": "2026년 4월 28일", "story": "하루의 끝자락, 세상을 따뜻하게 감싸 안는 핑크빛 노을은 말씀이 우리 삶에 전해주는 평안과 닮아 있습니다. 매일 반복되는 평범한 일상이지만, 말씀을 품고 잠시 멈추어 주변을 둘러볼 때 비로소 오늘이라는 시간의 아름다움을 마음에 담게 됩니다. 노을빛으로 물든 풍경처럼, 말씀과 함께하는 삶이 매일의 걸음을 따스하게 밝혀준다는 메시지를 담았습니다.", "ids": ["1TrZ4OyM11eO8WtKOIUdnlhgTrmLLVvHj"], "files": []}, {"n": 307, "ts": "2026. 8. 31 오후 10:02:59", "name": "오유나", "church": "선한목자교회", "ours": true, "title": "구름 너머의 약속", "place": "분당수서로(분당 방향)", "when": "2026.08.13", "story": "구름 사이로 드러난 무지개를 바라보며 어두운 순간에도 변함없이 함께하시는 하나님을 떠올렸습니다. 우리의 눈에는 길이 보이지 않을 때에도 하나님의 약속은 여전히 우리 곁에 있습니다. 이 사진을 통해 말씀 안에서 다시 소망을 발견하고 하나님의 신실하심을 기억하기를 소망합니다.", "ids": ["1Cl8fyW2F73NTgEygvI6HGZz3fzdIme1P"], "files": []}, {"n": 308, "ts": "2026. 8. 31 오후 10:04:54", "name": "문혜원", "church": "젊은이교회", "ours": false, "title": "밤에 피어난 은혜", "place": "잠원동", "when": "2026년 4월 7일", "story": "고요하고 어두운 밤하늘을 배경으로 환하게 빛나는 벚꽃처럼, 말씀은 지친 하루의 끝에서 저를 환히 밝혀주는 빛이 되어주었습니다. 바쁘고 고단했던 일상이었지만 밤길에 만난 꽃 한 송이를 보며 잠시 멈추어 섰듯, 매일 말씀을 통해 삶의 쉼과 은혜를 발견합니다. 어둠 속에서도 자신만의 빛을 잃지 않는 꽃처럼 말씀과 함께 따스하게 물든 나의 오늘을 표현하고자 했습니다.", "ids": ["1OakLPrpxPJiuw3Z5EtLifObINp7USvUQ"], "files": []}, {"n": 309, "ts": "2026. 8. 31 오후 10:09:08", "name": "박미혜", "church": "선한목자교회 다윗공동체", "ours": true, "title": "말씀이 비추는 오늘의 길", "place": "호주", "when": "2022년  5월", "story": "하루의 길을 달려온 차들이 저마다의 목적지를 향해 나아가고 있습니다.\n저 멀리 산 너머로 저무는 햇살은 오늘 하루가 지나가고 있음을 보여주지만, 그 빛은 어둠이 시작되는 순간에도 길을 잃지 않게 합니다.\n\n우리의 믿음도 이와 같다고 생각합니다.\n매일의 삶에는 어디로 가야 할지 알 수 없는 순간과 예상하지 못한 굴곡이 있지만, 하나님의 말씀은 오늘이라는 길 위에서 우리의 방향을 밝혀주는 빛이 되어 줍니다.\n\n사진 속 도로는 앞으로 길게 이어지고, 그 위를 달리는 한 대의 자동차는 오늘도 말씀을 붙들고 자신의 길을 걸어가는 우리의 모습처럼 보입니다.\n하늘에 남은 따뜻한 빛처럼, 말씀과 함께한 오늘은 평범한 하루일지라도 하나님의 인도하심을 발견하는 시간이 됩니다.\n\n오늘도 말씀을 따라 걷고,\n말씀을 따라 달리고,\n말씀 안에서 내일을 향해 나아갑니다.\n\n그래서 이 사진은 단순히 ‘아름다운 저녁 풍경’이 아니라,\n**“말씀과 함께라면 오늘의 길도 은혜가 되고, 내일을 향한 길도 소망이 된다”**는 고백을 담고 있습니다.", "ids": ["1NtTL4V1RDCqpdUiD1s768iJyRxC5Vt_5"], "files": []}, {"n": 310, "ts": "2026. 8. 31 오후 10:10:48", "name": "장효재", "church": "선한목자감리교회", "ours": true, "title": "하나, 둘, 셋, 썸너 가는 길", "place": "뉴질랜드 크라이스트처치 썸너", "when": "2026년 8월", "story": "신혼여행으로 16년 만에 다시 찾아간 뉴질랜드. 당시 집주인 로이든과 크리스를 만나러 가는 길에서 찍은 사진입니다. 로이든이 몇년 전 소천했다는 소식을 듣고 기도하고 돌아섰습니다. 그리고 다시 이 사진을 보며 로이든과 크리스와 함께 셋이 생활했던 그때가 세 척의 배와 연상되어졌습니다. 그리고 늘 함께 하시는 삼위일체 하나님의 동행하심을 생각해 봅니다.", "ids": ["1hIaNv6mQxgMQkaWjtVprNU1JR3mVhRS3"], "files": []}, {"n": 311, "ts": "2026. 8. 31 오후 10:15:01", "name": "맹자현", "church": "선한목자교회", "ours": true, "title": "말씀으로 다시 피어나다", "place": "안면도", "when": "2026년 3월 말", "story": "꽃이 피어나는 모습을 보며, 말씀을 통해 우리 안에 생명이 피어나는 모습과 닮아 있다고 생각했습니다.\n매년 같은 자리에서 새롭게 피어나는 벚꽃처럼, 하나님께서도 매일 우리에게 새로운 은혜를 부어주십니다.\n하지만 아름답게 피어난 꽃도 결국 지는 것처럼, 우리의 삶에도 때로는 꽃이 피기까지의 기다림과 연단의 과정이 있습니다.\n그 과정이 결코 헛되지 않은 것은, 말씀 안에서 견디고 자라난 우리의 삶을 통해 마침내 하나님께서 기뻐하시는 아름다운 열매와 꽃을 피우시기 때문입니다.", "ids": ["1ciQ76UoDoFJZbLfnOBErVsHJVCk5tiSv"], "files": []}, {"n": 312, "ts": "2026. 8. 31 오후 10:16:15", "name": "오준호", "church": "선한목자교회", "ours": true, "title": "다음세대와 함께하는 말씀함께", "place": "하늘꿈학교 3층 라운지", "when": "2026.08.30", "story": "아이들과 같은 본문으로 오늘의 말씀함께를 하면서 다음세대로 예수님의 사랑과 그 이야기를 이어나갑니다.", "ids": ["1rGJztR0ybeB8KCCoG4ODTyjiMJRfWBV7", "1OqhO7ZlYNBczqCsaASVINy7lTcVrw6YB", "1SA6ztFpNYA0SjY6mW-9eRImQpAK4er_6"], "files": []}, {"n": 313, "ts": "2026. 8. 31 오후 10:16:56", "name": "장효재", "church": "선한목자감리교회", "ours": true, "title": "함께", "place": "뉴질랜드 마운트쿡", "when": "2026년 8월", "story": "신혼여행으로 16년만에 찾아간 뉴질랜드, 아내와 함께 마운트 쿡에 오르며 하나님이 지으신 세계에 감탄했습니다. 찬양이 절로 나는 길이었습니다. 봄, 여름, 가을, 겨울이 함께하는 풍경과 말씀과 찬양과 기도와 교제가 함께 하는 길에 찍은 사진입니다.", "ids": ["1RbcWIOlcM7jRh_6pm2lx8_4XEPKLikDQ"], "files": []}, {"n": 314, "ts": "2026. 8. 31 오후 10:18:56", "name": "최혜원", "church": "선한목자교회", "ours": true, "title": "하나님이 만드신 세계", "place": "거제도 파노라마케이블카 정상", "when": "2026.08.14", "story": "자연의 풍경은 늘 하나님께서 살아계심을 깨닫게 합니다.", "ids": ["12VldIwUpsslJQhov7CCrYiGwrRm7NtH9"], "files": []}, {"n": 315, "ts": "2026. 8. 31 오후 10:21:18", "name": "맹자현", "church": "선한목자교회", "ours": true, "title": "돌아보니 하나님의 품이였다.", "place": "분당 어느 공원", "when": "26년 3월 말", "story": "수많은 꽃들 사이에 작은 새 한 마리가 머물러 있습니다.  \n그 모습을 보며, 우리가 하나님의 은혜 안에 살아가고 있다는 것을 생각했습니다.  \n레위기의 말씀은 하나님께서 우리와 함께 거하시며,\n그분의 백성으로 어떻게 살아가야 하는지를 가르쳐 줍니다.  \n거룩함은 우리의 힘으로 만들어내는 것이 아니라,\n하나님과 함께 머물며 그분의 말씀을 따라 살아가는 삶에서 시작되는 것이 아닐까 생각됩니다.", "ids": ["1Tiu0-6058GWAoXe0jNwM-f6Jt9-8e4Rl"], "files": []}, {"n": 316, "ts": "2026. 8. 31 오후 10:25:09", "name": "장효재", "church": "선한목자감리교회", "ours": true, "title": "그대랑", "place": "뉴질랜드 푸카키호수", "when": "2026년 8월", "story": "신혼여행으로 16년만에 찾아간 뉴질랜드. 호수와 산의 풍경에 가던 길을 멈추고 아내와 함께 한참을 바라봤습니다. 혼자였으면 스치듯 바라만 보고 지났을 풍경이었겠지만 함께였기에 가던 길을 멈추었습니다. 함께하는 길은 빠름도 느림도 낭비도 효율도 중요하지 않습니다. 예수님께서 우리에게 그리하셨습니다. 맑은 호수가 산과 함께 하여 그 빛을 그대로 담아 내듯이 함께 예수님의 빛을 담아내는 삶이길 원합니다.", "ids": ["1gUCjDiL-1D-HYLUiUuw1Pt9_C0-eElsH"], "files": []}, {"n": 317, "ts": "2026. 8. 31 오후 10:26:19", "name": "정혜민", "church": "젊은이교회", "ours": false, "title": "평화를 지키는 자들에게 평화를", "place": "제주 서귀포", "when": "2025년 12월 25일 ,2026년 7월 10일", "story": "예전의 저에게 바다는 여행이 주는 설렘의 장소였습니다.\n하지만 지금은 바다를 보면 가장 먼저 ‘해군’이 떠올라 마음 깊이 기도를 하게 됩니다.\n​예비신랑이 해군이고, 제주에 들를 때마다 만나는 이들이 해군의 가족들이기에 제 시선과 마음은 자연스레 그들이 누비는 바다로 향합니다. 오늘도 거친 바다 위에서 우리나라와 국민을 지키기 위해 자신을 희생하며 임무를 수행하는 해군 장병들. 그 과정이 결코 녹록지 않음을 알기에 헌신하는 그들의 모습이 참 멋지고 자랑스러우며 감사한 마음이 가득합니다.\n​이제 제게 바다는 단순한 풍경이 아닌, 성경 말씀과 함께 드리는 간절한 기도 제목이 되었습니다.\n​\"그들이 평온함으로 말미암아 기뻐하는 중에 여호와께서 그들이 바라는 항구로 인도하시는도다\" (시편 107편 30절)\n​언제나 위험이 도사리는 바다에서 임무를 다하는 장병들을 하나님께서 안전하게 보호해 주시고, 그들이 바라는 평안한 항구로 무사히 인도해 주시기를 기도합니다.\n​\"내가 새벽 날개를 치며 바다 끝에 가서 거주할지라도 거기서도 주의 손이 나를 인도하시며 주의 오른손이 나를 붙드시리이다\" (시편 139편 9-10절)\n​또한, 칠흑 같은 밤 먼 바다 한가운데에나  있을 때에도 어디서나 함께하시는 하나님을 깊이 경험하고, 그분의 붙드심 속에서 담대함을 얻기를 소망합니다.\n​설렘으로 바라보던 바다가 이제는 사랑과 헌신, 그리고 기도의 바다가 되었습니다.\n오늘도 바다를 지키는 모든 해군 장병들의 안녕과 평안을 마음 모아 기도합니다.", "ids": ["1Y2R7OMGLTUuck54rKLZhZczFHgN8mcX9", "1oxAqiCv5mY-jONTTR8fVA1tETz1oM0s9"], "files": []}, {"n": 318, "ts": "2026. 8. 31 오후 10:28:06", "name": "최혜원", "church": "선한목자교회", "ours": true, "title": "하나님이 지으신 세계2", "place": "일본 홋카이도 시레토코", "when": "2026.06.13", "story": "하나님이 지으신 자연을보며 하나님께서 살아계심을 느낍니다.", "ids": ["17J09YZMLx150FhgVy8YPmNYLyP7WyvCh"], "files": []}, {"n": 319, "ts": "2026. 8. 31 오후 10:28:07", "name": "박미혜", "church": "선한목자교회 다윗공동체", "ours": true, "title": "오늘, 말씀의 신호를 기다리다", "place": "호주 시드니", "when": "2022년 5월", "story": "매일 우리는 수많은 출발선 앞에 선다.\n어디로 가야 할지, 언제 움직여야 할지 스스로 결정하며 하루를 시작한다.\n\n그러나 이 사진 속 사람은 방향을 가리키고 있지 않다.\n그는 열차가 출발할 순간을 바라보며 신호를 기다리고 있다.\n\n말씀과 함께한다는 것은 어쩌면 그런 것인지도 모른다.\n내 뜻대로 서둘러 출발하는 것이 아니라, 오늘 내게 주시는 말씀을 바라보고 그 말씀 안에서 움직일 때를 기다리는 것.\n\n수많은 사람들이 오가는 평범한 역의 한순간처럼,\n말씀은 거창한 순간에만 우리와 함께하는 것이 아니라\n매일의 출발과 기다림, 그리고 다시 움직이는 순간마다 우리 곁에 있다.\n\n그래서 오늘도 나는 묻는다.\n“주님, 지금 저는 출발해도 될까요?”\n\n그리고 말씀을 바라보며 오늘의 첫걸음을 내딛는다.", "ids": ["1fjHQ4ABPIG2zECByEwD8ypNd-hlaJPWs"], "files": []}, {"n": 320, "ts": "2026. 8. 31 오후 10:36:29", "name": "최혜원", "church": "선한목자교회", "ours": true, "title": "세상에서 가장 안전한 길", "place": "일본 홋카이도 아사히다케 로프웨이", "when": "2026.06.11", "story": "아버지의 손을잡고 걸어가는 딸을 뒤에서보니, 나도 하나님의 손을 저렇게 잡고 가야겠다 생각이 들었습니다. 아무리 험한길이라도 아버지손을 잡고 걷는 길이 세상에서 가장 안전한 길이겠죠.", "ids": ["1Sd4NaIDrZm8kS6-_vD9JPSH3pec96RZj"], "files": []}, {"n": 321, "ts": "2026. 8. 31 오후 10:37:14", "name": "엄지", "church": "선한목자교회", "ours": true, "title": "일상에서 누리는 하나님 나라", "place": "선한목자교회 외", "when": "독일_2025년 선한목자교회 2025년, 문경 2024년", "story": "예배자의 마음으로 어느 곳에서나 말씀 함께를 하였기 때문입니다.", "ids": ["15yqUoK3U6rt5TcAKVUWwQYdTg56HNUv1", "1DC3jj1WBf7FvaXRYvmvWKJ82vWTZoiZe", "1zO7XraAdf2AMKNmabnROHU7m4-HV-ifo"], "files": []}, {"n": 322, "ts": "2026. 8. 31 오후 10:37:22", "name": "안성연", "church": "선한목자교회", "ours": true, "title": "잃어버린 한마리의 양", "place": "8월 뉴질랜드 신혼여행중 크롬웰 지역", "when": "2026년 8월", "story": "절벽에서 양의 울음소리가 나서 쳐다보니 무리에서 떨어져 혼자 방황하는 양한마리를 발견했습니다. 목초지가 없이 가파른 언덕을 몇걸음 내딛고 울고, 몇걸음 내딛고 울고.. 이땅에 하나님품을 떠나 홀로 울고 있는 양과 같은 존재들에게 말씀으로 채워진 우리가 예수님의 이름으로 도우며 양의 무리로 돌아오도록 돕는 예수님의 사람들로 세워지길 바라며 선정했습니다.", "ids": ["1lmDgXlBdzcNzsyBwHqwoJjaiA3UAgASS"], "files": []}, {"n": 323, "ts": "2026. 8. 31 오후 10:41:51", "name": "유하진", "church": "선한목자교회", "ours": true, "title": "말씀으로 새로워지는 아침", "place": "국내 계방산", "when": "2022년 겨울", "story": "차가운 겨울 속에서도 눈부시게 빛나는 설경처럼, 하나님의 말씀은 지치고 얼어붙은 마음을 새롭게 하며 다시 시작할 힘을 줍니다.", "ids": ["1OTZFXTcYswxIknc2ewNUr3GPcEPVx9ng"], "files": []}, {"n": 324, "ts": "2026. 8. 31 오후 10:43:55", "name": "유하진", "church": "선한목자교회", "ours": true, "title": "끝까지 말씀을 붙들고", "place": "수내역 육교아래", "when": "2018년 11월", "story": "계절이 깊어지며 대부분의 잎이 떨어졌지만, 몇 장의 붉은 잎은 가느다란 줄기에 남아 있습니다. 모든 것이 변하고 사라지는 때에도 하나님의 말씀은 영원하며, 그 말씀을 붙드는 믿음은 우리를 끝까지 견디게 합니다. 거친 벽을 따라 묵묵히 뻗어 가는 담쟁이처럼, 오늘도 말씀을 붙들고 주어진 삶의 자리에서 믿음으로 살아갑니다.", "ids": ["1DWkVuKF9-YvTJ-E9lyuwBGQ2tp7U9nKj"], "files": []}, {"n": 325, "ts": "2026. 8. 31 오후 10:45:43", "name": "안성연", "church": "선한목자교회", "ours": true, "title": "시선이 머무르는 곳", "place": "뉴질랜드 오마라마 지역", "when": "2026년 8월", "story": "길을 지나가는데 양의 무리가 동시에 우리를 쳐다보았습니다. 길이 끝날때까지 시선이 우리를 떠나지 않았습니다. 우리의 삶도 예수님만 바라보며 시선을 고정 할 수도, 내가 염려하고 두려워하는것에 시선을 고정 할 수도 있습니다. 매일의 말씀을 통해 주님께 시선을 고정하며 사는 우리네 인생되길 바라며 사진을 선정했습니다.", "ids": ["1gVf_5EYDd4JIpP-1Lt49Ad3_lAvRysXW"], "files": []}, {"n": 326, "ts": "2026. 8. 31 오후 10:46:39", "name": "박미혜", "church": "선한목자교회 다윗공동체", "ours": true, "title": "오늘도 말씀과 함께 자라요", "place": "치앙마이", "when": "2020년 여름", "story": "푸른 식물과 나무가 어우러진 아늑한 공간은 하나님께서 주신 창조 세계 속에서 말씀을 묵상하는 오늘의 삶을 상징합니다. 둥근 테이블과 의자는 공동체가 함께 모여 말씀을 나누는 자리를 떠올리게 하고, 그 위에 놓인 색연필은 어린이와 다음세대가 말씀을 통해 배우고 꿈을 그려가는 모습을 담고 있습니다. 따뜻하고 자연스러운 분위기는 오늘 하루가 말씀 안에서 특별하고 은혜로운 시간임을 보여주며, 작은 일상 속에서도 말씀과 함께 살아가는 오늘을 시각적으로 표현합니다.\n\n즉, 이 사진은 단순한 풍경이 아니라 “오늘, 말씀과 함께 살아가는 삶”를 담아낸 장면으로, 다음세대와 공동체 모두에게 희망과 은혜를 전합니다.", "ids": ["1yJjhshLjshuVp9aaQl42towyNGgxVMcx"], "files": []}, {"n": 327, "ts": "2026. 8. 31 오후 10:46:48", "name": "원희상", "church": "선한목자교회", "ours": true, "title": "One way", "place": "거제도 파노라마 케이블카 정상", "when": "2026.08.14", "story": "산정상으로 가는 하나의 길이 꼭 하나님께 가는 그 하나의 길 처럼 보였습니다. \n그리고 하나님께서 만드신 자연은 언제나 경이롭고 참 아름답습니다.", "ids": ["1Ez41SShDJUnHbFlZUWBKdzJZazLw2dnQ"], "files": []}, {"n": 328, "ts": "2026. 8. 31 오후 10:48:15", "name": "유하진", "church": "선한목자교회", "ours": true, "title": "말씀 안에서 함께 걷는 오늘", "place": "스페인 신혼여행중", "when": "2024년 11월", "story": "거센 파도가 밀려오는 바다에서도 두 사람은 서로를 의지하고 자유와 기쁨을 나눕니다. 우리의 삶에도 예기치 않은 파도가 찾아오지만, 말씀은 두려움과 염려에서 벗어나 참된 자유를 누리게 하며 흔들리는 순간마다 중심을 잡아 줍니다. 말씀과 이웃이 함께할 때 우리는 얽매임을 내려놓고, 오늘의 파도 속에서도 자유롭게 기쁨과 소망을 품고 걸어갈 수 있습니다.", "ids": ["1IJfe44lAaOp9XVIdAYA2qeDgnD2SF_HE"], "files": []}, {"n": 329, "ts": "2026. 8. 31 오후 10:51:57", "name": "원희상", "church": "선한목자교회", "ours": true, "title": "한 영혼", "place": "일본 홋카이도 비에이", "when": "2026.06.10", "story": "아마도 일본여행을 다녀본 분들은 이 사진을 보고 바로 일본과 그 지역을 떠올릴것같습니다. 사진을 보면서 일본땅을 기억하고 함께 기도하길 소망합니다.", "ids": ["13LpSpBWYQiA3s5JtfTUT8vxQJ7xaMhyB"], "files": []}, {"n": 330, "ts": "2026. 8. 31 오후 10:56:11", "name": "안성연", "church": "선한목자교회", "ours": true, "title": "Good shepherd church", "place": "뉴질랜드 데카포 선한목자교회", "when": "2026년 8월", "story": "1935년 지어진  뉴질랜드 최초의 교회 선한목자교회를 발견했습니다. 문화유산으로 현재는 많은 관광객도 들리는 곳이 되었는데 믿는 자든 믿지 않는자든 교회를 방문하고 사진을 찍는 모습을 보며, 말씀에 굳건히 세워진 우리가 세상에서 많은 사람들이(믿는자와의 교제에만 국한된것이 아니라) 마음을 열고 예수안에 위로받고 힘얻는 성전이 되기위해 먼저는 말씀이 충만히 채워져야 하는 우리가 되길 바라며 사진을 선정했습니다.", "ids": ["17y_FHVhDpeEbSA8hg1MyDyBHR1qKS78Y"], "files": []}, {"n": 331, "ts": "2026. 8. 31 오후 10:58:02", "name": "최아영", "church": "선한목자 젊은이교회", "ours": true, "title": "다시, 일상으로", "place": "강원도 평창", "when": "2025년 7월", "story": "강원도 평창에서 2박 3일 동안 아이들과 함께한 첫 선교를 마치고, 교회를 나와 집으로 돌아가기 전 바라본 풍경입니다. 아이들을 섬기기 위해 교사로 참여했지만, 함께하는 시간 속에서 아이들의 순수한 마음과 모습을 통해 오히려 제가 더 많이 배우고 성장하는 시간이었습니다. 선교의 시간은 끝났지만 그곳에서 받은 은혜와 말씀은 끝나는 것이 아니라, 다시 돌아갈 일상 속에서도 이어져야 한다는 생각이 들었습니다. 말씀과 함께한 시간들을 마음에 품고 그 말씀을 따라 다시 오늘을 살아가고 싶다는 마음을 담은 사진입니다.", "ids": ["13ml6-7qV6KA179750qvOgFw7Y-j5zCTX"], "files": []}, {"n": 332, "ts": "2026. 8. 31 오후 11:00:51", "name": "원희상", "church": "선한목자교회", "ours": true, "title": "한 영혼2", "place": "일본 홋카이도 비에이 청의호수", "when": "2026.06.10", "story": "일본의 유명한 관광지라 사진을 보면 일본을 떠올리는 분들이 많으실거 같습니다. 하나님께서 창조하신 아름다운 자연을 보며 감탄함과 동시에 그 땅의 영혼들을 사랑하심을 느낍니다. 함께 일본을 위해 기도하길 소망합니다.", "ids": ["1Tb9gN1Yl5UMCSwZMPLX84HlgW6uD20cY"], "files": []}, {"n": 333, "ts": "2026. 8. 31 오후 11:01:53", "name": "신연형", "church": "선한목자교회", "ours": true, "title": "하나님의 솜씨", "place": "몰디브", "when": "2026년 2월", "story": "말씀으로 천지를 창조하셨고, 하나님의 창조의 솜씨를 마음껏 느끼며 감상할 수 있는 시간이었습니다.", "ids": ["1V7c6BzhxWgD2yuxoAqAkitAIJfIrA_2G", "1V3ktsxSLVW7m4-514HN0fU1gPdX0GEzJ", "1EPSnC9uTgS_uXrJ2SwKaMBwQbJm3JT0J"], "files": []}, {"n": 334, "ts": "2026. 8. 31 오후 11:08:37", "name": "이성주", "church": "선한목자젊은이교회", "ours": true, "title": "주님의 집", "place": "경복궁 향원정", "when": "2025년 11월", "story": "향원정이 마치 나무 아래에 있는 것과 같이 있어, 주님의 보호하심과 매일 주시는 말씀으로 말미암아 안전한 주님의 집이 연상됩니다.", "ids": ["1IQSqyv7V4K_dohsaqTjHQvcqaErVEDl2"], "files": []}, {"n": 335, "ts": "2026. 8. 31 오후 11:17:30", "name": "이은성", "church": "선한목자감리교회", "ours": true, "title": "주님이 모든 것을 아름답게 지으셨도다", "place": "인도 다즐링", "when": "2025.07.24.", "story": "하루가 저물어가는 야경과 함께 주님이 모든 것을 때에 따라 아름답게 지으셨음을 느낄 수 있는 한 폭의 사진입니다^^", "ids": ["1C0GMVsOWThx4BFoiKRDUNIGNHaCX-DHZ"], "files": []}, {"n": 336, "ts": "2026. 8. 31 오후 11:22:47", "name": "윤서진", "church": "참좋은교회(광명)", "ours": false, "title": "1-2. 쉼과 평안, 3. 구름", "place": "양화한강공원, 올림픽대로", "when": "2025년 4월 30일, 2024년 10월 3일", "story": "나무 그늘 아래에서 여유롭게 쉼을 누리듯, 말씀 안에서 세상이 줄 수 없는 참된 평안과 안식을 느낀 것 같다고 생각이 들었습니다.\n\n높이 솟은 남산타워와 뒤에 있는 뭉개뭉개한 구름을 보며, 하나님께서 창소하신 이 세상이 어찌 아름다운지. 푸르고 선명한 가을 하늘을 바라보며 감사의 마음을 되새긴 하루였습니다.", "ids": ["12aneLkBcYKtGqAILwCr061QwQQdR9YSH", "1YWdZ_lBfNB22jlGAMEDOBYj-KPXxfZe2", "1l2NeCOEI_982To7cuovhjzt_FQ0Cz8Yh"], "files": []}, {"n": 337, "ts": "2026. 8. 31 오후 11:24:13", "name": "박병각", "church": "선한목자교회", "ours": true, "title": "참빛을 지키기 위해 세상의 빛을 포기한 사람들의 교회", "place": "데린쿠유(Derinkuyu Underground City)는 튀르키예 카파도키아 지역에 있는 거대한 지하도시입니다.", "when": "2026년 5월 7일", "story": "5월 7일, 버스 안에서 딤전 1:12-16 말씀을 묵상한 후 방문한 데린쿠유 지하교회. 열악한 환경 속에서도 감사함으로 예배를 드렸던 믿음의 선배들을 생각하며 담은 사진이다. 참빛을 지키기 위해 세상의 빛을 포기하고, 주님의 말씀대로 살기 위해 고난도 기꺼이 감수했던 그들의 믿음을 기억하고자 이 사진을 출품합니다", "ids": ["1U5dPpy2wgQwlLMRS3MbQMnXOxVIEHq1V", "1tDfhNUerpmcpL4RQG4Fr9-c9pKAnKISI", "1VS0_O4DwCxVSIyeGHAIKd1f-GEq_er90", "1HT2Rs9W0LQoe-FwLtuFdOaGJ6CiwU_l7"], "files": []}, {"n": 338, "ts": "2026. 8. 31 오후 11:32:59", "name": "이은성", "church": "선한목자감리교회", "ours": true, "title": "평강의 폭삭임", "place": "벤쿠버", "when": "2024.01.17.", "story": "눈은 차갑지만 차분함을 준다. 강렬한 에너지를 담기 보다 고요한 편안함을 선사한다. 12월의 묵상이 그러하면 좋겠다. 한해를 마무리하며 주님이 주시는 평강과 차분함 속에 매듭짓기를 바란다.", "ids": ["17ilteSdjVYyOo0ZnH-WFfyajb89qsdD_"], "files": []}, {"n": 339, "ts": "2026. 8. 31 오후 11:38:03", "name": "양건", "church": "선한목자교회", "ours": true, "title": "하늘의 시선으로 비로소 마주하게 된, 삶의 길목마다 이미 서 있던 십자가.", "place": "서울, 부산", "when": "2019년 8월 / 2020년 5월", "story": "우리는 매일 길을 걷고 차로 다리를 건너며 횡단보도를 통해 목적지로 이동합니다. 하지만 우리의 시선이 늘 땅에 있을 때, 정작 우리 곁에 있는 십자가의 존재를 깨닫지 못하고 무심코 지나치곤 합니다. \n\n드론을 통해 하늘의 시선으로 내려다본 우리의 삶터에는 이미 선명한 십자가의 길이 나 있었습니다. 요한복음 14장 6절의 \"내가 곧 길이요..\"라는 말씀처럼, 십자가는 그저 추상적인 상징이 아니라 우리가 날마다 딛고 서 있는 삶의 터전 그 자체입니다.\n\n수년 전, 들판 위에서 드론으로 길을 촬영한 적이 있습니다. 이후 사진을 정리하다 문득 그 길이 십자가에 달리신 예수님께서 창에 찔려 피를 흘리시는 형상처럼 다가왔습니다. (첫번째 들판 사진) 그 이후로도 일상 속에서 십자가 형상을 발견하면 사진으로 담아오고 있습니다. 도시를 잇는 대교, 수많은 이들이 바쁘게 오가는 횡단보도, 그리고 작은 골목길까지. 십자가는 언제나 삶의 교차점에서 길을 터주고 있으며, 우리는 오늘도 그 은혜의 십자가 길을 지나고 있음을 묵상해 봅니다.", "ids": ["1Ph985wtpWeJ8DdabE97qGy8xwUeSjl2V", "12peYDvCn2F6radwtmRNm6tQ_xVU4pc1q", "1_ZnFJwB6XCsOQx5MLxzO8NNdLD7tKERx"], "files": []}, {"n": 340, "ts": "2026. 8. 31 오후 11:43:07", "name": "김성혜", "church": "선한목자교회", "ours": true, "title": "그 어디나 하늘나라", "place": "중국", "when": "2025년 9월", "story": "조중 접경지역 비전트립을 하면서 관심없고 심지어 부정적인 감정이 드는 중국의 땅, 나라, 영혼.. 하나님이 지으셨으며 온 땅을 사랑하시는 하나님을 경험하는 시간이었습니다.", "ids": ["1eq0ax8V60TrYmM_e7bYSNnchzhN3WKQ7", "1eUKIKq7Z9m-0pyGK84_GtcQUVtZWdNS2", "1SkeZWcWTcBaOjvvRUfheaQSnXdnVq1Dy"], "files": []}, {"n": 341, "ts": "2026. 8. 31 오후 11:43:41", "name": "이은성", "church": "선한목자감리교회", "ours": true, "title": "아펜젤러의 숭고한 뜻", "place": "아펜젤러 기념관", "when": "2024.4.17.", "story": "아펜젤러 선교사님의 숭고한 뜻은 여전히 계승되고 있습니다.", "ids": ["1B1_ZIrQNOefkHd88WWrzsDftKdutQke5"], "files": []}, {"n": 342, "ts": "2026. 8. 31 오후 11:46:34", "name": "박은진", "church": "선한목자교회", "ours": true, "title": "성령의 열매를 품고", "place": "집", "when": "2018년 봄", "story": "성령의 열매들을 묵상하며 초등부 아이들과 함께 기른 성령의 열매.", "ids": ["1ujSGkVsY5BIz6czZUU0NYX-wHPPPZu-S"], "files": []}, {"n": 343, "ts": "2026. 8. 31 오후 11:52:24", "name": "임수라", "church": "선한목자교회", "ours": true, "title": "지은신 그대로", "place": "케냐 사파리(Tsavo east national park)", "when": "22026.07,23", "story": "하나님께서 지은신 광활한 자연과 야생의 동물들을 보며 '있어야 할 곳에 있는 것이 가장 멋지다'라는 깨달음과 함께 내가 있어야할 곳은 어디인지 묻게 되어", "ids": ["159RPev2JSuhxi2eOHFQ5sUT1SLLxh03V"], "files": []}, {"n": 344, "ts": "2026. 8. 31 오후 11:53:30", "name": "윤시온", "church": "참좋은교회(광명)", "ours": false, "title": "쉼", "place": "양평두물머리", "when": "2026.05.10", "story": "이 사진은 바쁜 일상 속에서 마주한 여유 의 순간을 담았다. 오후의 자연을 바라보 면서 하나님이 만드신 세계 안에서 누리 는 평안함이 이런 것이구나 느낄 수 있었 다. 바쁘고 조급하게 살아왔던 삶에서 잠 시 벗어나 하나님이 만드신 자연을 바라 보며 편히 쉬고, 내가 이 순간 평안을 누 릴 수 있음에 감사한 마음이 들었기 때문 에 '말씀과 함께한 오늘'과 연결된다고 생각한다.", "ids": ["1io6KaEgQ9jofFgyfeKX2oEIC1hvSeo2x", "1a8SIoopMhQFiYSxd-S9AkfJ18EO2Fx98"], "files": []}, {"n": 345, "ts": "2026. 8. 31 오후 11:54:04", "name": "최아영", "church": "선한목자 젊은이교회", "ours": true, "title": "피어나는 마음", "place": "용산가족공원", "when": "2026년 5월", "story": "\"하나님이 지으신 모든 것이 선하시매 감사함으로 받으면 버릴 것이 없나니\" - 디모데전서 4:4\n\n친구들과 함께 용산가족공원을 찾았던 날, 유난히 맑고 따뜻했던 날씨와 곳곳에 피어난 꽃을 보며 하나님께서 우리에게 이렇게 아름다운 자연을 주셨다는 것이 감사했습니다. 평범하게 친구들과 시간을 보내는 순간이었지만, 그 아름다운 풍경을 바라보며 함께 있는 친구들이 참 소중하다는 마음도 다시금 느끼게 되었습니다. 하나님께서 주신 아름다운 하루를 누리며, 내가 사랑하는 사람들도 하나님의 사랑을 알게 되기를 바라게 된 날을 담았습니다.", "ids": ["1Arnku2EhKGoC5ktspF76G0nJyF_5416Z"], "files": []}, {"n": 346, "ts": "2026. 8. 31 오후 11:56:38", "name": "이재하", "church": "선한목자교회", "ours": true, "title": "파도", "place": "강원도 고성 아야진해변", "when": "2026년 5월", "story": "주일 예배를 마치고 바다를 보러 갔습니다. 오랜만에 5명 가족이 모여서 파도치는 것을 보고 바다에서 놀아서 행복하고 감사했습니다.", "ids": ["1ZTczQhhlT6HrBFRyD8Lj_VcRTSJ6mhqx"], "files": []}, {"n": 347, "ts": "2026. 8. 31 오후 11:56:45", "name": "김주화", "church": "선한목자교회", "ours": true, "title": "하늘에 그리시는 은혜", "place": "독일 베를린", "when": "2026/8/21", "story": "인간이 깎아 세운 웅장한 돌기둥도, 지붕 위의 찬란한 조각상도 멈춰 있는 성취일 뿐입니다.\n​그 function card(e){
  const main=e.ids[0];
  const ph=main?`<img loading="lazy" referrerpolicy="no-referrer" data-src="${main}" data-w="900" src="${th(main,900)}" alt="${esc(e.title)}" onerror="nx(this)">`:`<div class="err">링크 없이 파일명만 제출됨</div>`;
  const thumbs=e.ids.length>1?`<div class="thumbs">${e.ids.map((id,i)=>`<img loading="lazy" referrerpolicy="no-referrer" class="${i?'':'on'}" data-id="${id}" data-src="${id}" data-w="160" src="${th(id,160)}" alt="" onerror="nx(this)">`).join('')}</div>`:'';
  const links=e.ids.map((id,i)=>`<a href="${op(id)}" target="_blank" rel="noopener">원본 ${e.ids.length>1?i+1:'열기'}</a>`).join('');
  const files=e.files.length?`<div class="files">파일명: ${esc(e.files.join(', '))}</div>`:'';
  return `<article class="card" data-n="${e.n}"><div class="ph"><span class="no">#${e.n}</span>${ph}<button class="star ${picks.has(e.n)?'on':''}" title="후보 표시">★</button></div>${thumbs}
  <div class="body"><div class="t">${esc(e.title||'(제목 없음)')}</div>
  <div class="m"><b>${esc(e.name)}</b> · ${esc(e.church)}${e.ours?'':'<span class="ext">다른 교회</span>'}</div>
  <div class="m">${esc(e.place)}${e.when?' · '+esc(e.when):''}</div>
  ${e.story?`<div class="st">${esc(e.story)}</div><button class="more">더 보기</button>`:''}
  <div class="links">${links}</div>${files}</div></article>`;
}
function render(){
  const q=Q.trim().toLowerCase();
  const list=E.filter(e=>{
    if(F==='ours'&&!e.ours)return false; if(F==='ext'&&e.ours)return false; if(F==='pick'&&!picks.has(e.n))return false;
    if(!q)return true; return (e.title+' '+e.name+' '+e.place+' '+e.story+' '+e.church).toLowerCase().includes(q);
  });
  document.getElementById('grid').innerHTML=list.map(card).join('');
  document.getElementById('empty').hidden=list.length>0;
  document.getElementById('cnt').textContent=`${list.length}건`;
}
function upd(){document.getElementById('pc').textContent=`후보 ${picks.size}`}
function pickText(){return E.filter(e=>picks.has(e.n)).map(e=>`#${e.n} ${e.title} — ${e.name} (${e.church})${e.ids[0]?' '+op(e.ids[0]):''}`).join('\n')}
document.getElementById('q').addEventListener('input',ev=>{Q=ev.target.value;render()});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;render()}));
document.getElementById('grid').addEventListener('click',ev=>{
  const c=ev.target.closest('.card'); if(!c)return; const n=+c.dataset.n;
  if(ev.target.classList.contains('star')){picks.has(n)?picks.delete(n):picks.add(n);ev.target.classList.toggle('on');save();if(F==='pick')render();}
  else if(ev.target.classList.contains('more')){const s=c.querySelector('.st');s.classList.toggle('open');ev.target.textContent=s.classList.contains('open')?'접기':'더 보기'}
  else if(ev.target.dataset.id){const big=c.querySelector('.ph img');if(big){big.dataset.k=0;big.dataset.src=ev.target.dataset.id;big.src=th(ev.target.dataset.id,900);}c.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('on',x===ev.target))}
});
document.getElementById('copy').addEventListener('click',async()=>{const t=pickText();try{await navigator.clipboard.writeText(t);alert('후보 목록을 복사했어요')}catch(e){prompt('아래 내용을 복사하세요',t)}});
document.getElementById('dl').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pickText()],{type:'text/plain'}));a.download='표지사진_후보목록.txt';a.click()});
upd();render();
</script></body></html>
