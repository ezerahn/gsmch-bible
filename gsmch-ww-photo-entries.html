 주시는 하나님의 사랑과 인도하심을 표현했습니다.\n\n오늘이 비록 깊은 물속을 걷는 것처럼 막막하게 느껴질지라도, 말씀을 통해 다시 빛을 바라보고 한 걸음 나아갈 수 있다는 소망을 담았습니다.\n\n“내가 비록 어둠 속에 앉을지라도 여호와께서 나의 빛이 되실 것임이로다.”\n— 미가 7:8", "ids": ["1zqNAiQf5LcNcVeQUFfZs_lyWUWUWcJWc"], "files": []}, {"n": 6, "ts": "2026. 8. 25 오후 12:45:54", "name": "곽우주", "church": "사랑의교회", "ours": false, "title": "A Flower of Life", "place": "화실 작업실", "when": "2026년 8월", "story": "A Flower of Life-《생명의 꽃》은 좁은 길을 지나 마침내 마주하게 된 생명과 참된 기쁨을 이야기합니다.\n\n우리는 때로 소망과 행복을 아주 먼 곳에서 찾아야 한다고 생각하며 끊임없이 앞으로 나아갑니다. 그러나 말씀을 통해 돌아보면, 그토록 찾아 헤매던 사랑과 은혜는 멀리 있는 것이 아니라 이미 우리의 삶 가까이에 머물러 있었음을 발견하게 됩니다.\n\n어두운 숲속을 지나 마주한 커다란 생명의 꽃과 그 앞에 선 작은 존재들을 통해, 힘겨운 여정 끝에 비로소 깨닫게 되는 하나님의 사랑과 은혜, 그리고 그 안에서 발견하는 참된 기쁨을 표현했습니다.\n\n“여호와께서는 자기에게 간구하는 모든 자 곧 진실하게 간구하는 모든 자에게 가까이 하시는도다.”\n— 시편 145:18", "ids": ["1uDcsBgYPTogPnMHav5KQGZPDRR_74NEV"], "files": []}, {"n": 7, "ts": "2026. 8. 22 오후 2:45:04", "name": "고태운", "church": "새로운교회", "ours": false, "title": "주의 길을 예비하는 자", "place": "서울특별시 신길6동", "when": "2026년 8월 15일", "story": "부르심의 확신을 기다리며 \n낙심하는 마음 가운데 있을 때\n\n배우자와 함께 밥 먹으러 가는 길에\n이 구름 풍경을 보게 되었습니다\n\n옆에 있던 배우자가 하는 말이\n“우와! 왕관을 쓴 왕 같아요!”\n\n그 말을 듣고 마음 속에 \n말씀 한 구절이 떠올랐습니다\n\n[사62:3] 너는 또 여호와의 손의 아름다운 관, 네 하나님의 손의 왕관이 될 것이라\n\n하나님께서 나를 부르신 것이라면\n확실하게 내게 응답해주실 것이라고\n\n기대하는 마음이 있었습니다\n\n그런데 지금까지 나는 \n내가 생각한 방식으로 내가 생각한 때에\n응답해주시기를 바라고 있었다는 생각이 듭니다\n\n나는 기도응답에 있어서\n눈에 보여지는 부분을 기대했습니다\n\n그러나 하나님께서는\n\n일상을 통해\n부르심의 증거를 보여주셨다는 생각이 듭니다\n\n매일 매일의 일상을 \n하나님과 깊이 동행하며 살아갈 때\n\n일상의 증거들을 통해서\n\n하나님께서 창세 이전에 나를 창조하신\n그 목적의 부르심을 깨달아 사는 삶을\n살게 하신다고 생각이 듭니다\n\n이 땅에서 하나님 자녀의 삶의 모습은\n\n누군가를 닮아가거나 만들어지는 삶이 아니라\n\n이미 하나님의 형상대로 창조 되어진\n우리 본연의 모습을 되찾고 \n다듬어가는 과정이라고 생각합니다\n\n무너진 예루살렘이 복원되는 모습처럼\n\n죄로 인해 무너졌던 우리들이\n오직 하나님의 은혜로 그 정체성을 되찾고\n\n화관을 쓴 아름다운 신부의 모습처럼 살아가는 것\n\n그것이 하나님께서 바라시는 우리의 모습이라고\n생각합니다", "ids": ["1ZXwf_HiBM4P-W7uU7chxbGocybnZpSiK", "1b48d3Go6KBpJWZX1MJLFu4VVP8LIu49P", "1dRT6bTK7zuVMPZsrVJIZJ9b4iU3S6OF1"], "files": []}, {"n": 8, "ts": "2026. 8. 24 오후 4:38:45", "name": "이기성", "church": "선한 목자교회", "ours": true, "title": "공동체", "place": "김포", "when": "2025년 10월", "story": "둥근잎 중앙으로 작은 빗방울이 모여 땅으로 흘려보내는 모습이 하늘로 부터 받은 은혜를 또 다른 곳으로 흘려보내는 모습이 마치 우리가 속한 공동체 같다는 생각이 들었습니다.", "ids": ["1xthSaSmi4NhbqeHB_aq0cbMLRFegQRBC"], "files": []}, {"n": 9, "ts": "2026. 7. 28 오후 6:00:45", "name": "남지영", "church": "선한목자 교회 송파 교구", "ours": true, "title": "하나님이 지으신 세계", "place": "내몽골", "when": "2025년 8월", "story": "작금의 세계는 전쟁으로 인해서 하나님의 아름다운 창조세계가 파괴되고 있습니다.작년 여름에 카메라에 담았는데 참 아름다워라 주님의 세계는~~ 찬양이 절로 불리어 집니다.인간이 서로 사랑하고 공감하며 하나님의 축복인 인류의 자연환경를 잘 보존했으면 좋겠습니다", "ids": ["1p5MRaM_LwZQFNyi_Ck_rL0Yo_bF5rhbd"], "files": []}, {"n": 10, "ts": "2026. 8. 10 오전 12:31:48", "name": "임성일", "church": "선한목자 젊은이교회", "ours": true, "title": "말씀함께 3대", "place": "2대의 집(강승택 권사, 임지아 집사(선한목자교회)의 집)", "when": "2026. 8. 9.", "story": "선한목자교회에 출석하는 3대가 함께 모여 3대(강민호, 10세)의 묵상 내용을 듣는 모습.\n말씀과 함께 또 말씀함께와 함께한 오늘이었습니다.", "ids": ["1bxImGRJSx0mqo5mijz2XRzglhU8PzalR"], "files": []}, {"n": 11, "ts": "2026. 8. 12 오후 11:39:42", "name": "박지아", "church": "선한목자 젊은이교회", "ours": true, "title": "예수님 안의 우리", "place": "히스토리교회 여름캠프", "when": "2026.8.2", "story": "히스토리교회 어린이캠프 마지막 날, 전체팀장인 저와 전도사님이 릴레이기도를 위해 기도팔찌를 함께 찼습니다.\n\n그동안의 준비기간과 어린이캠프 가운데 행하신 하나님께 감사드리며, 케미스토리팀과 히스토리교회 아이들이 함께 그린 그림을 배경으로 케미스토리팀의 시그니처 포즈 ‘C’를 담아, 말씀과 기도 안에서 하나 된 우리, 예수님 안에 있는 우리를 표현했습니다.\n\n어린이캠프를 통해 참여한 우리 모두가 하나님을 만나고, 예수님 안에서 하나 됨을 누렸던 소중한 시간을 나누고 싶습니다.", "ids": ["1uAPRR0qCI2qMmAQjXlQF1c9md-XBFbCo"], "files": []}, {"n": 12, "ts": "2026. 8. 13 오전 12:00:02", "name": "박지아", "church": "선한목자 젊은이교회", "ours": true, "title": "눈을 들어 하늘을 보라!", "place": "영장산", "when": "2026.6.6", "story": "토요일 오전, 영장산을 산책하다 벤치에 앉아 잠시 쉼을 가졌습니다. 그때 올려다본 하늘은 나무 사이로 하트 모양처럼 펼쳐져 있었습니다.\n\n그 순간, “눈을 들어 산을 보라”는 말씀이 떠올랐고, 하나님께서 언제 어디서나 나와 함께하시는 분임을 작은 순간을 통해 위로와 은혜를 누렸던 시간이었습니다.\n\n바쁜 일상 속에서도 눈을 들어 하나님을 바라볼 때, 언제나 나와 함께하시는 주님을 발견할 수 있음을 나누고 싶습니다.", "ids": ["1Z07_XtP3XirCrEe9yQQg23dpuoVop9rw"], "files": []}, {"n": 13, "ts": "2026. 7. 26 오후 1:07:43", "name": "김예인", "church": "선한목자감리교회", "ours": true, "title": "마음 속 깊은 이야기", "place": "강현면 바다", "when": "2025년11월29일 겨울", "story": "이날은 엄마와 함께 바다에 가서 차박을 한 날이였는데\n차안에서 해가 지는 모습을 보면서 엄마와 둘이 \n신앙과 하나님에 대화를 의미있고 마음깊이 이야기를 나누었습니다 하나님은 왜 시련을 주시는지 하나님을 원망해본적, 지금 겪고있는 시련과 앞으로의 미래 등 을 \n많이 얘기하면서 그날 이후로 하나님과 정말 더 가까워진것 같았습니다. 이 날은 제가 하나님를 다시 알고 다시알고 신앙적으로 더 성장한 날이면서 말씀과 함께한 날이였습니다.", "ids": ["1XjbHOWWw5sCa9iBROlGmhG6Rh5DK03NB", "1anFSeTm_efZG-mDYlE_9V0inzyVBnmvn"], "files": []}, {"n": 14, "ts": "2026. 8. 2 오후 1:54:44", "name": "김희선", "church": "선한목자감리교회", "ours": true, "title": "수련회 간증문시간", "place": "인제미리내캠프 강당 예배당", "when": "2026년 8월", "story": "십자가의 사랑 수련회를끝내고 2박3일간 말씀과 함께한 순간에 대한 간증기록을 남기는 아이들의 모습이 주님이 보시기에도 사랑스러울것 같습니다.", "ids": ["10JUDhVrvcuOG88-JAEhZAxFIqIyZXiG1"], "files": []}, {"n": 15, "ts": "2026. 8. 9 오후 5:05:38", "name": "오수아", "church": "선한목자감리교회", "ours": true, "title": "소망으로 향하는 좁은 길", "place": "독일 로텐부르크오프데어타우버", "when": "2025년 6월", "story": "우리는 살아가면서 좁은 길을 걸어갑니다. 때로는 그 길이 너무나도 고난이며, 이게 정말 맞는 길인가 고민할 때가 많습니다. 당장 저 자신 또한 하루하루 살아가면서 울고, 절망하고, 좌절하는 날들이 있었지만. 사진 속 저 너머의 빛은 밝고 환합니다. 그러한 부분이 마치 오늘 나의 삶 같다고 느꼈습니다. 좁고 구불구불한 길이지만 결국 나의 좁은 길 너머는 소망이 있고, 생명이 있다! 그것이 이 사진의 의미입니다.", "ids": ["1mIzv0z0iAbZRKJFapbtJ1zHzHmoGQUwH"], "files": []}, {"n": 16, "ts": "2026. 7. 28 오전 10:28:06", "name": "엄자경", "church": "선한목자교회", "ours": true, "title": "매일아침루틴", "place": "뉴욕 센트럴파크", "when": "2025.10.28", "story": "아침마다 운동하듯이 내 영혼이 건강해지는 습관이 되어주기를 바라는 마음에서", "ids": [], "files": ["IMG_5403 - 엄자경.jpeg"]}, {"n": 17, "ts": "2026. 7. 28 오전 10:38:37", "name": "강영진", "church": "선한목자교회", "ours": true, "title": "주님과의 산책길", "place": "속초", "when": "2025.10.4", "story": "주님께서 지으신 자연에 둘러싸여 주님과의 행복한 동행", "ids": [], "files": ["IMG_7419 - 강영진.jpeg"]}, {"n": 18, "ts": "2026. 7. 28 오전 10:40:55", "name": "엄자경", "church": "선한목자교회", "ours": true, "title": "아름다운 벗꽃나무", "place": "올림픽대로 잠실부근", "when": "2025.04.09", "story": "하나님의 귀하고 아름다운 말씀을 귀하고 아름다운 벗꽃나무에 빗대어", "ids": [], "files": ["IMG_2082 - 엄자경.jpeg"]}, {"n": 19, "ts": "2026. 7. 28 오전 10:46:23", "name": "엄자경", "church": "선한목자교회", "ours": true, "title": "하나님의 작품", "place": "제주시 닭머르", "when": "2023.11.08", "story": "나와 모든 세상은 하나님의 작품인 것을 말씀을 통해 발견해 나가게 되기 때문입니다.", "ids": ["1MoXVCv_KgoqZu1OSrveZ8xNB3fX-q4eQ", "1IuX04x2fdLhff2uM-LoishHeRDFQsd7z", "1Z7gwj2avWZNP7ZiMU3caSsiSEMKS-Psa"], "files": []}, {"n": 20, "ts": "2026. 7. 28 오전 11:02:22", "name": "강영진", "church": "선한목자교회", "ours": true, "title": "마음의 등불", "place": "서초동 카페 이로", "when": "2025.02.16", "story": "말씀으로 마음의 등불을 켰음", "ids": ["110eMCv6THVNsmojokjDZCTRvBd_bNO4j"], "files": []}, {"n": 21, "ts": "2026. 7. 28 오전 11:07:33", "name": "강영진", "church": "선한목자교회", "ours": true, "title": "주님 안에서의 휴식", "place": "괌", "when": "2018.01.15", "story": "바다 같이 넓으신 주님 안에서의 달콤한 휴식", "ids": ["1XYoRh8zn7zhVjPF4V8d_FW0SErLOusO_"], "files": []}, {"n": 22, "ts": "2026. 7. 28 오전 11:55:54", "name": "강경언", "church": "선한목자교회", "ours": true, "title": "동틀녘", "place": "남해 섬에서 솔섬을 찍다", "when": "2025년 가을", "story": "창조주 하나님께서 주신 태양과 물은 축복의 선물", "ids": ["12iKrdVtR32lCKkjN_5T_3k0m-l2Z2g34", "1fOBx-ka_HF-SbNpwfUXObkC_qVjO-u6t", "1t4vDZZBadaVd0Kauk_OhdAiC1si0KsG4", "1hqR81_eChrT4N0JVC0U2Wvv_ebSHIVum"], "files": []}, {"n": 23, "ts": "2026. 7. 28 오후 1:14:34", "name": "엄자경", "church": "선한목자교회", "ours": true, "title": "하나님의 자녀", "place": "서울 소아청소년과 병원", "when": "2019.08.11", "story": "나와 아들의 손이 맞닿은 사진에서 내가 하나님의 손에 맞닿은 하나님의 자녀라는 느낌이 다가옵니다.", "ids": ["1lLxsL0XbnGf6Q0c0gsVF_rJKASawhJA7"], "files": []}, {"n": 24, "ts": "2026. 7. 28 오후 1:29:38", "name": "임중권", "church": "선한목자교회", "ours": true, "title": "예수님의 얼굴", "place": "서울 용산역 앞", "when": "2017.7.25", "story": "2017년 여름 장마가 끝난 어느 날, 지하철을 잘못 타 외부 통로로 나갔다가 다시 환승해야 했습니다. 속으로 투덜거리며 바쁘게 걸음을 옮기다 뭉게구름 사이로 햇빛이 새어 나오는, 너무도 경이적인 자연 현상이 눈에 들어왔습니다.\n틈틈이 사진을 찍으려고 가지고 다니던 디지털 카메라를 꺼냈습니다. 구름 사이로 멋지게 새어 나오는 빛들을 향해 이리저리 구도를 바꿔가며, 쓰고 있던 안경의 렌즈가 뿌옇게 되도록 한동안 정신없이 셔터를 눌렀습니다.\n그날 밤, 낮에 찍은 사진을 하나하나 열어보며 정리하다 문득 숨이 멎는 줄 알았습니다. 멋진 구름 사진가운데 예수님의 얼굴이 보인 것입니다. 면류관까지 쓰고 계신 예수님이 아래쪽을 측은하게 내려다보시는 모습이 너무도 뚜렷했습니다.\n하나님을 등지기도 하고, 선데이 크리스천으로 잘못 살아온 삶을 하나님 앞에 무릎 꿇고 회개하며, 창세기와 마태복음 첫 페이지만 열었다 닫았다를 반복하던 제가 성경 완독을 하고, 크리스천으로서 하지 말아야 할 것들을 하나씩 없애 가며 간절히 기도드렸습니다. 하지만 기도 응답을 알아채지 못하고 일상 가운데 기운이 빠지 기도했습니다. 그러던 중에 하나님은 눈앞에 살아 나타나셔서 앞으로 새롭게 살아갈 길을 알려주신 것입니다.\n마음과 정성을 다해 이 곳에 심어 주시고, 신묘막측한 인생 지도를 보여주시며 응답해 주심에 아버지 하나님께 감사드립니다. 내가 죽고 바른 크리스천으로 하루하루 살아가기에 너무도 나약한 저에게 다시금 갈 길에 대한 확신을 주심에 하나님께 감사드렸던 저를 살려주신 사진입니다.", "ids": ["1KyS4cWlA9eMcn2Yf7p5VyomoxODe11Q3"], "files": []}, {"n": 25, "ts": "2026. 7. 28 오후 1:36:39", "name": "임중권", "church": "선한목자교회", "ours": true, "title": "동반자", "place": "경기도 일산 동구 카프성모병원 뒤", "when": "2020.03.24", "story": "할아버지의 팔을 의지하며 다정하게 걷는 노부부의 뒷모습에서 우리도 예수님의 오른 팔을 의지하며 죽는 날까지 예수님과 동행하는 자 되길 기도합니다.", "ids": ["1IApWyDiycaM67rdaChpxgkcbcB8F7pmA"], "files": []}, {"n": 26, "ts": "2026. 7. 28 오후 2:04:39", "name": "임중권", "church": "선한목자교회", "ours": true, "title": "하늘로 가는 길", "place": "서울 선유도공원 선유교", "when": "2017.12.21", "story": "우리의 길은 좁고 긴 다리와 같은 길.", "ids": ["1WDgOf595FhrqDrP_J9W_8Jhv06Cc9v7r"], "files": []}, {"n": 27, "ts": "2026. 7. 28 오후 2:39:55", "name": "조경진", "church": "선한목자교회", "ours": true, "title": "하나님의 약속", "place": "속초", "when": "23년 12월 10일", "story": "힘들고 지칠 때마다 하나님의 약속 하나만 붙들고 오늘을 살아냅니다.", "ids": ["1S13UV5DrUM6dnRZqKoUn3XNcnRnu-OV4"], "files": []}, {"n": 28, "ts": "2026. 7. 28 오후 4:39:33", "name": "정한나", "church": "선한목자교회", "ours": true, "title": "한 줄기 빛, 한 송이 은혜", "place": "길가", "when": "2026년 여름", "story": "길을 지나가다 문득 멈춰서 찍은 한 줄기 빛과 노란 꽃. 사방이 막힌 것 같은 절망감으로 한숨 쉬며 걷던 제게 하나님께서 보여주신 작은 위로였습니다. \n하나님은 오늘도 삶의 작은 순간 하나까지 섬세하게 인도하시고 내가 너와 함께하고 있어\n말씀해주셨답니다.", "ids": ["10CuJK9cYUlmSEbCDuIgh5PnFqJ-7dBAe"], "files": []}, {"n": 29, "ts": "2026. 7. 28 오후 5:02:32", "name": "정명철", "church": "선한목자교회", "ours": true, "title": "창가의 묵상,감사", "place": "일터", "when": "2025년 가을", "story": "아내가 아프고 나서야, 결혼 35년 만에 처음 찍은 가족사진.\n매일 이 창가에 앉아 말씀과 함께를 묵상합니다. 청년 시절에는 늘 새벽기도를 다녔습니다.\n세월이 흘러 60대를 넘어 아내가 아프자, 다시 새벽예배의 자리로 나아가게 되었습니다.\n돌아보니 주님은 늘 함께하셨고, 지금도 변함없이 인도하고 계십니다.\n모든 것이 하나님의 은혜입니다.", "ids": ["1as369PYV_r2PtmRJ1vv2_pymQYlN_0IM"], "files": []}, {"n": 30, "ts": "2026. 7. 28 오후 9:31:32", "name": "김형찬", "church": "선한목자교회", "ours": true, "title": "One Way", "place": "뉴욕 미드타운", "when": "2026. 06. 28", "story": "하늘을 찌를 듯 솟아있는 빌딩숲 사이에서 쉼 없이 교차하는 사람과 차들. \n\n이 사진은 미국 뉴욕 맨해튼 한복판에서 찍은 사진입니다. 어지러운 도심 한가운데, 푸른 나무와 함께 선명하게 서 있는 'ONE WAY(일방통행)' 표지판이 저의 시선을 사로잡았습니다.\n\n세상은 저마다 성공과 행복을 향한 수많은 길을 제시하며 바쁘게 달려 가라고 재촉합니다. \n그러나 매일 말씀을 펴고 주님과 교제하는 시간은, 복잡한 세상 속에서도 우리의 유일한 구원이자 진리 되시는 예수 그리스도라는 '오직 한 길(One Way)'을 잊지 않게 해주는 영적 이정표가 됩니다.\n\n\"예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라\"\n(요한복음 14:6)\n\n오늘 하루도 세상의 소음에 흔들리지 않고, 예수님이 보여주신 '생명의 길'을 따라 걷는 은혜의 여정이 되기를 바랍니다.", "ids": ["1DIMaYhA2XKYHeMvKMvNyTDmrStIc9j7A"], "files": []}, {"n": 31, "ts": "2026. 7. 29 오전 12:40:39", "name": "김나혜", "church": "선한목자교회", "ours": true, "title": "일상에서 누리는 주님", "place": "성수대교", "when": "2025.08.07", "story": "잠언 8:31\n그가 만든 세상을 보고 즐거워하고\n그가 창조하신 인류를 보고 기뻐하였다.\n\n출퇴근길 주님이 만드신 하늘을 보며 주님을 생각하고 주님이 기뻐하시는 것에 함께 기뻐하며 주님을 누립니다.", "ids": ["1pfk9nNVYDN__HhOVe_JGTLdfYYt_7IjF", "1-fkjJR0NOC9YFXwSBrHYSBQYTnu5GePA", "1kt9E5b0SMgVuCgEbRMUIjf1yki088x2U", "11lSyrd3btzv99RAtNwdEX8bw7JftGKG0", "1rXqTRCFeZADRLy_QaQInb9AA6Tt2gNLe"], "files": []}, {"n": 32, "ts": "2026. 7. 29 오후 4:36:01", "name": "김영배", "church": "선한목자교회", "ours": true, "title": "삶", "place": "양평가는 어느 길", "when": "2017‎년 ‎10‎월 ‎25‎일", "story": "안개에 갇혀 있는 길 끝에는 밝은 나의 삶이 기다리고 있기 때문에 입니다. 말씀이 빛이 되어 어두운 사진의 색이 조금씩 그 색이 발하는 것은 말씀의 삶을 읽고 실천하는 나의 마음이 입니다.", "ids": ["1EwYh7JA2ii2PH3UTe6Y7xYqsgtpbLqsG"], "files": []}, {"n": 33, "ts": "2026. 7. 29 오후 6:30:42", "name": "박하늘", "church": "선한목자교회", "ours": true, "title": "비 준비하시니", "place": "지리산, 한강, 필리핀", "when": "지리산(20241026), 한강(20260703), 필리핀(20260531)", "story": "구름사진 - 광야 시절 낮에는 구름기둥으로 지켜주셨고 또한, 비 준비하시니 찬양을 들으며 구름은 땅을 위하여 복음의 단비를 내려주시는 주님의 선물이라는 생각이 들었다.", "ids": ["1_Kae9NcyNPTeLHopxNXCUbjY9S0g5R6R", "1n-1zq0U_99Srw7gL8ir4r2mtNp7nrVoI", "1s0TUusGV2eHoer0Qw10BBnIBfWcMRewK"], "files": []}, {"n": 34, "ts": "2026. 7. 31 오후 3:54:32", "name": "김혜수", "church": "선한목자교회", "ours": true, "title": "깨끗한 마음", "place": "양평", "when": "4월 8일 봄", "story": "백매화의 꽃말은 깨끗한 마음,인내입니다.우리의 마음을 깨끗하게 하시는 주님, 우리를 정죄하지 않으시고 인내하시는 주님의 은혜를 기억해봅니다.", "ids": ["1a_qnlTEGiMU3tlXFnQ9ijsRR6lQwtN-8"], "files": []}, {"n": 35, "ts": "2026. 8. 1 오후 12:39:36", "name": "강민송", "church": "선한목자교회", "ours": true, "title": "특별한 새벽예배", "place": "경기도 성남시 분당구 운중동", "when": "2026년 6월", "story": "새벽예배를 가는 길에 찍은 핑크빛 새벽하늘입니다. 선한목자교회 본당 공사 전에 젊은이교회에서 마지막으로 진행하는 카코특새날이었어서, 당연하지 않은 새벽예배의 자리로 느껴졌습니다.\n\n하나님께서 보여주신 아름다운 핑크빛 하늘이 더 특별한 새벽예배로 기억하게 해주는 것 같습니다. 말씀과 함께한 하루의 시작이 감사해서, 이 사진을 제출하게 돠었습니다.", "ids": ["13PWsdjiNZMtmxjpAbqja3yg1oqWVAoNH"], "files": []}, {"n": 36, "ts": "2026. 8. 2 오전 12:21:25", "name": "오윤경", "church": "선한목자교회", "ours": true, "title": "사랑으로 소문난 교회❤️", "place": "집(골방기도하는 책상)", "when": "2024년 1월1일 월 오후11시13분", "story": "재창립20년 기념과 더불어 첫 말씀함께를 발간한 기념. 첫 날 펴서 말씀을 묵상하며 기념 촬영했습니다. 첫 달 말씀함께 이벤트 (31일 챌린지)에 도전하여 묵상완료 후 <ㅁㅆㅎㄲ 볼펜>을 선물을 받은 기억도 납니다. \n말씀함께 덕분에 하루 하루 주님과 함께 할 수있어 행복합니다. 주님과 함께! 말씀함께!", "ids": ["1xDD2fKlOEYzIHKB4LtYZUBePtSoMg5cf"], "files": []}, {"n": 37, "ts": "2026. 8. 2 오전 12:31:39", "name": "오윤경", "church": "선한목자교회", "ours": true, "title": "Hug time with Jesus🫶", "place": "집(골방기도하는 상)", "when": "2025년3월1일 토", "story": "작년 긴 겨울방학이 끝나고 신학기 개학을 앞둔 3월1일에 말씀을 묵상 후 자녀를 위한 기도를 하며 말씀과 함께 한 귀한 날을 기념해서 밤11시57분 사진을 찍었습니다. 이 자리에 앉아 잔잔한 찬양을 들으며 말씀을 묵상하면 주님 품에 꼭~안겨있는 기분이 듭니다. 오늘도 열심히 잘 살았다...애썼다..하시며 안아주시는 주님🤗 주님과 함께! 말씀 함께!❤️", "ids": ["1LcycuobXkbIFOgdOdioEz8-esZ9gfAZy"], "files": []}, {"n": 38, "ts": "2026. 8. 2 오전 10:53:30", "name": "최성은", "church": "선한목자교회", "ours": true, "title": "쉼", "place": "오산리 기도원", "when": "2026.05.04", "story": "지치고 힘들 때, 기도원 가서 자연을 보며 회복하고 말씀에 귀기울이게 되었습니다.", "ids": ["1dJxzaLkReNyn3VCn__VD_orSg3PsiUFF", "1S18pJIJxKCqWelbxJa8EIuqyO71GPh-_", "1ccK3Beb6zlP1CHI4EQlmWfVNOXdyn1X1"], "files": []}, {"n": 39, "ts": "2026. 8. 2 오후 12:17:28", "name": "최지훈", "church": "선한목자교회", "ours": true, "title": "부모동반", "place": "군포 근처 공원 / 경기 광주 자택 / 올림픽공원", "when": "2025년 5월  중순 / 2026년 7월 / 2025년 5월 초순", "story": "사진1 :그 무렵 처가살이를 하고 있는 와중에 하루하루가 힘들고 장모님과의 갈등속에서 보내다가 아내와 함께 가정의달 아들 어린이집 부모동반 야외학습에 나갔는데 그 하루가 나의 마음을 따뜻하게 해줬으며 이 힘든시기를 보내고 있는 것 또한 주님의 큰 계획안에 있음을 느낄수 있었던 하루였습니다. \n\n사진2 : 최근 6월부터 새집으로 이사하고 7월 비가 많이 오던 시기 한창 아들온유가 매일 이야기를들려달라고 했던 것이 \"노아의 방주\" 였는데 그때 비가 그칠 무렵 보인 무지개와 아들에게 들려줬던 노아의 방주 이야기가 너무 맞아떨어져서", "ids": ["17sD6huH5wDLl3R7R_qKEGCl5-u0yFzXr", "1Z6_G4ohvOrTPrRfmE5ZtE2XDTO_uEdax", "11PqzWH5rnu-abeiYYjVY1ACACDnxRySG"], "files": []}, {"n": 40, "ts": "2026. 8. 2 오후 2:05:37", "name": "박아연", "church": "선한목자교회", "ours": true, "title": "말씀을 따라 걷는길", "place": "얀냔", "when": "2026.02.04", "story": "양양의 아침,\n해돋이를 보기 위해 이른 새벽 바다를 찾았습니다.\n기대했던 찬란한 일출은 구름에 가려 끝내 볼 수 없었습니다.\n처음에는 아쉬웠지만, 문득 흐린 하늘 사이로 비치는 은은한 빛과 비에 젖은 길 위를 홀로 걸어가는 한 사람의 모습이 제 마음을 붙잡았습니다.\n그 순간 하나님께서 제게 말씀하시는 것 같았습니다.\n“해가 보이지 않아도 빛은 여전히 존재한다.”\n\n돌이켜보면 제 삶도 그랬습니다.\n공황장애로 가장 힘들었던 시간, 앞이 보이지 않는 날들이 있었습니다.\n기도해도 응답이 없는 것 같고, 하나님이 멀게만 느껴질 때도 있었습니다.\n하지만 시간이 지나 돌아보니 하나님은 언제나 함께 계셨습니다.\n비 온 뒤의 길도, 흐린 하늘도, 보이지 않는 순간까지도 하나님은 저를 말씀으로 인도하고 계셨습니다.\n이 사진은 화려한 해돋이를 담은 사진은 아닙니다.\n오히려 말씀이 비추는 빛을 따라 오늘도 한 걸음씩 걸어가는 우리의 인생을 담은 사진입니다.\n\n“주의 말씀은 내 발에 등이요 내 길에 빛이니이다.” (시편 119:105)\n\n비록 기대했던 해는 보지 못했지만,\n그날 저는 해보다 더 선명한 하나님의 메시지를 만났습니다.\n보이지 않아도 하나님은 일하고 계시고, 말씀은 언제나 우리의 길을 비추고 있다는 것을.\n그래서 오늘도 저는 말씀을 붙들고 한 걸음씩 걸어갑니다.", "ids": ["1VusNRxu2h5UljMZ7MM57rEyEp_Xy62p5"], "files": []}, {"n": 41, "ts": "2026. 8. 2 오후 2:12:21", "name": "김은섭", "church": "선한목자교회", "ours": true, "title": "아프리카에도 함께 하시는 하나님", "place": "서아프리카 나이지리아 수도 아부자", "when": "2026.4.21", "story": "어제도 계시고 오늘도 계시고 내일도 계실 하나님이 믿어짐", "ids": ["1cgI_sUmyYqyVC07wwWx1KMePqb44Vumk"], "files": []}, {"n": 42, "ts": "2026. 8. 2 오후 2:16:52", "name": "김은섭", "church": "선한목자교회", "ours": true, "title": "하나님이 주신 풍성한 열매", "place": "아프리카 나이지리아 아부자 파머스마켓", "when": "2026.06.20", "story": "받은 복을 세어보아라", "ids": ["11bJ_s7dy0JDWsrEfZELuPEVFyhfyu3mo"], "files": []}, {"n": 43, "ts": "2026. 8. 2 오후 2:21:42", "name": "김은섭", "church": "선한목자교회", "ours": true, "title": "서로 사랑하라", "place": "서아프리카 시에라리온 프리타운", "when": "2025.10.02", "story": "어느 나라에 있던지 서로 사랑하라 라는 새 계명을 마음에 새김", "ids": ["1Ky242O4AY5mjh4Pv_8Kj7uxfZlichW_N"], "files": []}, {"n": 44, "ts": "2026. 8. 2 오후 3:23:47", "name": "박성진", "church": "선한목자교회", "ours": true, "title": "작품이 된 깨진 항아리", "place": "나이지리아 아부자", "when": "2026년 6월", "story": "민수기 33:55/ 내 안에 있는 원주민(옛자아)를 몰아내라는 말씀으로 받으며, 예수그리스도안에 거하는 새 자아는 깨진 항아리라도 작품이 된다는 정체성에 관한 묵상", "ids": ["1Z4HYst0axA_DyYSzrDgq1CGk7SSy4JbQ"], "files": []}, {"n": 45, "ts": "2026. 8. 2 오후 3:34:17", "name": "박성진", "church": "선한목자교회", "ours": true, "title": "하늘에 둔 소망", "place": "나이지리아 아부자", "when": "2026년5월", "story": "시편96:5/ 세상의 신들, 우상들이 많지만 눈을 들어볼 때 하나님이 하늘을 지으셨으며 재판하실 것이라는 소망과 확신을 노래한다.", "ids": ["1p9ArUSoTYiw3xVquBZVG3DJcrrensu3H"], "files": []}, {"n": 46, "ts": "2026. 8. 2 오후 11:41:42", "name": "정미라", "church": "선한목자교회", "ours": true, "title": "입히심 (Clothed in Grace)", "place": "본당입구", "when": "2024.04.26", "story": "[마6:30 오늘 있다가 내일 아궁이에 던져지는 들풀도 하나님이 이렇게 입히시거든 하물며 너희일까보냐 믿음이 작은 자들아]  나는 '오늘 피었다 지는 꽃'과 같은 존재입니다. 갑작스럽게 닥쳐온 힘들고 어려운 상황 속에서, 저 또한 하나님 없이는 하루도 살 수 없는 들풀과 같은 존재라는 것을 이 작은 들풀을 통해 알게 하셨습니다. 하나하나 세심하게 돌보시는 하나님을 신뢰하며 살아가고 있는 지금의 삶을 돌아보며 사진을 출품하게 되었습니다.", "ids": ["19wDRrqDPAoPqHGUcbggAggNko4K4GwdQ"], "files": []}, {"n": 47, "ts": "2026. 8. 3 오전 10:24:58", "name": "이영희", "church": "선한목자교회", "ours": true, "title": "<사랑하는 가족이 함께한 시간>", "place": "첫번째사진 눈덮힌동네한옥도서관.두번째사진 중국 .세번째사진 토지촬영장소", "when": "첫번째 2024.11/두번째2025.4/세번째2025.10", "story": "사랑하는 가족들과 행복한 여행과 일상중에 찍은 사진이고 무엇보다 두아이 모두 해외에 있어서 함께 할 시간이 적습니다.하여 함께 했던 소중한 시간들이 젖어든 사진이라서 표지에 실린다면 그 따뜻함이 성도들에게도 똑같이 전해지지않을까 하여 보내봅니다.", "ids": ["1YEy6sa4genYXCWRvEWTDlScnstzlZ9mO", "1aCrHinvuYRritnZsGw7BUMDAfH9uvmqF", "1x-LMt-zJnHJI4rVAmkjMRSznLMJgPR0o"], "files": []}, {"n": 48, "ts": "2026. 8. 3 오후 12:19:38", "name": "고건호", "church": "선한목자교회", "ours": true, "title": "고요함속의 경이", "place": "귀국하는 비행기 안", "when": "2026년 6월", "story": "어렸을때 하나님은 하늘 저 위에 있는줄 알았는데 제가 하나님을 인격적으로 만나니 내가 땅에 있던지 하늘에 있던지 항상 함께 하신다는 것을 깨달았습니다.", "ids": [], "files": ["20260621_175508 - kwonho Ko.jpg"]}, {"n": 49, "ts": "2026. 8. 3 오후 3:12:22", "name": "임미진", "church": "선한목자교회", "ours": true, "title": "샬롬Shalom", "place": "우리집 방 기도책상", "when": "2026년 5월 22일", "story": "매일 아침 주님과 인사하며 말씀함께로 묵상하고 기도하는 장소. 샬롬책상입니다. 하나님께로부터 오는 참된 평안이 있는 자리. 매일 말씀함께로 만나는 주님과의 시간에 몸과 마음이 온전하여지고 부족함 없이 충만이 채워지며 회복되는 자리입니다.", "ids": ["10LUBT5pDBBlkJDel3oC4l-pzrQRY9Fi0", "1L_qffK7b3Gf9Jpr1g0SIJ36DaH-bh4FE"], "files": []}, {"n": 50, "ts": "2026. 8. 3 오후 4:56:20", "name": "박성진", "church": "선한목자교회", "ours": true, "title": "마음의 허기", "place": "나이지리아 아부자", "when": "2026년 3월", "story": "마11:28~30/ 나의 허기(결핍)를 스스로 채우려고 수고와 짐을 가고 가는 삶을 보게 됨.", "ids": ["10L23x6IUa7yqmWYmSMbVG-wyIW_f9UMg"], "files": []}, {"n": 51, "ts": "2026. 8. 3 오후 9:19:11", "name": "원재영", "church": "선한목자교회", "ours": true, "title": "감사로 물든 순간", "place": "이탈리아", "when": "2024년 9월", "story": "일상에서의 감사함을 자꾸 잊어버리고 불평이 많아지는 요즘,\n너무나 아름다운 자연을 마주했을 때 근심과 걱정이 사라지고\n모든 것이 감사함으로 바뀌었던 그때를 떠올리게 됩니다.", "ids": ["1wqXOoxB5eBS91PdYGdUt8IRYV3Rh0aKd", "1azNkINuuZ5ohP84i1x_zJ-KqjnN9Xz4L", "1LRpgl1K8fygipVbhr0OJZOab2kkNY_Zy"], "files": []}, {"n": 52, "ts": "2026. 8. 4 오후 9:30:33", "name": "김동해", "church": "선한목자교회", "ours": true, "title": "화해", "place": "남당항 무지개다리", "when": "2026년 1월 1일", "story": "25년 마지막 주에, 사춘기아들의 휴대폰중독과 반항에 화를 내다가 그만 손목골절이 되어 긴급수술을 하였습니다. 새해맞이 1일 가족여행계획이 되어있었기에, 삼일간만 입원하고 퇴원하자마자 위험하긴 했지만 가족을 모두 데리고 한손으로 겨우겨우 운전하여 남당항 인근 숙소로 향했습니다. 가족들 모두 서로에 대한 미안함과 후회됨이 짐처럼 다가왔지만, 말씀함께로 매일 가정예배도 드리면서 여행을 잘 마칠 수 있었던 것 같습니다. 남당항에서 바라본 새해 첫날 일몰이, 사랑뿐인 주님의 마음과 풍성한 위로의 기억으로 남아있습니다.", "ids": ["14lKVgAoh3yXn6OA9JlU2EVnvmiNwQpL1"], "files": []}, {"n": 53, "ts": "2026. 8. 5 오전 11:26:54", "name": "유혜진", "church": "선한목자교회", "ours": true, "title": "추억의 한 페이지", "place": "제주/소백산/홍쌍리마을 매화축제", "when": "2024년 4월/ 2013년 10월/ 2023년 3월", "story": "같은 곳을 바라보며 천국을 소망하는 동반자 친구/가족과 하나님께서 베푸신 자연을 누리며 즐거워한 날/ 주께서 만드신 에덴동산과 같은 느낌이 들었음", "ids": ["11wBvrBeT5jX21-KS514EBpgihub5HW4e", "1UN9smIr5mmtPrxZIey_BwWLzd7NER04p", "1Scr4CI5VdKiztoQEwz20nSB9TzCap9W2"], "files": []}, {"n": 54, "ts": "2026. 8. 6 오전 8:33:31", "name": "조금택", "church": "선한목자교회", "ours": true, "title": "천국으로 가는 길", "place": "중국 사천성 야딩코라", "when": "2014.09.24", "story": "천국으로 가는 길은 수많은 우여곡절과 고난이 함께 하는 여정과 그 끝의 평안과 충만함", "ids": ["1eJTicj9_de00_otdArC0Z1LUsicYOF9s", "1vReqzZ8_0JTanqmOk8MEfSCPbJ3J1dC0", "1tMWKMn4d8IxxqddgzdBfFXa9ZXEb-JKQ"], "files": []}, {"n": 55, "ts": "2026. 8. 6 오후 4:45:10", "name": "김미숙", "church": "선한목자교회", "ours": true, "title": "한 해의 마무리와 시작", "place": "중국 황산, 대만 설산", "when": "2012.12.31 2012.03.09", "story": "한 해를 마감하고 새로운 시작을 알리는 변함없는 세상의 이치를 통해 주님의 존재를 느낀다", "ids": ["17cPNjtTec8ku9f5wY7XOFqQX_xk2ucWa", "162SpdgxG9xLwq6WkjtWLm3spLRPPZLBC"], "files": []}, {"n": 56, "ts": "2026. 8. 6 오후 5:24:24", "name": "김미숙", "church": "선한목자교회", "ours": true, "title": "꽃에서 찾는 주님의 말씀", "place": "일본 오사카", "when": "2018.04.12", "story": "화려한 봄. 각종 꽃을 자세히 들여다 보면 주님이 아니면 만들 수 없는 놀라운 조화를 알게 된다", "ids": ["1_Ic6p5MozdzHXi-gZFLclcLLdMQaDlqu", "1gU34S7Sjy6JfdGjL9pz-J5Off3tx1LpQ"], "files": []}, {"n": 57, "ts": "2026. 8. 7 오전 7:33:31", "name": "강정은", "church": "선한목자교회", "ours": true, "title": "오늘도 답하시는 주님", "place": "동해 추암해변", "when": "2026.07.28", "story": "여행중에 늘 기도하는 기도 제목이 있었습니다.\n\"자연속에서 주님을 경험하는 여행이되게해주세요\"\n늘 그렇듯 기도하며 가족여행을 즐기고있었습니다.\n이렇게 답해주시는 주님을 경험하는 여행이 되었지요^^\n가족모두 이런경험을 또 할수있을까 감탄의 감탄을 했던\n또 하나의 주님과의 추억이 저축되었던 날입니다^^\n이날 교회공모전 카톡을 받고 깜짝놀랐지요.\n그러다보니 공모전 규격에 맞지는 않지만..\n우리가족과 함께 하시는 주님을 나누어봅니다^^", "ids": ["12TWxwZ35e7EjYt6PYTtiV4Zhf_kHVLP3", "1VM3ZVUbkQy5cRnzBItvQJBHb6T-ZyPR-", "1n4AS-HOeo5kIN49mBQ9EAi3avkNnhyPS"], "files": []}, {"n": 58, "ts": "2026. 8. 7 오후 5:05:21", "name": "서경원", "church": "선한목자교회", "ours": true, "title": "새로운 생명과 새로운 길", "place": "인천대공원", "when": "2021년 5월", "story": "\"보라 내가 새 일을 행하리니 이제 나타낼 것이라 너희가 그것을 알지 못하겠느냐? 반드시 내가 광야에 길을, 사막에 강을 내리니(이사야 43:19), 새벽의 빛은 하나님께서 시작하시는 '새로운 일'을 상징하고 죽순의 새순처럼 조용하지만 분명하게 시작된다는 걸 의미한다고 느껴집니다.", "ids": ["1YB_6i3yeYUb_s4H8GBsAbP8iqymEKA46"], "files": []}, {"n": 59, "ts": "2026. 8. 7 오후 5:14:05", "name": "서경원", "church": "선한목자교회", "ours": true, "title": "푸른 초장", "place": "대관령 양떼목장", "when": "2023년 10월", "story": "\"여호와는 나의 목자시니 내게 부족함이 없으리로다. 그가 나를 푸른 초장에 누이시며 쉴 만한 물가로 인도하시도다.\"(시편 23:1~2) 하나님께서 우리의 삶을 안전하게 인도하시며 평안을 주시는 목자이심을 가장 아름답게 표현했다고 생각했습니다. 주님의 인도하심을 믿으며 한 걸음씩 걸어가는 삶의 여정이 얼마나 평안한지 보여줍니다.", "ids": ["1nQs36E8WxL2ho_EqGi7vvlwECAG25O16"], "files": []}, {"n": 60, "ts": "2026. 8. 7 오후 5:38:04", "name": "서경원", "church": "선한목자교회", "ours": true, "title": "보이지 않는 임재", "place": "옥구 평야", "when": "2024년 5월", "story": "\"바람이 임의로 불매 네가 그 소리는 들어도 어디서 와서 어디로 가는지 알지 못하나니 성령으로 난 사람도 다 그러하니라\" (요한복음 3:8) 바람이 직접 보이지는 않지만 흔들리는 보리의 결이 바람의 존재를 증명하듯이 성령님도 눈으로 볼 수 없지만 우리의 삶을 변화시키며 방향을 바꾸는 보이지 않는 하나님의 임재를 더 뚜렷하게 보여준다고 생각합니다.", "ids": ["1KjT84IQfrQvolsWSHHzoXbas3hjR4Uat"], "files": []}, {"n": 61, "ts": "2026. 8. 7 오후 10:35:55", "name": "주혜영", "church": "선한목자교회", "ours": true, "title": "하나님의 꿈", "place": "한반도지형전망대 (강원특별자치도 영월군 한반도면 옹정리 산 141-1)", "when": "2026.07.28", "story": "통일된 한반도'라는 하나님의 꿈이 우리(남녘땅) 마음 에 형상화되어 있다고 느껴서", "ids": ["1coCqWP3VR5eMu3_ecKcFZXrKoJ8_f0mf"], "files": []}, {"n": 62, "ts": "2026. 8. 9 오전 8:13:13", "name": "임순귀", "church": "선한목자교회", "ours": true, "title": "돌아온 탕자", "place": "서울 하늘공원", "when": "2025.1", "story": "억새의 꽃말은 친절, 활력, 은퇴 로 말씀과 함께한다면 친절하고, 활력이 넘치며 죄에서 은퇴한다는 의미로 연결지어 보았고, 또한 유능제강이라는 말처럼 어떤 고난과 시련 속에서도 말씀을 의지하고 살아간다면 어떤 것도 두려울 것 없음을 내포합니다.\n이러한 의미를 담아 떠오른 말씀이 누가복음 15장의 돌아온 탕자 비유 말씀입니다.\n수많은 억새 하나하나가 한 영혼이라면, 주님께서 본인께 돌아온 영혼들을 환히 밝혀 맞이 해 주는 것 같았습니다.", "ids": ["1sKRE9jIol5TyLtVNTdoq39XV8ZYp5EoA"], "files": []}, {"n": 63, "ts": "2026. 8. 9 오전 8:35:08", "name": "임순귀", "church": "선한목자교회", "ours": true, "title": "주님의 사랑(feat.Jesus)", "place": "이탈리아 돌로미티", "when": "2025.11", "story": "하나님의 사랑으로 예수님을 보내주셨고, 죽기까지 사랑하셨으며, 이를 나타내는 십자가로 산행을 무사 기원 하는 의미로 산맥의 정상마다 세워 두었다 하여 \n요한복음  14:6 ) 예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라\n하신 말씀과 같아 올려봅니다.", "ids": ["1FtWtuHRhvWWJkBgpmdozxGzLb0ujo1FJ"], "files": []}, {"n": 64, "ts": "2026. 8. 9 오전 8:55:18", "name": "임순귀", "church": "선한목자교회", "ours": true, "title": "행복", "place": "남이", "when": "2025.1", "story": "세상에서 말하는 화려함이 아니어도 주님께서 만드신 작품이 아름다움을 느끼며 떠오른 찬양 - 행복(화려하지 않아도 정결하게 사는 삶)이 떠올라 택해 보았습니다", "ids": ["1m7vy5hGsbl3LYeNPec3npwZKBocPexfa"], "files": []}, {"n": 65, "ts": "2026. 8. 9 오전 11:27:20", "name": "변혜진", "church": "선한목자교회", "ours": true, "title": "생명의 오아시스", "place": "돗토리 일본", "when": "2026년 8월 4일", "story": "돗토리 현에서 만난 사막입니다. 황량한 것 같지만 올라가면 확 트인 바다입니다. 사막처럼 사방이 막혀있더라도 조금 더 가면 탁 트인 내일을 주님이 준비해셨음을 믿습니다", "ids": ["1yF2q5SUhnXS9fxkIAwPiZhWIBsNlUiCG"], "files": []}, {"n": 66, "ts": "2026. 8. 9 오후 10:41:26", "name": "김혜진", "church": "선한목자교회", "ours": true, "title": "은혜의 해변을 따라 걷다", "place": "호주 멜버른 오션로드 12사도 바위", "when": "2025.2.28.", "story": "12사도 바위처럼 늘 우리 곁을 지키시는 주님과 함께 걷는 하루", "ids": ["1C1XeOJJdRyRuKNA38uZsKOQVwEbUtkYl"], "files": []}, {"n": 67, "ts": "2026. 8. 9 오후 10:55:45", "name": "김혜진", "church": "선한목자교회", "ours": true, "title": "주님의 궤적 안에 머무는 하루", "place": "실내 스튜디오", "when": "2026.2.26.", "story": "캄캄한 밤하늘(어둠) 속에서도 주님의 빛이 우리의 삶을 둘러싸고 회전하며 지켜주신다", "ids": ["1MXH3C7-aXXmYge7wXC2L8qWEY2gOJ2Ig"], "files": []}, {"n": 68, "ts": "2026. 8. 9 오후 11:03:48", "name": "김혜진", "church": "선한목자교회", "ours": true, "title": "오늘 하루도 주님 손잡고", "place": "대전 대청호", "when": "2025.7.26.", "story": "풀밭에서 한가롭게 거니는 거위들과 빛나는 노란 들꽃들이 어우러져, 세상 끝 날까지의 평안과 안식을 주시는 주님", "ids": ["1m73Gy_NQcH_QLX72Cmba9R0NXsrF5vi9"], "files": []}, {"n": 69, "ts": "2026. 8. 10 오전 12:16:50", "name": "이윤경", "church": "선한목자교회", "ours": true, "title": "진달래", "place": "대구", "when": "2024년봄", "story": "주님이 주시는 봄의 아름다움이 감동이었습니다. 고단한 싦에 선물을 채워주시는 것같았습니다.", "ids": ["1JB2VR509OgHViUKN2QJUeQ3gAlMaPxIB"], "files": []}, {"n": 70, "ts": "2026. 8. 10 오전 12:19:48", "name": "이윤경", "church": "선한목자교회", "ours": true, "title": "가을", "place": "대구", "when": "2024년가을", "story": "다양한 색을 품는 가을이 우리 모두를 사랑으로 품어내는 주님의 향기를 주는 같았다.", "ids": ["1dO5tKv8as2cUrJcxszLxGeWCo7M8VDkc"], "files": []}, {"n": 71, "ts": "2026. 8. 10 오전 12:22:49", "name": "이윤경", "church": "선한목자교회", "ours": true, "title": "겨울", "place": "홋가이도", "when": "2024년겨울", "story": "온통 하얀 눈에 덮혔지만 생명이 흐르고 있다. 우리의 척박한 삶에 주님이 함께 하고있듯이...", "ids": ["18cqtgd-DXKFrQn2UH2SYcbSQTgbWrbAR"], "files": []}, {"n": 72, "ts": "2026. 8. 10 오전 10:53:18", "name": "강선옥", "church": "선한목자교회", "ours": true, "title": "\"풍랑보다 크신 하나님\"", "place": "직접구상하여 그렸습니다", "when": "2024.5.", "story": "\"삶의 거센 광풍같은 문제가 나를 삼키려할 때, 눈물조차 안나오는 어둠속에 홀로 앉아 떨때에도, 빛되신 주님은 희망의 메신저를 날려보내사 나를 소망의 언덕으로 이끄시므로 승리할 것을 확신합니다. 할렐루야!", "ids": ["1Q43PviW6furNeWdHVAQ6zYHm03VyLVhE"], "files": []}, {"n": 73, "ts": "2026. 8. 10 오전 11:11:05", "name": "강선옥", "church": "선한목자교회", "ours": true, "title": "\"빛과 소망의 뜨락에서\"", "place": "직접 그렸습니다", "when": "2024.8.", "story": "성구\n시편 1:3\n\"그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며 그 잎사귀가 마르지 아니함 같으니 그가 하는 모든 일이 다 형통하리로다\"\n작품내용\n세상 앞에 서있는 소년 \n말씀이라는 푸른 초장에서 주님의 인도하심을 누리는 자녀로, 세상에 발걸음 내 디딜때, 세상이 줄수없는 평안 속에 말씀으로 승리하는 '샘물가 열매맺는 나무'로 자라길 꿈꿉니다.", "ids": ["1D5q0l4wyLHZwbYZ1ClAh15cI2Hpka-Ct", "1-CY8MKeU4W7BN3T88XRes-ZKDicxCL-9", "1xPAKyOvVpoOoasitE98jvyTy5XooyGDI", "1Zahp2h0x_X-yzrXXDCKF36YelMyjQ0u0"], "files": []}, {"n": 74, "ts": "2026. 8. 10 오전 11:12:57", "name": "안경심", "church": "선한목자교회", "ours": true, "title": "예수님께로 가는 길", "place": "노르웨이", "when": "2026년 7월", "story": "말씀함께는 예수님께로 나아가는 길입니다.", "ids": ["1ffzEYP8rlOfquMrbIGlePUKnUmdbgb-L"], "files": []}, {"n": 75, "ts": "2026. 8. 10 오전 11:16:26", "name": "안경심", "church": "선한목자교회", "ours": true, "title": "머물기", "place": "노르웨이", "when": "2026년 7월", "story": "말씀함께는 반석이신 예수님 곁에 머무는 것입니다.", "ids": ["1s-MnTKqSJ9RdD4AysCh-A3qEN6ZvfDvJ"], "files": []}, {"n": 76, "ts": "2026. 8. 10 오전 11:18:47", "name": "안경심", "church": "선한목자교회", "ours": true, "title": "생명수", "place": "노르웨이", "when": "2026년 7월", "story": "말씀함께는 반석에서 흘러나오는 생명수를 마시는 것입니다.", "ids": ["1gR9P-mmbS4mYhagynbmkdSG_3z0W2gJT"], "files": []}, {"n": 77, "ts": "2026. 8. 10 오후 5:10:20", "name": "함여진", "church": "선한목자교회", "ours": true, "title": "통일의 하늘", "place": "강화도평화전망대", "when": "2026.08.10", "story": "복음통일을 위한 기도아웃리치 답사를 위해 강화도에 왔습니다.\n평화전망대에 올라가 북한땅을 바라보았는데 땅도 하늘도 너무나 예쁘고 평화로웠습니다.\n그런데 눈으로만 볼 수 있는 오늘이 너무 안타까웠습니다.\n오늘 말씀함께 시편 113편의 말씀에 \n[시113:4-8]\n4 여호와는 모든 나라보다 높으시며 그의 영광은 하늘보다 높으시도다\n5 여호와 우리 하나님과 같은 이가 누구리요 높은 곳에 앉으셨으나\n6 스스로 낮추사 천지를 살피시고\n7 가난한 자를 먼지 더미에서 일으키시며 궁핍한 자를 거름 더미에서 들어 세워\n8 지도자들 곧 그의 백성의 지도자들과 함께 세우시며\n\n하나님은 언제나 영광을 받으시기에 합당하신 분이십니다. 하나님은 오늘도 북한을 향해 선하게 일하고 계심을 믿습니다.\n북한을 긍휼히 여겨주소서.\n가난한 자와 궁핍한 자들을 보호하여 주소서.\n하나님의 때에 반드시 복음으로 우리에게 통일을 주실줄로 믿으며 기도합니다.\n\n하나님의 걸작품인 아름다운 하늘과 땅 남북한이 함께 모여 눈으로 보며 발로 걸으며 함께 두손을 높이 들어 하나님을 찬양하게 하실 그날을 기대하며 기도합니다.", "ids": ["1pJfnnSzUCrZsEzpAFmmfzTfG2YL0lqyR"], "files": []}, {"n": 78, "ts": "2026. 8. 10 오후 9:24:45", "name": "이승희", "church": "선한목자교회", "ours": true, "title": "눈 내린 숲과 나무", "place": "뮤지엄 산", "when": "2024.11.29", "story": "첫째, 낮이나 밤이나, 계절에 상관없이 언제나 우리를 돌보시는 하나님을 묵상할 수 있는 사진입니다.  둘째, 창조주 하나님께서 빚으신 아름다운 자연을 보며, 주님을 묵상해볼 수 있는 사진입니다.", "ids": ["17Qto4p9HYuBd69EVxy6XTx_TmQdQW7Y6"], "files": []}, {"n": 79, "ts": "2026. 8. 10 오후 9:29:32", "name": "이승희", "church": "선한목자교회", "ours": true, "title": "소망의 빛으로 오신 주", "place": "신세계백화점 강남점 앞 트리", "when": "2025.12.2", "story": "12월호에 표지 사진으로 사용하면, 우리에게 빛으로 찾아오신 예수님을 묵상하기에 좋은 사진이 될 거라고 생각합니다. 성탄 시즌에 잘 어울리며, 따뜻하고 포근한 느낌이 들어서 이 사진을 제출하게 되었습니다.", "ids": ["1fwgjPWR10AInlS-7QFQcE2hIRq8ew_p5"], "files": []}, {"n": 80, "ts": "2026. 8. 10 오후 9:35:29", "name": "이승희", "church": "선한목자교회", "ours": true, "title": "새 하늘과 새 땅", "place": "제주도 해변", "when": "2026.9.6", "story": "빛이 있으라 하시매 빛이 있었다'는 말씀과 더불어 '새 하늘과 새 땅'을 허락하시는 주님을 묵상하기에 적합한 사진이라고 생각합니다. 또한 '바다'와 같이 측량할 수 없는 주님의 마음과 시편 139편 17-18절 의 '주의 생각이 보배로우시며, 세려고 할지라도 그 수가 모래보다 많도소이다'라는 말씀을 떠올리기에 좋은 사진이라고 생각합니다.", "ids": ["12GvU_kTxzaDL4QnGCLfo02w1toDkRxjS"], "files": []}, {"n": 81, "ts": "2026. 8. 10 오후 11:42:00", "name": "허지원", "church": "선한목자교회", "ours": true, "title": "우리의 첫걸음, 하나님과 함께", "place": "서울 올림픽파크텔", "when": "2026.05.30.", "story": "믿지 않던 남편이 저를 만나 예수님을 영접하며 세례를 받고, 지금도 함께 신앙생활을 이어가며 결혼까지 하게 되었습니다.\n\n결혼을 준비하는 동안 크고 작은 순간마다 하나님을 의지하며 한 걸음씩 나아갔고, 그 과정에서 우리 부부가 하나님과 더 가까워질 수 있었습니다. 돌아보면 그 준비의 시간들이 저희에게는 참 감사하고 은혜로운 시간이었습니다.\n\n“그러므로 하나님이 짝지어 주신 것을 사람이 나누지 못할지니라.” (마태복음 19장 6절)\n\n성경 위에 우리의 손을 함께 올린 이 사진처럼, 앞으로의 결혼생활도 하나님과 함께 한 걸음씩 걸어가고 싶습니다. 그리고 결혼을 준비하는 많은 커플들에게도 그 시간이 단순히 결혼식을 준비하는 시간이 아니라, 함께 하나님을 알아가고 하나님과 더 가까워지는 시간이 되었으면 좋겠습니다.", "ids": ["1U1xI9svGEsuLpfe2D8NuGw5CA2PCrF0Y"], "files": []}, {"n": 82, "ts": "2026. 8. 11 오후 8:18:02", "name": "최한나", "church": "선한목자교회", "ours": true, "title": "아름다운 창조세계 앞에 걸음을 멈추고, 그 모든 것을 지으신 하나님을 찬양하며 경외했던 여름의 한 순간.", "place": "제천 의림지", "when": "2026년 8월 8일", "story": "여름휴가 중 의림지에서 마주한 푸른 하늘과 맑은 호수, 굽이진 소나무와 산의 풍경이 하나님의 창조하심을 떠올리게 했습니다. 아름다운 자연 앞에 잠시 걸음을 멈추고, 이 모든 것을 지으신 하나님의 크고 놀라우심을 바라보며 그 이름을 찬양하고 경외하는 시간을 가졌습니다. 말씀을 읽는 순간뿐 아니라, 하나님이 만드신 세계를 바라보는 모든 순간이 하나님과 함께하는 ‘오늘’임을 담았습니다.", "ids": ["13inA3tzJb1927-x-2BU6u2ByNBadhUYV", "1eExqYZJapWdIEiEFP-MeqYn1kO3g0DLd", "1WTLnNSeclcwHBP-KaeGt5GkTDiSjYN1I"], "files": []}, {"n": 83, "ts": "2026. 8. 12 오후 3:05:19", "name": "고인근", "church": "선한목자교회", "ours": true, "title": "여기 있음에 감사", "place": "연곡해수욕장", "when": "2025년 여름", "story": "다시는 이곳에 못 올 줄알았다.\n하지만..말씀이 나와 가족을 붙드시고\n다시 이곳에 올 수 있게 하셨다.", "ids": ["1yiYzwao5VdafkA6IbFJ7XW3c-kJfvuBm"], "files": []}, {"n": 84, "ts": "2026. 8. 13 오후 12:49:37", "name": "김유정", "church": "선한목자교회", "ours": true, "title": "퇴근 후 집가는 길", "place": "아파트 근처", "when": "2026.08.04", "story": "수고했다며 집으로 돌아가는 길에 가로등과 하늘과 나무의 조화로운 풍경을 보여주셨습니다", "ids": ["1-WetogZ70WBp1Wmgx4o-x062iEctdaq_"], "files": []}, {"n": 85, "ts": "2026. 8. 13 오후 4:46:31", "name": "김태선", "church": "선한목자교회", "ours": true, "title": "작은 생명도 주님을 믿고 사랑해요♡", "place": "집", "when": "2026.06.26", "story": "밀못하는 작은 반려가족인 강아지 소미가 우연히 장난감으로 만든  십자가 모양을 보는 순간 마음의 따뜻함과 함께 가족에게 잠시나마 작은 행복과 기쁨을 주었고 늘 하루하루 감사하며 말씀과 함께 살고자 하는 마음을 다시한번 생각하게 해주었고 십자가를 보며 주님께서는 언제나 말못하는 작은 생명체까지도 돌보시는 세심하신 분이라는 것을 다시 한번 깨닫게 되었답니다. 매일 모든 가족들에게 행복과 기쁨을 주는 반려가족을 위해 매일 기도하고 그아이도 하나님을 믿고 있다고 생각하며 응모하게 되었어요.", "ids": ["1xMeoGFChLnZ3atS_gaE6w8oC237gw2Ge"], "files": []}, {"n": 86, "ts": "2026. 8. 14 오후 12:40:34", "name": "강선옥", "church": "선한목자교회", "ours": true, "title": "1.\"풍랑보다 크신 하나님\" 2. \"빛과 소망의 뜨락에서 3.\"삶의 길 위에서 만난 하나님\"\" 3. \"삶의 길 위에서 만난 하나님\"\"", "place": "말씀묵상 후 화실에서 제작", "when": "1~3. 2025.6 제작", "story": "1. 풍랑보다 크신 하나님\n    말씀 : 마가복음 4장 39절\n            예수께서 깨어 바람을 꾸짖으시며 바다더러 이르시되 \"잠잠하라 정숙하라 하시니 \n            바람이 그치고 아주 잔잔하여 지더라\"\n    묵상 : 세상의 거센 풍랑 앞에서 어찌할 바를 모를 때, 말씀은 오늘도 나를 찾아오셔서 품에 \n       안아주시고 힘차게 날아오르도록 용기주셔서, 소망의 언덕으로 인도하시는 등불이 되셨습니다.\n\n2. 빛과 소망의 뜨락에서\n    말씀 : 시편 1:3 \" 그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며, 그 잎사귀가 마르지 아니함 \n              같으니 그가 하는 모든 일리 다 형통하리로다\"\n   묵상 : 미래의 세상 앞에 서 있는 소년,  \n            말씀의 푸른 초장에서 발걸음을 내딛는 자녀!\n            풍랑이는 문제 앞에서도 주님의 인도하심을 누리는 자녀로 발걸음을 내 디딜때, \n            샘물가 열매맺는 나무로 자라길 꿈 꿉니다.\n\n3.삶의 길 위에서 만난 하나님\n   말씀 : \"주의 말씀은 내 발에 등이요, 내 길에 빛이니이다\"\n   묵상 : 삶의 여정을 지나며 지치고 암울할 때, 인생의 길목에서 걸어온 길을 돌아보고, \n            앞으로 나아갈 말씀의 길을 향해 \"잠시멈춤\"의 새벽시간을 표현했습니다", "ids": ["1bKLr-W7FX_vPH5rvsfKkQcbNzDqJq5iG", "1eSDMe1Dg6HLJMJWIOt1U37VJaYU3-33J", "1H4K1HIu6u-eTC5xOQ0aDbkCMH5p9g9jy"], "files": []}, {"n": 87, "ts": "2026. 8. 15 오전 10:18:28", "name": "조현호", "church": "선한목자교회", "ours": true, "title": "파도가 쉬어가는 곳", "place": "제주", "when": "2026.08", "story": "끝없이 펼쳐진 바다와 푸른 자연을 바라보며, 하나님께서 말씀으로 창조하신 세상을 묵상할 수 있기 때문입니다.", "ids": ["1EoJl9ipBgZJe8BQK8vDP6FELCvaTRmMr", "1Y5osvwHN8QxpFk7NuHPunMlIe8ojbObQ", "1xaRq-Q0A0rEPneS0HOff-TviNPdIjlic"], "files": []}, {"n": 88, "ts": "2026. 8. 16 오전 10:47:10", "name": "정유은", "church": "선한목자교회", "ours": true, "title": "아름다운 노을와 하나님", "place": "대한민국 충청남 천안시 동남구 휴게소", "when": "2026년 8월 8일 토요일 (여름)", "story": "노을을 보면 마음이 왠지 모르게 따뜻해지게 됩니다. 그리고 말씀함께를 적을때도 왠지 마음이\n따뜻해지게 되죠.그렇기에 노을을 보니 마음이 따뜻해지는것이 말씀함께가 떠오르는거 같아서 바로 찍었답니다~!", "ids": ["1y3VOiwUDUl50U1tp75ATpLyHqnhldQRU"], "files": []}, {"n": 89, "ts": "2026. 8. 16 오전 11:11:02", "name": "조성희", "church": "선한목자교회", "ours": true, "title": "사람을 낙는 어부가 되렴..", "place": "인천 선녀바위 해변", "when": "2026년 8월 여름", "story": "아이가 바다에서 물고기 잡는모습을 보고 예수님께서 베드로에게 사람을 낙는 어부가 되렴 말씀이\n떠올랐습니다.", "ids": ["1FKj_23_FWrikQCfY0AEItIiZLmqyQWfE", "1njff6dCab4Bp69fsQcE0payLmwJiPAvr"], "files": []}, {"n": 90, "ts": "2026. 8. 16 오전 11:18:25", "name": "김영생", "church": "선한목자교회", "ours": true, "title": "하나님이 그리신 바다, 신비의 협곡과 열린 하늘, 믿음을 새긴 집", "place": "지중해 카푸타쉬 해변, 앤텔로프 캐년, 카파도키아", "when": "2026년 6월, 2025년 3월, 2026년 6월", "story": "1.눈부시게 푸른 바다와 하얀 모래사장, 그리고 웅장한 절벽이 어우러진 풍경 앞에서 한동안 발걸음을 멈추었습니다.\n\n말씀이 떠오르며, 이 아름다움이 우연히 만들어진 풍경이 아니라 창조주 하나님께서 친히 그리신 작품이라는 생각이 들었습니다.\n\n\"바다도 그의 것이라 그가 만드셨고\"\n(시편 95:5)\n\n그리고 나는 아름다운 해변을 보았지만 그보다 더 아름다운 나를 향한 주님의 마음을 바라보게 되었습니다.\n\n2.붉은 사암이 오랜 시간의 흔적을 품은 채 만들어 낸 신비로운 협곡을 걸었습니다. 마치 누군가 정교하게 조각해 놓은 듯한 바위의 곡선과 좁은 틈 사이로 열린 푸른 하늘이 경이롭게 다가왔습니다.\n\n좁고 깊은 협곡 안에서는 앞이 잘 보이지 않았지만, 고개를 들자 그 사이로 하늘이 열려 있었습니다. 우리의 삶도 때로는 앞이 보이지 않는 좁은 길처럼 느껴지지만, 말씀을 따라 걸어가다 보면 하나님께서 열어 놓으신 하늘과 새로운 길을 만나게 됨을 깨닫게 됩니다.\n\n3.믿음을 지키기 위해 이곳에 삶의 터전을 마련했던 초기 그리스도인들의 흔적을 바라봅니다.\n오래된 바위에 남겨진 믿음의 흔적을 바라보며 나 역시 어떤 상황에서도 말씀을 삶에 새기며 살아가는 사람이 되기를 기도했습니다.", "ids": ["17ZyHHGZivDvATWlGimDXejjb80YMjC2I", "1ckwQUeED_3gndqxIPj6SYcO0CGkqANeC", "1-9bVYpexESvKE9AnSPwmSeTDedZ2Mmcm"], "files": []}, {"n": 91, "ts": "2026. 8. 16 오후 1:34:30", "name": "김건호", "church": "선한목자교회", "ours": true, "title": "평안", "place": "스위스 인터라켄", "when": "2026년 7월", "story": "긴 여행 중 관계에서 힘든 순간 주님이 창조하신 대자연을 보며 치유받고 평안함을 느꼈어요", "ids": ["1W2g2RD6r4eeFSb9KACTkt-vs_qNuC3Yv", "16hIF8K-xzyh8s-R7nZ3SEkIQzRo_pTwb", "1kwU7_iVH1qlVLX2DEKlT6UaJK75mYIJS"], "files": []}, {"n": 92, "ts": "2026. 8. 16 오후 3:44:57", "name": "임다정", "church": "선한목자교회", "ours": true, "title": "주님이 창조한 대자연", "place": "스위스", "when": "2026년 7월", "story": "주님이 창조한 대자연 속에서 큰 은혜를 느낌", "ids": ["1uR7g2g0uFx4NI75I7_UHkszi9i9LaKjR", "1H1BCFN98mwr6nsVY9wobbcTSM-3_CMu2", "1oPWOgWKj2k1FVqJA26PlQLKK50o0hVI3"], "files": []}, {"n": 93, "ts": "2026. 8. 17 오전 3:58:06", "name": "김동영", "church": "선한목자교회", "ours": true, "title": "말씀함께 가족과 함께", "place": "대천해수욕장", "when": "2026.08.14.", "story": "아이들은 꿀땅으로 부모는 말씀함께로 가정예배로 하나되며 어디든 주님과 동행함을 나타냅니다.", "ids": ["1NPAqgKY-_GT-VcBOEddXpeqLg9s_SdJV"], "files": []}, {"n": 94, "ts": "2026. 8. 17 오전 7:02:21", "name": "방다은", "church": "선한목자교회", "ours": true, "title": "풍성의 길/높은 곳에 다니게 하심/명성산의 그늘 아래", "place": "여주시/명성산", "when": "2024.11.05./2025.10.25.", "story": "다윗공동체 체움셀과 함께 가을 은행나무 숲속에서 그간의 신앙의 여정을 돌아보며 자연속에서 하나님이 주신 말씀과 최근 묵상등을 나누었습니다. 계절의 변화와 하나님의 창조의 신비를 누리고 만끽하는 주님과 함께한 오늘이었습니다.  \n“이는, 너희로 하여금, 위로를 주는 예루살렘의 품에서 젖을 빨아 배부르게 하고, 또한 너희로 하여금, 풍요한 젖을 빨아들여 기쁨을 누리게 하려 함이다.”\n‭‭이사야서‬ ‭66‬:‭11‬\n\n두번째와 세번째 사진은 등산셀에서 명성산을 오르며 억새를 본후 조망기도를 하였습니다. 좋은 날씨와 함께 오를 수 있는 산을 허락해주신 것에 감사하며, 예수님을 따르는 것과 비슷한 산을 오르고 내림이 우리의 믿음의 인생과 같음을 고백하며 고난 중에도 주님을 바라보고 신실하게 살아갈 수있도록 기도하였습니다.", "ids": ["1W0dEvatOpoVO21TCiSmMijb6vICfb0t4", "1aTZMXSPIyiIRKdNrozkkUGvOxmazFipe", "1fobK4OnzxZdoKSL-LGv3gmtKLs1Fpzu2"], "files": []}, {"n": 95, "ts": "2026. 8. 17 오후 2:59:06", "name": "김유정", "church": "선한목자교회", "ours": true, "title": "1.빛과 어둠/2.청량한 하늘과 십지가/3.대화", "place": "1.이탈리아 피렌체 아르노강/2.군산시 구암교회/3.서귀포시 신례리 카페숑", "when": "1.2012년 8월 27일/2.2023년 10월 4일/3.2024년 12월 17일", "story": "[창1:4-5]\n4 빛이 하나님이 보시기에 좋았더라 하나님이 빛과 어둠을 나누사\n5 하나님이 빛을 낮이라 부르시고 어둠을 밤이라 부르시니라 저녁이 되고 아침이 되니 이는 첫째 날이니라\n\n1. 내일에 빛으로 가기 위한 오늘의 밤을 맞이합니다.\n2. 하나님의 크신 사랑으로 내가 저 하늘과 십자가 은혜를 누리고 있음을 고백합니다.\n3. 주님과 오늘의 하루를 이야기하고 싶습니다.", "ids": ["1naPlyWYUTeN24fMW1e8uq6EN0-Sj3OBh", "1At3NFT6ntelwk_w-dhMtRt5O5cU-mXOj", "1v357KLYuR0zgobQcfnzbVgAtBLwCrbGN"], "files": []}, {"n": 96, "ts": "2026. 8. 18 오후 9:30:04", "name": "김유리", "church": "선한목자교회", "ours": true, "title": "주 안에서 하나되는 공동체", "place": "평창 발왕산", "when": "2026.08.17", "story": "말씀안에서 주님과 하나되고 성도가 하나됨", "ids": ["1rBHLn1EFeE0EhbUndmzVI6oUvHQ5KXGb"], "files": []}, {"n": 97, "ts": "2026. 8. 19 오후 1:42:17", "name": "백민기", "church": "선한목자교회", "ours": true, "title": "존귀한 자", "place": "남한산성 행궁", "when": "2026년 7월", "story": "하찮게 여겨지는 들풀도 하나님의 사랑을 받고 자랍니다. 세상 속에서의 나도 미미한 존재겠지만 하나님께서 나에게 보배롭고 존귀한 자라고 말씀하셨습니다.\n\n(이사야43:4) \n*네가 내 눈에 보배롭고 존귀하며 내가 너를 사랑하였은즉 내가 네 대신 사람들을 내어주며 백성들이 네 생명을 대신하리니*", "ids": ["19vxFJIaTR8RLheNHIYjSELarOVo4HNhb"], "files": []}, {"n": 98, "ts": "2026. 8. 19 오후 6:06:59", "name": "유민하", "church": "선한목자교회", "ours": true, "title": "복음이 시작된 땅에서 주님의 일하심을 보다", "place": "평화전망대", "when": "2026년 8월", "story": "처음 복음이 전해진 땅에서 주님의 말씀이 이어져 온 역사를 돌아보며, 그 은혜를 마음에 새기고 오늘을 믿음으로 살아가길 바랍니다.", "ids": ["1WRzYT19iGml_BqGrHb-ZNFyGq_eHk5R2", "1xDWKnuP5uwiOwwwRXiGeVIGBRJoq_Wev", "1PPQ3B-lHEF-LthqL0k0D-PDpSJV4Nowt", "1bueurPgKsng-VZzNEicec7Ks5OCMiujM", "1aFhaABwEFr_SFJTYdS83FkYM5XUnwXzh"], "files": []}, {"n": 99, "ts": "2026. 8. 19 오후 6:18:34", "name": "유민하", "church": "선한목자교회", "ours": true, "title": "철원에 심겨진 소망", "place": "철원 소이산 전망대", "when": "2025년 9월", "story": "말씀과 함께 주님을 묵상하며, 철원에 심겨진 소망을 바라봅니다.", "ids": ["1EwR8l8qpBAN6YYjY6jwwHeLhr2XhW0oH", "1CBmVSTSZtf8-z-3DgvmwRQiYM5GkTDhm", "1dtrz0_IFy1G3X_W1Zt9UC1VH2jA7SqTs", "1oE7zSmkilGg8yk2DUS4s5PpM-QSZrfCM", "1dn5mOvo-iAnYnud7qiMSJGZ4XBCwkVBJ"], "files": []}, {"n": 100, "ts": "2026. 8. 19 오후 7:33:51", "name": "김리사", "church": "선한목자교회", "ours": true, "title": "십자가", "place": "선한목자교회 마가다락방 기도실", "when": "2022년 10월 5일", "story": "모든 해답은 십자가 안에. 말씀이신 예수님만이 오늘 내게 일어나는 내,외부의 모든 상황가운데 마땅히 가야할 길로 가르치시고 인도하십니다. 그래서 매 순간 십자가앞에 서서 말씀안에 있는가.. 예수님이 기뻐하시는가 그것만이 유일한 삶의 기준입니다.", "ids": ["1xDQNoaB948vA_b_A7iivouNpfClIR0g8"], "files": []}, {"n": 101, "ts": "2026. 8. 20 오전 2:49:38", "name": "남금희", "church": "선한목자교회", "ours": true, "title": "남금희", "place": "집", "when": "2025 가을", "story": "제목 obedience(순종)\n시몬에게 이르시되 깊은 데로 가서 그물을 내려 고기를 잡으라 눅5:4\n\n직접 제작한 작품입니다\n\n베드로가 예수님 말씀에 순종하여 그물을 던지니 물고기가 가득 잡힌 내용을 나타낸 작품입니다", "ids": ["1G-IPmmjrMYvoMsQx5hg-b4nTTG8rquGo"], "files": []}, {"n": 102, "ts": "2026. 8. 22 오후 3:23:38", "name": "김초록", "church": "선한목자교회", "ours": true, "title": "천지창조/광야/One Way", "place": "미국 그랜드캐년, 데스밸리", "when": "2017년 3월", "story": "말씀으로 세상을 지으신 하나님을 따라가는 우리의 모습들", "ids": ["1qnyNg6tPKfwYtlft_bi31t-3bEutyqIU", "1Pz-hDsL8-h2qG2ibB5sCi4cWkrkh3FMm", "19jdn44T9QWMsJusxCc75uGKlNegsY75o"], "files": []}, {"n": 103, "ts": "2026. 8. 22 오후 3:30:44", "name": "전영", "church": "선한목자교회", "ours": true, "title": "하나님의 손길", "place": "앤텔로프캐년", "when": "2017년 3월 28일 화요일", "story": "토기장이 하나님께서 우리를 빚어가듯이 자연 구석구석 섬세하게 만들어 놓으셨어요", "ids": ["1Q_yF4zO4BY7nPvK4ocklURYoyMXwS-RI", "1WwFt2KTBB6_oS4R26Y4bWFYrOHQ2xrzk", "1pRO_L5NaUYjDjuS3ZWN88MJzyoSwo4gr"], "files": []}, {"n": 104, "ts": "2026. 8. 22 오후 5:44:18", "name": "문형태", "church": "선한목자교회", "ours": true, "title": "양떼구름", "place": "비행기", "when": "2019년 11월", "story": "세상에 살다보면 힘든일 어려운일이 있을때도 있지만, 주님의 시선으로 한발짝 떨어진곳에서 보면 그모습은 다르게 보일수 있을것 같습니다. 주님의 시선으로 말씀의 시선으로 하루 하루를 살아가는 우리가 되길 원합니다", "ids": ["1Lms5hONmrAUgmnwIH0ZFf9h08kbLxCGE"], "files": []}, {"n": 105, "ts": "2026. 8. 22 오후 5:50:43", "name": "문형태", "church": "선한목자교회", "ours": true, "title": "덮어주심", "place": "아버지 집앞", "when": "2024년 2월", "story": "아버지 집앞에 화단이 있는데 관리를 안해서 많이 지저분 했습니다. 치워드리지 못해서 죄송했는데 주님이 눈으로 덮어주셨습니다. 눈밑에는 여전히 지저분하지만 보이는건 눈만 보입니다. 나는 죄인이지만 주님의 보혈의 피가 사랑으로 나를 덮어주셨기에, 죄인에서 의롭다 칭함을 받는 내가 됨에 감사합니다.", "ids": ["1NLwORzsUamH8_Q6juzhlAd1EHjfXZPVf"], "files": []}, {"n": 106, "ts": "2026. 8. 22 오후 6:01:10", "name": "문형태", "church": "선한목자교회", "ours": true, "title": "매화꽃", "place": "아버지 집앞", "when": "2021년 3월", "story": "매화의 꽃말은 고결한 마음, 기품, 결백, 인내, 품격 입니다. 말씀함께를 통해 하루 하루를 살아가는 구별된 마음가짐을 얻게될것입니다. 매화꽃이 지면 매실 열매가 열리듯, 우리의 이런 하루하루의 말씀과 마음이 모여 나는 죽고 예수님과 동행하는 열매를 맺길 원합니다", "ids": ["15FVxIORxj9csmmxqP82ohsopRPlFe__K"], "files": []}, {"n": 107, "ts": "2026. 8. 22 오후 6:08:08", "name": "김정미", "church": "선한목자교회", "ours": true, "title": "붉은노을", "place": "출장간 바닷가", "when": "2022년 9월", "story": "말씀함께로 시작한 하루의 말씀은 치열한 삶을 살아가는 우리들에게 하루를 살아갈 힘이 됩니다. 그렇게 살다보며 하루를 마감할때 우리에게 붉은 노을과 같은 따뜻한 위로와 평안을 선물로 주시는 주님을 찬양하게됩니다.", "ids": ["15ntBhhv98J-ISEjA_8GbrY-BMj3_5AfE"], "files": []}, {"n": 108, "ts": "2026. 8. 22 오후 6:13:00", "name": "김정미", "church": "선한목자교회", "ours": true, "title": "깨끗함", "place": "베트남 해변", "when": "2018년 10월", "story": "주님이 만드신것들은 저 바다위 구름처럼 깨끗합니다. 우리도 주님이 깨끗하고 정결하게 만드셨는데 죄가 우리를 그렇게 못하게 만듭니다. 말씀이신 주님을 통해서만 죄의자리를 벗어날 수 있습니다. 주님이 나를 깨끗케 하십니다.", "ids": ["1s4lHjjIB4CfXFcV3GAZxmEU23N64n3uw"], "files": []}, {"n": 109, "ts": "2026. 8. 22 오후 6:18:45", "name": "김정미", "church": "선한목자교회", "ours": true, "title": "봄", "place": "제주도 유채꽃", "when": "2023년 4월", "story": "완벽한 4계절을 주신 주님. 유채꽃을 통해 계절의 흐름을 알려주시며 주님의 창조의 손길을 명확히 느끼게 하심 감사합니다. 어찌그리 아름다운지요! 완벽한 4계절처럼 완전하신 주님이 우리에게 매일 말씀하셔서 주님의 살아계심을 느끼며 살아내는 증인으로 삶 살아가길 원합니다.", "ids": ["13gxh7m0m_OuM-OEXP8OjnOAe530MQyCA"], "files": []}, {"n": 110, "ts": "2026. 8. 22 오후 9:06:40", "name": "한태현", "church": "선한목자교회", "ours": true, "title": "여행중에 촬영", "place": "하와이.maui(마우이섬)", "when": "2026.7월경", "story": "교회사진(마우이섬 원주민 교회로 한달에 한번정도 모여 예배하는곳. 언제나 전 \"말씀함께\"책을 소지하고 다니면서 온라인으로 새벽기도시간을 지킵니다.)석양사진(주님의 오묘한 창조의 상황으로 은혜와 감동을 받아 기록에 남기고 싶었어요)", "ids": ["1R77W6CFF3tYlJ0ARDQtceWneXsflsquS", "1lbL4h4WAD9M3PNzZ3bHMVytzFjPIDi6J", "1M6ObU16Ffxw8urzTli_0a-gJDO2HGQLu"], "files": []}, {"n": 111, "ts": "2026. 8. 23 오전 8:17:58", "name": "엄도영", "church": "선한목자교회", "ours": true, "title": "비오는 주일의 숲", "place": "서울숲", "when": "2025.08.03", "story": "푸르게 우거진 나무들이 하늘을 향해 뻗어 있는 모습처럼, 우리의 믿음도 말씀을 통해 날마다 주님을 향해 깊어지고 자라나길 소망하는 마음이 담겨 있음.", "ids": ["12yWqLFS4huBVVRBX4J5uxoYQieCdMxpU"], "files": []}, {"n": 112, "ts": "2026. 8. 23 오전 9:14:32", "name": "한정진", "church": "선한목자교회", "ours": true, "title": "비행기 밖의 일출", "place": "비행중인 비행기 안", "when": "2024년 7월", "story": "하나님이 창조하신 자연속에서 비추는 생명의 빛", "ids": ["1daWxQ8nXD-RWctonPmjZB_cDPgmwMd2H"], "files": []}, {"n": 113, "ts": "2026. 8. 23 오전 9:51:19", "name": "황정호", "church": "선한목자교회", "ours": true, "title": "하나님 만드신 하늘", "place": "용인 석성산", "when": "2026년 여름", "story": "온 우주만물을 창조하시고 운행하시는 주넴을 찬양합니다.", "ids": ["1P7jvpZWfW0Y6GluVRuSLpUMxPzxTDod-"], "files": []}, {"n": 114, "ts": "2026. 8. 23 오전 11:19:09", "name": "박아연", "church": "선한목자교회", "ours": true, "title": "일상위에 나타내신 약속", "place": "남양주 집", "when": "2026.08.22", "story": "비가 지나간 어느 날, 창밖으로 평범한 일상을 바라보다 도시 위에 선명하게 떠오른 무지개를 만났습니다.\n\n매일 보던 아파트와 산, 익숙한 풍경이었지만 그날만큼은 하나님께서 펼쳐 놓으신 한 폭의 그림처럼 느껴졌습니다. 비와 먹구름이 지나간 자리에 무지개가 떠오르듯, 우리의 삶에도 힘들고 흐린 시간이 지나면 하나님께서 준비하신 은혜의 순간이 있음을 다시 생각하게 되었습니다.\n\n특별한 곳이 아니어도, 평범한 하루 한가운데에서도 하나님은 당신의 신실하심을 보여 주신다는 것을 기억하고 싶어 이 순간을 사진에 담았습니다.\n\n“내가 내 무지개를 구름 속에 두었나니 이것이 나와 세상 사이의 언약의 증거니라”\n— 창세기 9장 13절", "ids": ["1F1Wzzln971WCnNc9gTQ4ykz8nfsYOrsW"], "files": []}, {"n": 115, "ts": "2026. 8. 23 오후 1:15:42", "name": "김지원", "church": "선한목자교회", "ours": true, "title": "산", "place": "지리산", "when": "2026.08.02", "story": "이 사진을 볼 때면 어떻게 자연이 이렇게나 아름다울 수 있을까, 라는 생각이 들면서 하나님께서 세상을 창조하셨다는 사실을 실감하게 됩니다. 덕분에 성경의 첫 시작인 창세기에서 하나님께서 세상을 창조하시는 부분을 다시 한 번 곱씹게 되더라고요. 그래서 이 사진은 오늘도 말씀과 함께할 수 있도록 도와준다고 생각합니다.", "ids": ["1Fc0bi676f0GpFFYFjpHYkDfDnKTPTFaI"], "files": []}, {"n": 116, "ts": "2026. 8. 23 오후 2:44:20", "name": "정영호", "church": "선한목자교회", "ours": true, "title": "일터에서 바라본 십자가/ 창밖의 풍경/ 숲속", "place": "사무실/ 교회가는 길 / 숲속", "when": "2026.08.08 / 2026.08.12 /2026.08.11", "story": "일터에서 말씀함께 묵상과 늘 임재하시는 하나님", "ids": ["14yo_a73HR22bTXYJlBSKzvaCB6CADnMJ", "171RJsC4dtOETeDxxce23jxEYNvOTA969", "1LpxhoXXPrRapV_Ki2mRWqQYz3faH97RB"], "files": []}, {"n": 117, "ts": "2026. 8. 23 오후 8:03:52", "name": "김회모", "church": "선한목자교회", "ours": true, "title": "행복의 시작 예수 그리스도", "place": "복정역", "when": "26년 8월 22일", "story": "너희는 만민에게 복음을 전파하라 라는 말씀이 생각납니다. 연세 많으신 집사님께서 매주 신실하게 전도지를 나누어 주시는 모습이 그 말씀을 삶으로 보여주시는 것 같습니다", "ids": ["1ThOaOkKTIYjAYXdb5ik5XiTgXNMuHHQt"], "files": []}, {"n": 118, "ts": "2026. 8. 23 오후 9:23:04", "name": "이미혜", "church": "선한목자교회", "ours": true, "title": "“갈라진 내 영혼 위에 새겨진 십자가”", "place": "산책하면서 찍음.(정확히 기억나지 않음)", "when": "24.3.7", "story": "삶에서 가장 어려운 때, 고통의 터널을 지나던 시기가 있었습니다. 그저 살기 위해 산책을 하며 어떻게든 십자가를 붙들고자 찾고 또 찾았습니다. 눈에 들어오는 모든 것 속에서 십자가를 찾아 헤매던 때였습니다.\n\n메마르고 갈라진 돌길, 그 단단한 표면 위로 십자가가 선명하게 새겨져 있습니다. 마치 나의 죄와 상처로 갈라지고 굳어진 마음의 밭.  그런 저에게 주님은 나의 그 어떤 메마름도 외면하지 않으시고, 가장 단단하게 굳어진 그 자리 위에 당신의 십자가를 바라보게 하셨습니다. 나의 모든 상처와 고통을 주님의 고난으로 덮어주시고, 그 갈라진 틈 사이로 주님의 생명수를 흘려보내 주셨습니다. 메마른 땅에 새겨진 이 십자가는, 내가 어떠한 상태에 있더라도 나를 끝까지 포기하지 않으시는 하나님의 깊은 십자가사랑을 보여줍니다. 나의 굳은 마음을 부드럽게 하시고, 십자가 앞에 갈라지고 상처난 나를 어루만져\n주셨습니다.", "ids": ["1u02cTZLnEcHK6eZ3kvdYW4wqGS7ZM9yF"], "files": []}, {"n": 119, "ts": "2026. 8. 23 오후 9:44:06", "name": "이미혜", "church": "선한목자교회", "ours": true, "title": "​“내 삶의 버거운 짐을 안고 엎드린 그 자리, 십자가를 만났습니다.”", "place": "세곡천 산책길", "when": "24.5.어느날", "story": "세곡천을 산책하기 위해 내려가고자 할 때 비탈에 서 있는 낡고 해진 나무 울타리. 그저 경사를 받치고 서 있던 무심한 나무 기둥이었지만, 주님은 그곳에서 제게 당신의 십자가를 보게 하셨습니다. 세월의 흔적이 고스란히 남아 있는 그 기둥 앞에서, 나를 위해 기꺼이 낮아지시고 고난을 참아내시며 십자가를 지셔야만 했던 주님의 모습이 overlapping되어 한동안 그 자리에 주저앉아 눈물을 흘렸습니다.\n​\"주님, 제 삶의 무게가 너무나 버겁습니다\" 하며 울며 나아간 그 길에서, 주님은 낡은 나무 울타리의 형상으로 저를 기다리고 계셨습니다. 나의 죄와 깊은 고통을 가슴에 안으시고 당신의 생명까지 아낌없이 내어주신 무한한 사랑. 그 한없는 사랑이 버거워 짓눌려 있던 제 마음을 부드럽게 감싸 안아주셨습니다.\n​이 낡은 기둥의 십자가를 통해 날마다 나를 살리시는 주님의 음성을 듣습니다. 나를 위해 기꺼이 낮아지신 그 은혜를 기억하며, 이제는 저도 제 십자가를 지고 겸손히 주님의 발자취를 따라 걸어가길 소망합니다.", "ids": ["16ijvxMqOUEEFKwEsI3VBsNfwX7ej-53J"], "files": []}, {"n": 120, "ts": "2026. 8. 23 오후 10:06:36", "name": "유미애", "church": "선한목자교회", "ours": true, "title": "민둥산 돌리네 연못", "place": "정선 민둥산", "when": "2026년 6월 6일", "story": "정선 국내 단기 선교 때 팀원 분들과 민둥산을 등반하면서 등산객들에게 전도를 했었는데 등산이 힘들지 않게 느껴졌었고, 말씀으로 지으신 하나님의 세계를 모두 함께 바라보면서 감탄할 수 있음에 감사함을 느꼈다.", "ids": ["1sg5q9KjXTE-ZBaN2Jd59JDv4wzgs-eaS"], "files": []}, {"n": 121, "ts": "2026. 8. 23 오후 10:12:57", "name": "서단비", "church": "선한목자교회", "ours": true, "title": "시간이 빚어낸 마음", "place": "대만 예류의 하트바위", "when": "2019년 8월", "story": "오랜 시간 바람과 파도에 깎이며 하트 모양을 이루게 된 대만 예류의 하트바위입니다. 바람과 파도가 긴 시간 바위를 다듬어 사랑의 모습을 만들어냈듯, 말씀과 함께한 오늘들이 쌓여 하나님의 사랑을 닮아가기 원합니다.", "ids": ["11kuVi2XAyZFWBxSbEegoVHx5SGPOXahF"], "files": []}, {"n": 122, "ts": "2026. 8. 23 오후 10:18:19", "name": "서단비", "church": "선한목자교회", "ours": true, "title": "깊어지는 계절", "place": "연천", "when": "2021년 10월", "story": "계절이 깊어지며 초록에서 붉은빛으로 물든 댑싸리의 풍경입니다. 시간이 흐르며 댑싸리가 저마다의 빛깔로 물들어가듯, 우리의 삶도 매일 마주하는 말씀을 통해 조금씩 새로운 빛깔로 물들어갑니다. 말씀과 함께한 오늘들이 차곡차곡 쌓여, 우리만의 깊은 빛깔이 되어가기를 바라는 마음을 담았습니다.", "ids": ["1Pa7s6GioNg8PeYe2D05hCA11xllD2ZtK"], "files": []}, {"n": 123, "ts": "2026. 8. 23 오후 10:22:39", "name": "서단비", "church": "선한목자교회", "ours": true, "title": "푸른 풀밭으로 이끄시며", "place": "대관령 양떼목장", "when": "2021년 9월", "story": "“그가 나를 푸른 풀밭에 누이시며 쉴 만한 물가로 인도하시는도다.” (시편 23:2)\n\n푸른 초원 위에서 한가로이 풀을 뜯는 양들의 모습을 바라보며 시편 23편의 말씀을 떠올렸습니다. 목자의 돌봄 안에서 평안히 머무는 양들처럼, 우리도 말씀 안에서 쉼을 얻고 다시 걸어갈 힘을 얻습니다. 하루의 분주함을 내려놓고, 우리를 푸른 풀밭으로 이끄시는 말씀 곁에 머무는 평안한 시간을 담았습니다.", "ids": ["1IQxLso9CZmM_S79gbRnAodT1hGkkAjBN"], "files": []}, {"n": 124, "ts": "2026. 8. 23 오후 10:31:44", "name": "서송이", "church": "선한목자교회", "ours": true, "title": "다시, 피어나는 봄", "place": "성내천 집앞", "when": "2026년 4월", "story": "긴 겨울 동안 움츠려 있던 가지 끝에 다시 벚꽃이 피었습니다. 매일 걷던 평범한 성내천의 길에서 마주한 봄의 풍경은, 추운 계절을 지나 다시 찾아오는 생명의 아름다움을 보여줍니다. 우리의 삶에도 때로는 겨울처럼 춥고 움츠러드는 시간이 있지만, 말씀과 함께 그 시간을 지나고 나면 어느새 새로운 소망이 피어납니다. 평범한 오늘 속에서도 다시 피어나게 하시는 하나님의 은혜를 떠올리며 담은 장면입니다.", "ids": ["1A3InATAmCTVCXHOyEsJj94LnFlEHtHzP"], "files": []}, {"n": 125, "ts": "2026. 8. 23 오후 10:35:15", "name": "서송이", "church": "선한목자교회", "ours": true, "title": "하늘이 그의 영광을 말하다", "place": "스위스 피르스트", "when": "2022년 9월", "story": "가족과 함께한 스위스 피르스트 여행에서 마주한 풍경입니다. 끝없이 펼쳐진 하늘과 눈 덮인 거대한 산 앞에 서니, 자연의 아름다움을 넘어 이 모든 것을 지으신 하나님의 크심을 느끼게 되었습니다.\n\n“하늘이 하나님의 영광을 선포하고 궁창이 그의 손으로 하신 일을 나타내는도다.” (시편 19:1)\n\n말씀으로 만나던 하나님의 위대하심을 눈앞에 펼쳐진 자연을 통해 다시금 느꼈던 순간을 담았습니다.", "ids": ["1bk-mERRUDnAXAEmbCt5oxmeXQPsg7fRY"], "files": []}, {"n": 126, "ts": "2026. 8. 23 오후 10:43:14", "name": "박소연", "church": "선한목자교회", "ours": true, "title": "주의말씀은 내발의 등이요 내길의 빛이니이다", "place": "익선동", "when": "2026년 3월(봄)", "story": "우거진 길 사이에 한줄기 빛이 보여서 그 빛이 주님이 제 인생의 길을 보여주시는 등불로 보였습니다", "ids": ["12ev8220xiN3dj2SXQ7fbWw6uQIbQd-4c"], "files": []}, {"n": 127, "ts": "2026. 8. 23 오후 10:51:48", "name": "이미혜", "church": "선한목자교회", "ours": true, "title": "바위 위의 십자가", "place": "세곡동 아파트 단지", "when": "24.7", "story": "거칠고 단단한 바위 표면 위로, 하얀 십자가 자국이 선명하게 새겨져 있습니다. 오랜 세월을 견뎌온 바위처럼, 하나님의 사랑과 약속은 변함없이 나를 지켜주십니다. 주님은 나의 반석이시며, 피난처이시며, 구원이십니다. 이 바위 위의 십자가는, 내가 삶의 파도에 흔들릴 때에도, 주님의 사랑은 변치\n않으시며 주님을 의지하며 나아갈 때 이겨낼 수 있음을 보여줍니다. 나의 믿음이 단단한 반석 위에 세워져, 어떤 시련에도 흔들리지 않길 원합니다.", "ids": ["1CtgCPHrfz8eRsh-rS4QQmwb7KhYRkA1L"], "files": []}, {"n": 128, "ts": "2026. 8. 23 오후 10:53:37", "name": "서송이", "church": "선한목자교회", "ours": true, "title": "내 안의 성전", "place": "스페인 그라나다 나스리 궁전", "when": "2025년 3월", "story": "해발 약 740m의 언덕 위에 이렇게 넓고 정교한 성이, 그것도 수백 년 동안 사람들의 손길로 유지되어 왔다는 사실에 두 번 세 번 놀랐습니다. 두 시간을 정신없이 돌아도 다 보지 못할 만큼 넓은 이곳의 벽 하나, 기둥 하나까지 누군가는 정성으로 새기고, 또 누군가는 그것을 오랜 세월 지켜왔습니다.\n그런데 문득 이런 생각이 들었습니다. 성경은 우리 마음을 '성전'이라 부릅니다(고린도전서 6:19). 돌로 된 성전도 이렇게 땀 흘려 지켜왔는데, 나는 정작 내 안의 성전은 얼마나 정교하게, 얼마나 정성껏 돌보고 있었을까요. 오늘 하루, 말씀 앞에서 그 질문을 다시 마주합니다.", "ids": ["1fcplx4UiVg3B2jWsB_ZuQjcgFlcEJ23x"], "files": []}, {"n": 129, "ts": "2026. 8. 23 오후 11:11:16", "name": "이예찬", "church": "선한목자교회", "ours": true, "title": "감사로 물든 하루", "place": "속초해수욕장", "when": "2026.05", "story": "속초해수욕장에서 만난 핑크빛 노을입니다. 하루를 마무리하며 바라본 아름다운 하늘에 자연스럽게 감사한 마음이 들었습니다. 매일 당연하게 지나치는 풍경도 하나님께서 주신 선물임을 기억하며, 오늘 주어진 하루에 감사하고자 합니다.", "ids": ["1aGqrEVAThyQdXqQJab4-W7DWrqST09M3"], "files": []}, {"n": 130, "ts": "2026. 8. 23 오후 11:14:04", "name": "이예찬", "church": "선한목자교회", "ours": true, "title": "하루의 끝에서", "place": "여수", "when": "2025.08", "story": "여수에서 바라본 해질녘 풍경입니다. 하루를 밝히던 해가 저물어가는 모습을 보며, 오늘 하루도 무사히 지나왔음에 감사했습니다. 하루의 시작부터 끝까지 모든 순간 함께하시는 하나님의 은혜를 기억합니다.", "ids": ["1IC0_eLN3jbFZOKQue-sT_asUwdQMbUhC"], "files": []}, {"n": 131, "ts": "2026. 8. 23 오후 11:16:00", "name": "이예찬", "church": "선한목자교회", "ours": true, "title": "보이지 않아도", "place": "묵호", "when": "2026.05", "story": "안개가 짙게 내려앉은 묵호의 바다입니다. 안개 때문에 먼 곳은 잘 보이지 않았지만, 그 너머에도 바다는 그대로 이어져 있었습니다. 우리의 앞길이 선명하게 보이지 않을 때에도 하나님을 믿고 오늘의 한 걸음을 내딛고자 합니다.", "ids": ["16YBRvWhvqU_fYB1Dyy24sx-KwXJJV29J"], "files": []}, {"n": 132, "ts": "2026. 8. 24 오전 1:25:04", "name": "최원빈", "church": "선한목자교회", "ours": true, "title": "하나님의 보석바다", "place": "오하우섬", "when": "25년 9월 29일", "story": "하와이 여행 당시 오전 말씀함께를 묵상한 뒤 여행지의 바다를 바라보았습니다. 하나님께서 지으신 아름다운 바다는 마치 수많은 보석을 흩뿌려 놓은 듯 찬란하게 빛났고, 그 광경을 바라보는 것만으로도 큰 감동이 밀려왔습니다. 자연을 통해 하나님의 위대하심과 아름다우심을 다시금 깊이 느끼며 감사가 넘치는 시간이었습니다.", "ids": ["1lEXVbOwEOXZ_j5z-tDgzyxsIgRWClmXh"], "files": []}, {"n": 133, "ts": "2026. 8. 24 오전 1:28:13", "name": "최원빈", "church": "선한목자교회", "ours": true, "title": "허락하신 하루", "place": "하와이 오하우섬", "when": "2025년 9월 29일", "story": "아내와 함께한 하와이 여행에서도 매일 말씀함께를 묵상했습니다. 새벽 6시, 수평선 너머로 떠오르는 해를 바라보며 오늘이라는 하루를 허락하신 주님의 은혜에 감사드리는 시간을 가졌습니다. 변함없이 떠오르는 태양처럼 신실하게 우리를 붙드시고 새로운 은혜를 베푸시는 하나님을 묵상하며, 여행의 기쁨보다 하나님과 동행하는 기쁨이 더 크다는 것을 다시 한번 깨닫는 시간이었습니다.", "ids": ["10Yg6d3sNwDg_l_2K29TAdjunbBDKMGjj"], "files": []}, {"n": 134, "ts": "2026. 8. 24 오전 1:33:34", "name": "최원빈", "church": "선한목자교회", "ours": true, "title": "일몰속 바다아이", "place": "하와이 오하우섬", "when": "2025년 9월 29일", "story": "해가 지는 바다를 보며 아침에 묵상했던 말씀함께로 인해 주님의 시선으로 하루를 돌아보니 같은 풍경도 전혀 다르게 보였습니다. 사진 속 바다에서 놀고 있는 아이를 보며, 하나님께서 그 아이를 단순한 여행객이 아니라 복음을 이어갈 다음세대로 바라보게 하셨습니다. 그 모습을 통해 우리의 사명이 오늘의 삶에만 머무는 것이 아니라, 다음세대가 하나님을 알고 예배하는 세대를 세우는 데 있음을 다시금 깨닫게 되었습니다. 아름다운 풍경보다 그 안에 담긴 하나님의 마음을 보게 하신 은혜에 감사한 하루였습니다.", "ids": ["1MAwECMFtX0fN1yIifHX2v5Ljh-oFP7Y-"], "files": []}, {"n": 135, "ts": "2026. 8. 24 오후 1:21:29", "name": "김남임", "church": "선한목자교회", "ours": true, "title": "말씀으로피어나는 은혜", "place": "상암 평화공원", "when": "2025년 5월", "story": "곧게 자란 나무 아래 아름답게 피어난 꽃들처럼, 하나님의 말씀에 뿌리내린 삶마다 풍성한 은혜와 기쁨이 피어남을 담았습니다.", "ids": ["1wSIffK0LWgUomdSI0sty10RwG7L-zQZB"], "files": []}, {"n": 136, "ts": "2026. 8. 24 오후 1:25:34", "name": "김남임", "church": "선한목자교회", "ours": true, "title": "말씀을 따르는 믿음의 항해", "place": "경기 평택항", "when": "2023년 7. 21", "story": "넓은 바다를 지나 목적지를 향해 나아가는 배처럼, 하나님의 말씀을 길잡이 삼아 믿음으로 인생의 항해를 이어가는 모습을 담았습니다.", "ids": ["1MPlf0QGYbq2teMGDhuIbXOThFQ7RH1Sh"], "files": []}, {"n": 137, "ts": "2026. 8. 24 오후 1:29:01", "name": "김남임", "church": "선한목자교회", "ours": true, "title": "안개 속에서도 피어나는 소망", "place": "양주 나리공원", "when": "2024년 7월 2일", "story": "앞이 보이지 않는 안개 속에서도 아름답게 피어난 보랏빛 꽃들처럼, 하나님의 말씀은 불확실한 삶의 순간에도 소망을 피어나게 하십니다.", "ids": ["1PAxvBLZAyPL64S3qLnyFyk-ZmaGTsIo0"], "files": []}, {"n": 138, "ts": "2026. 8. 24 오후 1:40:05", "name": "정제균", "church": "선한목자교회", "ours": true, "title": "고요한 물가의 쉼", "place": "전북 익산 옥정호 붕어섬", "when": "2026년 5.15 봄날", "story": "잔잔한 물가에 머문 작은 배처럼, 분주한 삶을 잠시 내려놓고 하나님의 말씀 안에서 참된 쉼과 평안을 누리는 모습을 담았습니다.", "ids": ["1q9_dMVIbb_CZoPizIxeLqoHpQDmQdCCO"], "files": []}, {"n": 139, "ts": "2026. 8. 24 오후 1:44:11", "name": "정제균", "church": "선한목자교회", "ours": true, "title": "빛을 향한 날갯짓", "place": "평택항", "when": "2023년 7. 21", "story": "저물어 가는 햇빛을 향해 힘차게 날아가는 새들의 모습처럼, 하나님의 말씀을 따라 소망을 품고 믿음으로 나아가는 삶을 담았습니다.", "ids": ["1tHqFdYC7lUNiRFhgmUgk9-4qCuQypCmw"], "files": []}, {"n": 140, "ts": "2026. 8. 24 오후 1:48:18", "name": "정제균", "church": "선한목자교회", "ours": true, "title": "말씀 안의 평안", "place": "동해 앞바다", "when": "2024년 6. 21  여름 시작", "story": "끝없이 펼쳐진 하늘과 잔잔한 바다처럼, 하나님의 말씀 안에서 마음의 염려를 내려놓고 누리는 깊은 평안을 담았습니다.", "ids": ["1IwJ-LxBud1xlg6wAUYOndNeVLNroLj84"], "files": []}, {"n": 141, "ts": "2026. 8. 24 오후 9:56:45", "name": "김지원", "church": "선한목자교회", "ours": true, "title": "아브라함의 축복", "place": "미국 사이판 만세절벽", "when": "2026.04.10", "story": "별이 쏟아질 듯 가득한 이 사진을 볼 때면 창세기 22장에 하나님께서 아브라함에게 네 자손이 하늘의 별과 같고 바닷가의 모래와 같을 것이라 하신 말씀이 떠오릅니다. 다음에는 아브라함에게서 태어난 이삭이, 그다음에는 이삭의 후손인 모세가, 다윗이. 끝내는 예수님의 이야기까지 하나씩 읽어보면서 성경의 큰 흐름을 되짚어 보는 시간을 갖게 되기에 저는 이 사진을 고르게 되었습니다.", "ids": ["1anXO9W7morOLoL5axSeXRUP5G6eYt14J"], "files": []}, {"n": 142, "ts": "2026. 8. 24 오후 11:49:06", "name": "조유리", "church": "선한목자교회", "ours": true, "title": "사랑으로 이어지는 길", "place": "1.부산/ 2.속초/ 3.집", "when": "1.2025년10.09/2.2026년08.18/3. 2025.12.31", "story": "1. 내가 곧 길이요 진리요 생명이니(요14:6)\n말씀과 함께 하루를 걸었습니다. 눈앞에 펼쳐진 철길은 굽어 있어 그 너머가 보이지 않았지만, 선로는 분명한 방향을 따라 이어지고 있었습니다. 우리의 삶도 때로는 앞이 보이지 않고 어디로 이어질지 알 수 없지만, 예수님께서 친히 우리의 길이 되어 주십니다. 오늘도 말씀을 따라 한 걸음 내딛으며, 내가 길을 만드는 것이 아니라 주님이 인도하시는 길을 따라 걸어가기를 소망합니다.\n\n2. 세상과 하나님을 잇는 다리(고후5:20)\n서로 닿을 수 없던 곳을 연결해 주는 다리처럼, 하나님께서 우리를 세상 가운데 보내셔서 그리스도의 사랑을 전하는 사람으로 부르셨습니다. 끝없이 펼쳐진 바다처럼 넓은 세상속에서 내가 할 수 있는 일은 작아 보일지라도, 오늘도 말씀을 따라 살아가며 나의 말과 행동을 통해 누군가가 하나님께 가까이 나아갈 수 있기를 소망합니다. 내가 하나님께 받은 사랑이 나에게서 멈추지 않고 세상으로 흘러가는 다리가 되기를 기도합니다.\n\n3. 하나님은 사랑이시라(요일4:16)\n한해를 마무리하는 송구영신예배 때 가족들이 모여 앉아 두손에 하나님은 사랑이심을 고백하며 주님께 받은 한해 동안의 감사를 올려드렸습니다. 두 손에 소중히 담긴 작은 하트처럼, 하나님께서 먼저 부어 주신 사랑을 마음에 품고 살아가기를 소망합니다. 어둠 속에서 더욱 선명하게 빛나는 하나님의 사랑이 우리의 삶을 통해 빛나기를 기도합니다. \n\"예수님 사랑해요\" 제가 오늘 주님께 드릴 수 있는 가장 아름다운 사랑의 고백입니다.", "ids": ["1anFSeTm_efZG-mDYlE_9V0inzyVBnmvn", "1fx5WxiYn6W_DqBkIxg3vXRUJ5aQJV4Z5", "148cXPTIx7K46Np7finUyUQyTFZ_qATgY"], "files": []}, {"n": 143, "ts": "2026. 8. 25 오후 1:03:10", "name": "백승현", "church": "선한목자교회", "ours": true, "title": "다음세대 기도문", "place": "본당 로비", "when": "2026년 8월", "story": "타임캡슐에 넣을 아이들의\n기도제목 가운데 마음에 있는 말씀들을 쉬지않고 적어내려가며 오늘도 말씀과 함께했기 때문입니다", "ids": ["1YdVfZNyhHhcBtVN0K9hxQ8GiCNn3W_ao", "10FtQSo9kAUgbWVHMpxUCJeHFyzS9GbGK", "1shruT8o-LuH2JxBVWdf-LGCkoZVT99P1"], "files": []}, {"n": 144, "ts": "2026. 8. 25 오후 5:32:07", "name": "최미숙", "church": "선한목자교회", "ours": true, "title": "믿음을 지켜낸 사람들", "place": "튀르키에 성지순례", "when": "2024년 10월", "story": "성지순례가서 찍은 사진입니다.\n튀르키에 데린쿠유\n-기독교 박해를 피해 바위산 내부를 깎아 만든 교회와 수도원이 있는 곳\n\n오직 주님만 바라보며 믿음의 길을 걸었던 위대한 흔적들이 묻어있는 곳이라 말씀함께를 묵상하며 선진들의 믿음을 떠올려 보게 하는데 의미가 있다 생각합니다♡", "ids": ["1d3VIhNHhylmlGmh4AHtX56rIrm_jfBAl"], "files": []}, {"n": 145, "ts": "2026. 8. 25 오후 9:08:33", "name": "홍보선", "church": "선한목자교회", "ours": true, "title": "고요한 호수", "place": "일본 다자와 호수", "when": "2008년 6월 1일", "story": "교회 친구들과 함께한 산속 고요한 호수에서 주님을 생각하는 시간을 가집니다.", "ids": ["1OB7CrQYVk2n1gXBox9uKcenpmqcgrDbU"], "files": []}, {"n": 146, "ts": "2026. 8. 25 오후 9:10:30", "name": "홍보선", "church": "선한목자교회", "ours": true, "title": "주님과 함께", "place": "선한목자교회", "when": "2022년 5월 8일", "story": "코로나에도 주님과 함께합니다.", "ids": ["16Dox8ry3Ey5DLKrnmrF2_UgyAR_GA2Hs"], "files": []}, {"n": 147, "ts": "2026. 8. 26 오전 7:19:48", "name": "민성희", "church": "선한목자교회", "ours": true, "title": "주께로 가까이", "place": "중국에서 돌아오는 비행기안", "when": "2026년 8월 24일", "story": "믿지 않는 조카가 출장길에 찍어보내준 사진이에요 조카를 위해 기도중인데 하나님과 더 가까이 있으니 좋겠네 라며 이번주일에 교회가자고 얘기를 나눴습니다 출품동의완료", "ids": ["17ax-tS0SMM0biAfjdE3ehEXX_vJvI_95"], "files": []}, {"n": 148, "ts": "2026. 8. 26 오전 10:22:09", "name": "이승희", "church": "선한목자교회", "ours": true, "title": "신의 산", "place": "키르기스스탄", "when": "2026년 8월 19일", "story": "현대문명이 없는 대자연 속에서 신의 임재를 \n강하게 느끼고 감탄하게 되었던 날.\n기도하고 내려올 때 눈이 펑펑 내리기도…", "ids": ["1HmUnMb6xQsyvqhCjn9fsc0r4Ht0piDJO"], "files": []}, {"n": 149, "ts": "2026. 8. 26 오전 10:31:36", "name": "이승희", "church": "선한목자교회", "ours": true, "title": "현존", "place": "강릉 테라로사", "when": "2026년 8월 7일", "story": "창문의 격자를 보면 십자가가 생각나더라구요. 창문 너머 온세상을 주관하시는 주님 생각💓", "ids": ["1oVAnvWSq_puxEbsZ_QWr4S7uR0NQ6KMN"], "files": []}, {"n": 150, "ts": "2026. 8. 26 오전 11:30:12", "name": "정형수", "church": "선한목자교회", "ours": true, "title": "주여호와는광대하시도다", "place": "뉴질랜드", "when": "2023년 10월", "story": "광활한 대지 자연에서 하나님의 손길을 느꼈습니다", "ids": ["1zZpVjdvIO7OYEBrhsQLui5o-grEUGWPj", "1I6IIhz5MBXP17hmlXe5w3fwLwNKOyMWE", "1otIW56MkvY9NXysNvCJZAYNOpZjBZmDs", "1wwj7qNurm9vWxqB6jWnPHj1qSmBWYtdn"], "files": []}, {"n": 151, "ts": "2026. 8. 26 오후 3:13:05", "name": "이우람", "church": "선한목자교회", "ours": true, "title": "시내산", "place": "이집트 시내산", "when": "2026.7.28", "story": "이곳에서 나훔 3장을 선교팀과 함께 묵상했습니다. 애굽의 노아몬이 무너질 것이며 니느웨도 그렇게 될 것임을 묵상했는데 이곳에서 하나님을 다시 만나며 애굽 땅을 품게 되었기 때문입니다.", "ids": ["1QlCjpXQt9LxoWwpNClu0Rgzf1TNoGpGQ"], "files": []}, {"n": 152, "ts": "2026. 8. 27 오전 10:19:55", "name": "하예찬", "church": "선한목자교회", "ours": true, "title": "하나님의 뜻", "place": "제주 카페", "when": "2026. 07. 23.", "story": "출장 중에 어디로 가야할지, 어떻게 해야할지 모르겠을 때 주신 선명한 말씀이었습니다.", "ids": ["1CErQbLG3sS9hO-EnwkNvXI1iK33xBFh2"], "files": []}, {"n": 153, "ts": "2026. 8. 27 오전 10:55:22", "name": "김유진", "church": "선한목자교회", "ours": true, "title": "달빛십자가의 사랑과 위로", "place": "하남시 본인 침실", "when": "2026년 8월 늦은 여름밤", "story": "오늘 하루 주님과 동행 할 수 있었음이 감사드립니다. 현실과 세상의 소리에 휩쓸리는 순간에도 주님 곁에 단단히 붙들리도록 잡아주시니 나의 도움되시는 그 분만을 향한 믿음으로 주님을 바라봅니다. 고단한 하루 끝 침대에서 눈에 들어 온 멋진 십자가 달빛에 s": true, "title": "감사", "place": "집", "when": "2026년3월", "story": "일대일 양육수료 축하 꽃다발 사진 입니다\n공동체로 맺어 주심에 감사합니다", "ids": ["1HSGlKCWSY_wLMGy8dA07_4i6ZCKMQ170"], "files": []}, {"n": 166, "ts": "2026. 8. 19 오전 8:59:32", "name": "김봉희", "church": "선한목자교회", "ours": true, "title": "나그네된 인생길", "place": "강원도 강릉시 경포호수", "when": "2025년 1울", "story": "(시119:54)\n내가 나그네된 집에서 주의 율례들이 나의 노래가 되었나이다\n\n하늘을 홀로 나는 새처럼 하늘나라 소망을 가지고 이땅에서  나그네로 살아 가기를 소망합니다", "ids": ["1e3rZZNxijZkk86ZY1j6o5w11S1RyvZTf"], "files": []}, {"n": 167, "ts": "2026. 8. 19 오전 9:39:47", "name": "김봉희", "church": "선한목자교회", "ours": true, "title": "하나님의 산,시내산", "place": "시내산", "when": "2025년9월", "story": "출애굽후 하난님께서 백성들과 거하시면서 함께 하시기로 약속한 산입니다\n성경속의 모습과 거의 같은 모습으로 남아 있었습니다\n역사속에 거하시는 하나님을 만날수 있었습니다", "ids": ["1GcR6ezo7PYMoxC75xLqyDg2-Gaxn3eWO"], "files": []}, {"n": 168, "ts": "2026. 8. 19 오전 9:45:25", "name": "김봉희", "church": "선한목자교회", "ours": true, "title": "하나님의 산 시내산", "place": "시내산", "when": "2025년9월", "story": "출애굽후 모세 백성과 거하시며 함께 하시기로 약속한 산입니다\n상상한 성경의 모습과 거의 흡사했습니다\n역사속의 하나님을 만날수 있었습니다", "ids": ["1flyVD4nCgRdqQPmGslsVN4j6eQWOXP7X"], "files": []}, {"n": 169, "ts": "2026. 8. 24 오후 12:26:27", "name": "이상민", "church": "선한목자교회", "ours": true, "title": "빛과 은혜", "place": "장지천", "when": "2026년 4월", "story": "추운 겨울을 지나 때가 되면 어김없이 피어나는 벚꽃과 그 사이로 따스하게 스며드는 노을빛을 보며 하나님의 신실하신 섭리를 느꼈습니다. 우리의 삶에도 계절의 변화가 있지만, 어둠을 비추시는 주님의 빛 안에서 언젠가 아름다운 열매와 꽃을 피우게 하실 것을 믿는 감사의 마음을 담았습니다", "ids": ["1xg2LjXGz-P9xiwS_TUBHfeu8BtCr-hos"], "files": []}, {"n": 170, "ts": "2026. 8. 24 오후 12:29:56", "name": "이상민", "church": "선한목자교회", "ours": true, "title": "인도하심", "place": "가평", "when": "2026년6월", "story": "길게 뻗은 길을 바라보며 어디로 가야 할지 막막할 때가 있습니다. 하지만 푸른 하늘 위를 힘차게 날아오르는 새처럼, 하나님께서는 늘 우리 앞길을 예비하시고 독수리 날개 치며 올라감 같은 새 힘을 주십니다. 곧게 뻗은 이 길처럼 주님의 인도하심을 믿고 묵묵히 동행하는 삶이 되기를 소망하며 셔터를 눌렀습니다", "ids": ["1KoaPbU34d3cACRiUZ8FcICWwIEXVB_qt"], "files": []}, {"n": 171, "ts": "2026. 7. 28 오후 5:49:55", "name": "남 지영", "church": "선한목자교회 송파교구", "ours": true, "title": "세계에서 제일 작은
